        : s.pdf ? `<a class="btn wide" href="${s.url}" target="_blank" rel="noopener">Open PDF</a>`
        : `<img class="shot" src="${s.url}" alt="Certificate: ${esc(s.title)}">`}
      ${s.url ? `<a class="btn quiet wide" href="${s.url}" download="${esc(s.download)}">Download</a>` : ""}`;
  } else if (s.type === "delete-cert") {
    const c = S.certs.find((x) => x.id === s.id) || {};
    body = `<h2>Remove ${c.title ? "“" + esc(c.title) + "”" : "this certificate"}?</h2>
      <p class="lead">It comes off your list and its file is deleted. You can add it again later.</p>
      ${err}<button class="btn danger wide" data-act="delete-cert" data-id="${s.id}">Remove</button>`;
  } else if (s.type === "revoke-cert") {
    body = `<h2>Remove this certificate from ${esc(s.name)}?</h2>
      <p class="lead">It disappears from their Certificates tab. You can give it again later.</p>
      ${err}<button class="btn danger wide" data-act="revoke-cert" data-id="${s.id}">Remove</button>`;
  } else if (s.type === "password") {
    body = `<h2>Change your password</h2>${newPasswordForm(err)}`;
  } else if (s.type === "reject") {
    body = `<h2>Mark ${esc(s.name)}'s payment as not accepted?</h2>
      <form data-form="reject" data-student="${esc(s.student)}" data-kind="${esc(s.kind || "")}" data-post="${esc(s.post || "")}" novalidate>
        <label>Reason shown to the student

        ${err}
        <button class="btn danger wide">Mark as not accepted</button>
      </form>`;
  }
  return `<div class="sheet-back" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true">
    ${body}<button class="btn quiet wide" data-act="sheet-close">${close}</button></div></div>`;
}

  if (S.isAdmin) tabs.push(["admin", "Admin"]);
  tabs.push(["perks", "Perks"]);
  tabs.push(["certs", "Certs"]);
  tabs.push(["profile", "Profile"]);

  const onHero = S.tab === "home" && !S.pay && !S.post;

  app.innerHTML = `<header class="topbar${onHero ? " on-hero" : ""}">${brand}<button class="me" data-act="tab" data-tab="profile" aria-label="Your profile, ${esc(S.profile.email)}">${esc(meIni.toUpperCase() || "ME")}</button></header>

    <nav class="tabs${tabs.length > 5 ? " many" : ""}${tabs.length > 6 ? " lots" : ""}" aria-label="Sections"><div>${tabs.map(([k, l]) => {
      const m = /^(.*) \((\d+)\)$/.exec(l); const label = m ? m[1] : l;
      return `<button data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${icon(k)}<span>${label}</span>${m ? `<i class="badge">${m[2]}</i>` : ""}</button>`; }).join("")}</div></nav>`;
  overlay.innerHTML = viewSheet();

// Pictures are private files, so they are fetched after the page is drawn.
function loadPics() {
  document.querySelectorAll("img[data-path]:not([src])").forEach((img) => {
    imageUrl(img.dataset.bucket, img.dataset.path).then((u) => { img.src = u; }, () => { img.alt = "Picture couldn't be loaded"; });
  });
}
function afterRender() {
  loadPics();
  const car = document.getElementById("ann-carousel");
  if (car) {
    const n = car.children.length;
    S.carIndex = Math.min(S.carIndex, n - 1);
    car.scrollLeft = slideLeft(car, S.carIndex);
    car.addEventListener("scroll", () => {
      const i = Math.round(car.scrollLeft / Math.max(1, slideLeft(car, 1) || car.clientWidth));
      if (i === S.carIndex) return;
      S.carIndex = i;
      document.querySelectorAll(".car-dots button").forEach((b, k) => b.setAttribute("aria-current", k === i ? "true" : "false"));
      const c = document.getElementById("car-count"); if (c) c.textContent = (i + 1) + " / " + n;
    }, { passive: true });
  }
}
const picTag = (path, cls, alt) => `<img class="${cls}" data-bucket="post-images" data-path="${esc(path)}" alt="${esc(alt)}">`;

async function busy(btn, fn) {
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "Working…"; }
  try { await fn(); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}
const slideLeft = (car, i) => (car.children[i] ? car.children[i].offsetLeft - car.children[0].offsetLeft : 0);
function carouselTo(i) {
  const car = document.getElementById("ann-carousel");
  if (!car) return;
  const n = car.children.length;
  i = (i + n) % n;                                   // wrap around at either end
  car.scrollTo({ left: slideLeft(car, i), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

// Certificates are PDFs or pictures. Pictures are shrunk a little; PDFs go up as they are.
const CERT_MAX = 10 * 1024 * 1024;
async function prepareCertFile(file) {
  if (!file) return null;
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
    if (file.size > CERT_MAX) throw new Error("That PDF is over 10 MB. Try a smaller copy.");
    return { blob: file, ext: "pdf", type: "application/pdf", name: file.name };
  }
  if (/^image\//.test(file.type)) {
    const blob = await shrinkImage(file, 2400, 0.9);
    return { blob, ext: "jpg", type: "image/jpeg", name: file.name };
  }
  throw new Error("Choose a PDF, or a photo or screenshot of the certificate.");
}
async function uploadCertFile(folder, f) {
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${f.ext}`;
  const up = await sb.storage.from("certificates").upload(path, f.blob, { contentType: f.type });
  if (up.error) throw new Error(/mime type|exceeded the maximum|too large/i.test(up.error.message) ? "Use a PDF, JPG or PNG under 10 MB." : friendly(up.error));
  return path;
}

}

const forms = {
  "login": async (f) => {
    S.draft = { email: f.email };
    if (!f.email || !f.password) { S.authError = "Enter your email and password."; render(); return; }
    const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
    if (error) { S.authError = friendly(error); render(); }
  },
  "forgot": async (f) => {
    const email = (f.email || "").trim().toLowerCase();
    S.draft = { email };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { S.authError = "Enter the email you signed up with."; render(); return; }
    const opts = /^https?:$/.test(location.protocol) ? { redirectTo: location.origin + location.pathname } : {};
    const { error } = await sb.auth.resetPasswordForEmail(email, opts);
    if (error) { S.authError = friendly(error); render(); return; }
    S.authError = ""; S.pendingEmail = email; S.authView = "forgot-sent"; render();
  },
  "new-password": async (f) => {

    const fail = (msg) => { if (fromSheet) { S.sheet.error = msg; renderSheet(); } else { S.recoveryError = msg; render(); } };
    if ((f.password || "").length < 8) return fail("Choose a password with at least 8 characters.");
    if (f.password !== f.password2) return fail("The two passwords don't match.");
    const { error } = await sb.auth.updateUser({ password: f.password });
    if (error) return fail(/different from the old/i.test(error.message) ? "Choose a password different from your old one." : friendly(error));
    S.sheet = null; S.recoveryError = "";
    if (recovering) { recovering = false; history.replaceState(null, "", location.pathname); }
    render(); toast("New password saved");
  },
  "signup1": async (f) => {
    Object.assign(S.draft, f);

    if (!f.first_name.trim() || !f.last_name.trim()) err = "Enter your first and last name.";

  "signup2": async (f) => {

    if (S.v3) {
      row.audience_all = !!f.aud_all;
      row.audience_schools = row.audience_all ? [] : [...form.querySelectorAll("input[name=aud_school]:checked")].map((b) => b.value);
      if (f.is_event) {
        if (!f.date || !f.start) { toast("Add the event's date and start time."); return; }
        const start = new Date(`${f.date}T${f.start}`), end = f.end ? new Date(`${f.date}T${f.end}`) : null;
        if (isNaN(start)) { toast("Check the event's date and start time."); return; }
        if (end && end < start) { toast("The end time is before the start time."); return; }
        Object.assign(row, { event_start: start.toISOString(), event_end: end ? end.toISOString() : null,
          location: (f.location || "").trim() || null, signups_open: !!f.signups });
        if (S.v5) {
          const price = Math.round((Number(f.event_fee) || 0) * 100) / 100;

          const club = S.clubs.find((c) => c.id === clubId) || {};
          if (price > 0 && !club.pay_account_number && !club.pay_qr_path) { toast("Add the club's QR code or bank details first, under Membership fee on the club's page."); return; }
          row.event_fee = price;
        }

      for (const [k, f] of S.postFiles.entries()) {

  "add-cert": async (f) => {

      student_id: S.user.id, source: "outside", title, issuer: (f.issuer || "").trim() || null, issued_on: f.issued_on,
      file_path: path, credential_url: url || null, free_cert_key: f.free_cert_key || null });

  "give-certs": async (f, form) => {
    const m = S.manage, post = m.certFor, clubId = m.clubId;
    const fail = (msg) => { const el = document.getElementById("gc-error"); if (el) el.innerHTML = `<div class="error" role="alert">${esc(msg)}</div>`; else toast(msg); };
    const title = (f.title || "").trim(), award = (f.award || "").trim() || null;

    const to = [...form.querySelectorAll("input[name=to]:checked")].map((b) => b.value);

    // Skip students who already have this award for this event.
    const same = (c) => (c.award || "").toLowerCase() === (award || "").toLowerCase();
    const already = new Set((m.certGiven || []).filter(same).map((c) => c.student_id));
    const fresh = to.filter((sid) => !already.has(sid));
    if (!fresh.length) return fail(`Everyone ticked already has “${award || "this certificate"}” for this event.`);
    let path = null;
    if (m.certFile) { try { path = await uploadCertFile("club-" + clubId, m.certFile); } catch (e) { return fail(e.message); } }

      title, award, issued_on: f.issued_on, file_path: path }));
    const { error } = await sb.from("certificates").insert(rows);
    if (error) { if (path) sb.storage.from("certificates").remove([path]).catch(() => {}); return fail(friendly(error)); }
    const skipped = to.length - fresh.length;
    await openGiveCerts(post);
    toast(`Given to ${fresh.length} student${fresh.length === 1 ? "" : "s"}` + (skipped ? ` · ${skipped} already had it` : ""));

  "club-page": async (f) => {
    const m = S.manage, clubId = m.clubId, club = S.clubs.find((c) => c.id === clubId) || {}, p = pageState();
    const about = (f.about || "").trim();
    if (about.length > 3000) { toast("Keep About under 3000 characters."); return; }

      const path = `${clubId}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;

  },
  "club-fee": async (f) => {

    const club = S.clubs.find((c) => c.id === clubId);
    const fail = (msg) => { S.manage.feeError = msg; const el = document.getElementById("fee-error"); if (el) el.innerHTML = `<div class="error" role="alert">${esc(msg)}</div>`; };
    const fee = Math.round((Number(f.fee) || 0) * 100) / 100;
    const number = f.pay_account_number.trim(), bank = f.pay_bank.trim(), holder = f.pay_account_name.trim();

    if (number && (!bank || !holder)) return fail("Add the bank and the account name as well.");
    if (fee > 0 && !number && !S.manage.qrFile && !club.pay_qr_path) return fail("Add a QR code or a bank account so students can pay.");
    let qrPath = club.pay_qr_path || null;
    if (S.manage.qrFile) {
      const path = `${clubId}/qr-${Date.now()}.jpg`;
      const up = await sb.storage.from("club-qr").upload(path, S.manage.qrFile, { contentType: "image/jpeg" });
      if (up.error) return fail(friendly(up.error));
      qrPath = path;
    }
    const { error } = await sb.from("clubs").update({
      fee, pay_bank: bank || null, pay_account_name: holder || null, pay_account_number: number || null,
      pay_qr_path: qrPath, pay_note: f.pay_note.trim() || null
    }).eq("id", clubId);
    if (error) return fail(friendly(error));
    await loadData(); await loadManage(clubId); toast("Fee details saved");
  },
  "add-club": async (f) => {
    if (!f.name.trim()) { toast("Give the club a name."); return; }
    if (String(f.fee).trim() === "") { toast("Enter the membership fee. Type 0 only if the club is free."); return; }
    const fee = Math.round(Number(f.fee) * 100) / 100;
    if (!(fee >= 0) || fee > 9999) { toast("Enter a fee between 0 and 9999."); return; }
    const { error } = await sb.from("clubs").insert({ name: f.name.trim(), category: f.category.trim() || null, description: f.description.trim() || null, fee });

    toast(fee > 0 ? "Club added. Its committee now needs to add the payment details." : "Club added");

  "add-committee": async (f, form) => {
    const who = (f.who || "").trim();
    if (!who) { toast("Enter the student's email or student ID."); return; }
    const q = sb.from("students").select("id, first_name");
    const { data, error } = await (who.includes("@") ? q.eq("email", who.toLowerCase()) : q.eq("student_id", who)).maybeSingle();
    if (error) { toast(friendly(error)); return; }
    if (!data) { toast("No student found. They need to sign up first."); return; }
    const ins = await sb.from("club_committee").insert({ club_id: Number(form.dataset.club), student_id: data.id, role: f.role.trim() || null });
    if (ins.error) { toast(friendly(ins.error)); return; }
    await loadData(); await loadAdmin(); toast(data.first_name + " added to committee");
  }

document.addEventListener("click", (e) => {
  if (e.target.closest("a[href]")) return;
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("sheet-back") && e.target !== el) return;   // clicks inside the sheet don't close it
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el.dataset, el.tagName === "BUTTON" ? el : null)).catch((err) => toast(friendly(err)));
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  const fn = forms[form.dataset.form];
  const values = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector("button:not([type=button])");
  busy(btn, () => fn(values, form)).catch((err) => toast(friendly(err)));
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  const byId = (id) => document.getElementById(id);
  if (el.id === "f-school") {                       // a different school has different majors and minors
    for (const kind of courseKinds()) {
      byId("f-" + kind).innerHTML = courseOptions(kind, el.value, "").html;
      byId("f-" + kind + "-other-wrap").hidden = true;
      byId("f-" + kind + "-other").value = "";
    }
  }
  if (["f-major", "f-minor", "f-major2", "f-minor2"].includes(el.id)) {
    const wrap = byId(el.id + "-other-wrap");
    wrap.hidden = el.value !== OTHER;
    if (!wrap.hidden) byId(el.id + "-other").focus();
  }
  if (el.id === "my-colour-input" && S.sheet && S.sheet.type === "my-colour") saveMyColour(S.sheet.clubId, el.value);
  if (el.id === "club-colour-input" && S.manage.clubId != null) saveClubColour(el.value);
  if (el.id === "cal-m" || el.id === "cal-y") {
    S.calMonth = new Date(Number(byId("cal-y").value), Number(byId("cal-m").value), 1); S.calDay = null; render();
  }
  if (el.id === "a-club") S.postClub = Number(el.value) || null;
  if (el.id === "a-is-event") byId("a-event-fields").hidden = !el.checked;
  if (el.id === "a-pics") {
    const files = [...el.files].slice(0, 4);
    if (el.files.length > 4) toast("Only the first 4 pictures are used.");
    S.postFiles = [];
    for (const f of files) {
      try { const blob = await shrinkImage(f, 1600, 0.82); S.postFiles.push({ blob, url: URL.createObjectURL(blob) }); }
      catch (err) { toast(friendly(err)); }
    }
    byId("a-thumbs").innerHTML = S.postFiles.map((f) => `<img src="${f.url}" alt="Chosen picture">`).join("");
  }
  if (el.id === "a-aud-all") document.querySelectorAll("input[name=aud_school]").forEach((b) => { b.disabled = el.checked; if (el.checked) b.checked = false; });
  if (el.id === "ac-file" && S.sheet && S.sheet.type === "add-cert") {
    const sheet = S.sheet, note = byId("ac-file-note");
    try { sheet.file = await prepareCertFile(el.files[0]); sheet.error = ""; if (note) note.textContent = sheet.file ? sheet.file.name + " is ready." : ""; }
    catch (err) { sheet.file = null; el.value = ""; if (note) { note.textContent = err.message; note.setAttribute("role", "alert"); } }
  }
  if (el.id === "gc-file") {
    const m = S.manage, note = byId("gc-file-note");
    try { m.certFile = await prepareCertFile(el.files[0]); if (note) note.textContent = m.certFile ? m.certFile.name + " is ready." : ""; }
    catch (err) { m.certFile = null; el.value = ""; if (note) { note.textContent = err.message; note.setAttribute("role", "alert"); } }
  }
  if (el.id === "gc-all") document.querySelectorAll("input[name=to]").forEach((b) => { b.checked = el.checked; });
  if (el.name === "to") { const all = byId("gc-all"), boxes = [...document.querySelectorAll("input[name=to]")]; if (all) all.checked = boxes.every((b) => b.checked); }
  if (el.id === "pay-file" && S.pay) {
    const p = S.pay;
    try { p.file = await shrinkImage(el.files[0], 1400, 0.82); p.preview = URL.createObjectURL(p.file); p.error = ""; }
    catch (err) { p.file = null; p.preview = ""; p.error = friendly(err); }
    if (S.pay !== p) return;
    document.getElementById("pay-preview").innerHTML = p.preview ? `<img class="shot" src="${p.preview}" alt="Your payment screenshot">` : "";
    document.getElementById("pay-error").innerHTML = p.error ? `<div class="error" role="alert">${esc(p.error)}</div>` : "";
  }
  if ((el.id === "cp-cover" || el.id === "cp-logo" || el.id === "cp-photos") && S.manage.clubId != null) {
    const p = pageState(), files = [...el.files];
    try {
      if (el.id === "cp-photos") {
        const room = 12 - p.keep.length - p.add.length;
        if (files.length > room) toast(room ? `Only ${room} more photo${room === 1 ? "" : "s"} fit. A club page holds 12.` : "A club page holds 12 photos. Remove one first.");
        for (const f of files.slice(0, Math.max(0, room))) { const blob = await shrinkImage(f, 1600, 0.82); p.add.push({ blob, url: URL.createObjectURL(blob) }); }
      } else if (files[0]) {
        const blob = await shrinkImage(files[0], el.id === "cp-cover" ? 1800 : 600, 0.86);
        if (el.id === "cp-cover") { p.cover = { blob, url: URL.createObjectURL(blob) }; p.coverGone = false; }
        else { p.logo = { blob, url: URL.createObjectURL(blob) }; p.logoGone = false; }
      }
    } catch (err) { toast(friendly(err)); }
    refreshPageMedia();
  }
  if (el.id === "qr-file") {
    const m = S.manage;
    try { m.qrFile = await shrinkImage(el.files[0], 1200, 0.92); m.qrPreview = URL.createObjectURL(m.qrFile); m.feeError = ""; }
    catch (err) { m.qrFile = null; m.qrPreview = ""; m.feeError = friendly(err); }
    if (S.manage !== m) return;
    const shown = m.qrPreview || m.qrUrl;
    document.getElementById("qr-preview").innerHTML = shown ? `<img class="qr" src="${shown}" alt="The club's payment QR code">` : "";
    document.getElementById("fee-error").innerHTML = m.feeError ? `<div class="error" role="alert">${esc(m.feeError)}</div>` : "";
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "perk-search") {
    S.perkSearch = e.target.value;
    document.getElementById("perk-list").innerHTML = perkListHtml();
    return;
  }
  if (e.target.id !== "club-search") return;
  S.clubSearch = e.target.value;
  document.getElementById("club-list").innerHTML = clubListHtml();
  loadPics();
});

async function handleSession(session) {
  const uid = session && session.user ? session.user.id : null;
  if (uid === currentUid) return;
  currentUid = uid;
  const keepAuth = { authView: S.authView, draft: S.draft, pendingEmail: S.pendingEmail };
  reset();
  if (!uid) { Object.assign(S, keepAuth.authView === "check" ? keepAuth : {}, { phase: "auth" }); render(); return; }
  S.user = session.user; render();
  try { await loadAccount(); }
  catch (err) { S.phase = "fatal"; S.fatal = friendly(err); }
  if (currentUid === uid) render();
}

(function start() {
  if (!window.supabase) {
    S.phase = "fatal"; S.fatal = "The app couldn't load. Check your internet connection and reload the page."; render(); return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") recovering = true;     // arrived from a reset-password email
    setTimeout(async () => { await handleSession(session); if (recovering) render(); }, 0);
  });
  render();
})();
</script>
