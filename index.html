  "approve": (d, btn) => busy(btn, async () => {
    const clubId = S.manage.clubId;
    const { error } = d.kind === "event"
      ? await sb.from("event_signups").update({ status: "confirmed" }).eq("announcement_id", Number(d.post)).eq("student_id", d.student)
      : await sb.from("memberships").update({ status: "active" }).eq("club_id", clubId).eq("student_id", d.student);
    if (error) { toast(friendly(error)); return; }
    await loadData(); await loadManage(clubId); toast("Payment approved");
  }),
  "ask-password": () => { S.sheet = { type: "password" }; renderSheet(); },
  "edit": () => { S.editing = true; S.editDraft = null; S.formError = ""; render(); },
  "edit-cancel": () => { S.editing = false; S.editDraft = null; S.formError = ""; render(); },
  "manage": async (d) => {
    S.tab = "manage"; window.scrollTo(0, 0);
    await loadManage(Number(d.club));
    if (d.focus) { const el = document.getElementById(d.focus); if (el) { el.scrollIntoView({ block: "start" }); const f = el.querySelector("input"); if (f) f.focus({ preventScroll: true }); } }
  },
  "manage-back": () => { S.manage = emptyManage(); render(); },
  "admin-open": (d) => { const id = Number(d.club); S.admin.open = S.admin.open === id ? null : id; render(); },

  "join": (d, btn) => busy(btn, async () => {
    const clubId = Number(d.club);
    if (my(clubId)) await sb.from("memberships").delete().eq("student_id", S.user.id).eq("club_id", clubId);
    const { error } = await sb.from("memberships").insert({ student_id: S.user.id, club_id: clubId });
    if (error && error.code !== "23505") { S.sheet.error = friendly(error); renderSheet(); return; }
    S.sheet = null; await loadData(); render(); toast("Joined " + clubName(clubId));
  }),
  "leave": (d, btn) => busy(btn, async () => {
    const clubId = Number(d.club);
    const { error } = await sb.from("memberships").delete().eq("student_id", S.user.id).eq("club_id", clubId);
    if (error) { S.sheet.error = friendly(error); renderSheet(); return; }
    const was = (my(clubId) || {}).status;
    S.sheet = null; await loadData(); render();
    toast(was === "pending" ? "Request cancelled" : was === "rejected" ? "Removed" : "Left " + clubName(clubId));
  }),
  "delete-post": (d, btn) => busy(btn, async () => {
    const id = Number(d.id);
    const { error } = await sb.from("announcements").delete().eq("id", id);
    if (error) { S.sheet.error = friendly(error); renderSheet(); return; }
    S.sheet = null; if (S.post === id) S.post = null;
    await loadData();
    if (S.tab === "manage" && S.manage.clubId != null) await loadManage(S.manage.clubId); else render();
    toast("Announcement deleted");
  }),
  "copy-members": () => {
    const head = ["First name", "Last name", "Student ID", "Year", "School", "Major", "Second major", "Minor", "Second minor", "Email", "Phone", "Joined", "Paid (RM)", "Reference", "Approved on"];
    const clean = (v) => String(v ?? "").replace(/[\t\r\n]+/g, " ");
    const rows = S.manage.members.filter((r) => r.status === "active").map((r) => { const s = r.students;
      return [s.first_name, s.last_name, s.student_id, s.year, s.school, s.major, s.major2, s.minor, s.minor2, s.email, s.phone, day(r.joined_at), r.paid_amount, r.pay_ref, r.checked_at ? day(r.checked_at) : ""].map(clean).join("\t"); });
    return copyText([head.join("\t"), ...rows].join("\n"), "Copied. Paste it into a Google Sheet.");
  },
  "toggle-club": (d, btn) => busy(btn, async () => {
    const c = S.clubs.find((x) => x.id === Number(d.club));
    const { error } = await sb.from("clubs").update({ is_active: !c.is_active }).eq("id", c.id);
    if (error) { toast(friendly(error)); return; }
    await loadData(); render();
  }),
  "remove-committee": (d, btn) => busy(btn, async () => {
    const { error } = await sb.from("club_committee").delete().eq("club_id", Number(d.club)).eq("student_id", d.student);
    if (error) { toast(friendly(error)); return; }
    await loadData(); await loadAdmin(); toast("Removed from committee");
  })
};

const forms = {
  "login": async (f) => {
    S.draft = { email: f.email };
    if (!f.email || !f.password) { S.authError = "Enter your email and password."; render(); return; }
    const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
    if (error) { S.authError = friendly(error); render(); }
  },
  "forgot": async (f) => {
    const email = (f.email || "").trim().toLowerCase();
    S.draft = { email };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { S.authError = "Enter the email you signed up with."; render(); return; }
    const opts = /^https?:$/.test(location.protocol) ? { redirectTo: location.origin + location.pathname } : {};
    const { error } = await sb.auth.resetPasswordForEmail(email, opts);
    if (error) { S.authError = friendly(error); render(); return; }
    S.authError = ""; S.pendingEmail = email; S.authView = "forgot-sent"; render();
  },
  "new-password": async (f) => {
    const fromSheet = !!(S.sheet && S.sheet.type === "password");
    const fail = (msg) => { if (fromSheet) { S.sheet.error = msg; renderSheet(); } else { S.recoveryError = msg; render(); } };
    if ((f.password || "").length < 8) return fail("Choose a password with at least 8 characters.");
    if (f.password !== f.password2) return fail("The two passwords don't match.");
    const { error } = await sb.auth.updateUser({ password: f.password });
    if (error) return fail(/different from the old/i.test(error.message) ? "Choose a password different from your old one." : friendly(error));
    S.sheet = null; S.recoveryError = "";
    if (recovering) { recovering = false; history.replaceState(null, "", location.pathname); }
    render(); toast("New password saved");
  },
  "signup1": async (f) => {
    Object.assign(S.draft, f);
    const email = (f.email || "").trim().toLowerCase();
    let err = "";
    if (!f.first_name.trim() || !f.last_name.trim()) err = "Enter your first and last name.";
    else if (!f.student_id.trim()) err = "Enter your Monash student ID.";
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) err = "Enter a valid email address.";
    else if (CONFIG.ALLOWED_EMAIL_ENDINGS.length && !CONFIG.ALLOWED_EMAIL_ENDINGS.some((e) => email.endsWith(e.toLowerCase())))
      err = "Use your student email (" + CONFIG.ALLOWED_EMAIL_ENDINGS.join(" or ") + ").";
    else if ((f.password || "").length < 8) err = "Choose a password with at least 8 characters.";
    S.authError = err; if (!err) S.authView = "signup2";
    render();
  },
  "signup2": async (f) => {
    Object.assign(S.draft, f);
    const row = profileRow(S.draft);
    const err = checkProfile(row);
    if (err) { S.authError = err; render(); return; }
    const email = S.draft.email.trim().toLowerCase();
    const opts = { data: row };
    if (/^https?:$/.test(location.protocol)) opts.emailRedirectTo = location.origin + location.pathname;
    const { data, error } = await sb.auth.signUp({ email, password: S.draft.password, options: opts });
    if (error) { S.authError = friendly(error); render(); return; }
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      S.authError = "An account with this email already exists. Log in instead."; S.authView = "login"; S.draft = { email }; render(); return;
    }
    if (!data.session) { S.pendingEmail = email; S.authView = "check"; S.authError = ""; S.draft = { email }; render(); }
  },
  "profile-create": async (f) => {
    const row = profileRow(f); S.draft = row;
    const err = checkProfile(row);
    if (err) { S.formError = err; render(); return; }
    const { data, error } = await sb.from("students").insert({ id: S.user.id, email: S.user.email, ...dbRow(row) }).select().single();
    if (error) { S.formError = friendly(error); render(); return; }
    S.profile = data; S.formError = ""; S.draft = {};
    await loadData(); S.phase = "main"; render(); toast("Profile saved");
  },
  "profile-update": async (f) => {
    const row = profileRow(f);
    const err = checkProfile(row);
    if (err) { S.formError = err; S.editDraft = f; render(); return; }
    const { data, error } = await sb.from("students").update(dbRow(row)).eq("id", S.user.id).select().single();
    if (error) { S.formError = friendly(error); S.editDraft = f; render(); return; }
    S.profile = data; S.editing = false; S.editDraft = null; S.formError = ""; render(); toast("Details updated");
  },
  "post": async (f, form) => {
    if (!f.club_id) { toast("Choose which club this is for."); return; }
    if (!f.title.trim() || !f.body.trim()) { toast("Write a title and a message."); return; }
    const clubId = Number(f.club_id);
    const row = { club_id: clubId, author_id: S.user.id, title: f.title.trim(), body: f.body.trim() };
    if (S.v3) {
      row.audience_all = !!f.aud_all;
      row.audience_schools = row.audience_all ? [] : [...form.querySelectorAll("input[name=aud_school]:checked")].map((b) => b.value);
      if (f.is_event) {
        if (!f.date || !f.start) { toast("Add the event's date and start time."); return; }
        const start = new Date(`${f.date}T${f.start}`), end = f.end ? new Date(`${f.date}T${f.end}`) : null;
        if (isNaN(start)) { toast("Check the event's date and start time."); return; }
        if (end && end < start) { toast("The end time is before the start time."); return; }
        Object.assign(row, { event_start: start.toISOString(), event_end: end ? end.toISOString() : null,
          location: (f.location || "").trim() || null, signups_open: !!f.signups });
        if (S.v5) {
          const price = Math.round((Number(f.event_fee) || 0) * 100) / 100;
          if (price < 0 || price > 9999) { toast("Enter a price between 0 and 9999."); return; }
          if (price > 0 && !row.signups_open) { toast("A paid event needs sign-ups switched on."); return; }
          const club = S.clubs.find((c) => c.id === clubId) || {};
          if (price > 0 && !club.pay_account_number && !club.pay_qr_path) { toast("Add the club's QR code or bank details first, under Membership fee on the club's page."); return; }
          row.event_fee = price;
        }
      }
    }
    if (S.v7 && S.postFiles.length) {                  // upload pictures first, filed under the club
      const paths = [];
      for (const [k, f] of S.postFiles.entries()) {
        const path = `${clubId}/${Date.now()}-${k}.jpg`;
        const up = await sb.storage.from("post-images").upload(path, f.blob, { contentType: "image/jpeg" });
        if (up.error) { toast(friendly(up.error)); return; }
        paths.push(path);
      }
      row.image_paths = paths;
    }
    const { error } = await sb.from("announcements").insert(row);
    if (error) { toast(friendly(error)); return; }
    S.postFiles = []; S.postClub = clubId;               // keep the same club picked for the next post
    await loadData();
    render(); window.scrollTo(0, 0);
    toast((row.audience_all ? "Posted to all students" : "Posted") + " for " + clubName(clubId));
  },
  "pay": async () => {
    const p = S.pay, clubId = p.clubId, uid = S.user.id;
    const fail = (msg) => { p.error = msg; if (S.pay === p) render(); };
    if (!p.file) return fail("Add your payment screenshot first.");
    if (p.postId) {                                     // paying for an event
      const path = `${uid}/e${p.postId}-${Date.now()}.jpg`;
      const up = await sb.storage.from("receipts").upload(path, p.file, { contentType: "image/jpeg" });
      if (up.error) return fail(friendly(up.error));
      if (S.signups.has(p.postId)) {                    // trying again after a payment was not accepted
        const del = await sb.from("event_signups").delete().eq("student_id", uid).eq("announcement_id", p.postId);
        if (del.error) return fail(friendly(del.error));
      }
      const { error } = await sb.from("event_signups").insert({ announcement_id: p.postId, student_id: uid, receipt_path: path });
      if (error) { await loadData().catch(() => {}); return fail(/row-level security|42501/.test(error.message + error.code) ? "Sign-ups for this event have closed." : friendly(error)); }
      S.pay = null; await loadData(); render(); window.scrollTo(0, 0); toast("Sent. Your place is confirmed once the committee checks your payment.");
      return;
    }
    const path = `${uid}/${clubId}-${Date.now()}.jpg`;
    const up = await sb.storage.from("receipts").upload(path, p.file, { contentType: "image/jpeg" });
    if (up.error) return fail(friendly(up.error));
    if (my(clubId)) {                                   // trying again after a payment was not accepted
      const del = await sb.from("memberships").delete().eq("student_id", uid).eq("club_id", clubId);
      if (del.error) return fail(friendly(del.error));
    }
    const { error } = await sb.from("memberships").insert({ student_id: uid, club_id: clubId, receipt_path: path });
    if (error) { await loadData().catch(() => {}); return fail(friendly(error)); }
    S.pay = null; await loadData(); render(); window.scrollTo(0, 0); toast("Sent to the committee for checking");
  },
  "reject": async (f, form) => {
    const clubId = S.manage.clubId;
    const change = { status: "rejected", reject_reason: f.reason.trim() || null };
    const { error } = form.dataset.kind === "event"
      ? await sb.from("event_signups").update(change).eq("announcement_id", Number(form.dataset.post)).eq("student_id", form.dataset.student)
      : await sb.from("memberships").update(change).eq("club_id", clubId).eq("student_id", form.dataset.student);
    if (error) { S.sheet.error = friendly(error); renderSheet(); return; }
    S.sheet = null; await loadData(); await loadManage(clubId); toast("Marked as not accepted");
  },
  "club-info": async (f, form) => {
    const clubId = S.manage.clubId, name = f.name.trim();
    if (!name) { toast("Give the club a name."); return; }
    const change = { name, category: f.category.trim() || null, description: f.description.trim() || null };
    if (S.v7) {
      change.fit_schools = [...form.querySelectorAll("input[name=fit_school]:checked")].map((b) => b.value);
      change.fit_majors = [...new Set([...form.querySelectorAll("input[name=fit_major]:checked")].map((b) => b.value))];
    }
    const { error } = await sb.from("clubs").update(change).eq("id", clubId);
    if (error) { toast(friendly(error)); return; }
    await loadData(); await loadManage(clubId); toast("Club details saved");
  },
  "club-fee": async (f) => {
    const clubId = S.manage.clubId;
    const club = S.clubs.find((c) => c.id === clubId);
    const fail = (msg) => { S.manage.feeError = msg; const el = document.getElementById("fee-error"); if (el) el.innerHTML = `<div class="error" role="alert">${esc(msg)}</div>`; };
    const fee = Math.round((Number(f.fee) || 0) * 100) / 100;
    const number = f.pay_account_number.trim(), bank = f.pay_bank.trim(), holder = f.pay_account_name.trim();
    if (fee < 0 || fee > 9999) return fail("Enter a fee between 0 and 9999.");
    if (number && (!bank || !holder)) return fail("Add the bank and the account name as well.");
    if (fee > 0 && !number && !S.manage.qrFile && !club.pay_qr_path) return fail("Add a QR code or a bank account so students can pay.");
    let qrPath = club.pay_qr_path || null;
    if (S.manage.qrFile) {
      const path = `${clubId}/qr-${Date.now()}.jpg`;
      const up = await sb.storage.from("club-qr").upload(path, S.manage.qrFile, { contentType: "image/jpeg" });
      if (up.error) return fail(friendly(up.error));
      qrPath = path;
    }
    const { error } = await sb.from("clubs").update({
      fee, pay_bank: bank || null, pay_account_name: holder || null, pay_account_number: number || null,
      pay_qr_path: qrPath, pay_note: f.pay_note.trim() || null
    }).eq("id", clubId);
    if (error) return fail(friendly(error));
    await loadData(); await loadManage(clubId); toast("Fee details saved");
  },
  "add-club": async (f) => {
    if (!f.name.trim()) { toast("Give the club a name."); return; }
    if (String(f.fee).trim() === "") { toast("Enter the membership fee. Type 0 only if the club is free."); return; }
    const fee = Math.round(Number(f.fee) * 100) / 100;
    if (!(fee >= 0) || fee > 9999) { toast("Enter a fee between 0 and 9999."); return; }
    const { error } = await sb.from("clubs").insert({ name: f.name.trim(), category: f.category.trim() || null, description: f.description.trim() || null, fee });
    if (error) { toast(friendly(error)); return; }
    await loadData(); await loadAdmin();
    toast(fee > 0 ? "Club added. Its committee now needs to add the payment details." : "Club added");
  },
  "add-committee": async (f, form) => {
    const who = (f.who || "").trim();
    if (!who) { toast("Enter the student's email or student ID."); return; }
    const q = sb.from("students").select("id, first_name");
    const { data, error } = await (who.includes("@") ? q.eq("email", who.toLowerCase()) : q.eq("student_id", who)).maybeSingle();
    if (error) { toast(friendly(error)); return; }
    if (!data) { toast("No student found. They need to sign up first."); return; }
    const ins = await sb.from("club_committee").insert({ club_id: Number(form.dataset.club), student_id: data.id, role: f.role.trim() || null });
    if (ins.error) { toast(friendly(ins.error)); return; }
    await loadData(); await loadAdmin(); toast(data.first_name + " added to committee");
  }
};

document.addEventListener("click", (e) => {
  if (e.target.closest("a[href]")) return;
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("sheet-back") && e.target !== el) return;   // clicks inside the sheet don't close it
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el.dataset, el.tagName === "BUTTON" ? el : null)).catch((err) => toast(friendly(err)));
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  const fn = forms[form.dataset.form];
  const values = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector("button:not([type=button])");
  busy(btn, () => fn(values, form)).catch((err) => toast(friendly(err)));
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  const byId = (id) => document.getElementById(id);
  if (el.id === "f-school") {                       // a different school has different majors and minors
    for (const kind of courseKinds()) {
      byId("f-" + kind).innerHTML = courseOptions(kind, el.value, "").html;
      byId("f-" + kind + "-other-wrap").hidden = true;
      byId("f-" + kind + "-other").value = "";
    }
  }
  if (["f-major", "f-minor", "f-major2", "f-minor2"].includes(el.id)) {
    const wrap = byId(el.id + "-other-wrap");
    wrap.hidden = el.value !== OTHER;
    if (!wrap.hidden) byId(el.id + "-other").focus();
  }
  if (el.id === "my-colour-input" && S.sheet && S.sheet.type === "my-colour") saveMyColour(S.sheet.clubId, el.value);
  if (el.id === "club-colour-input" && S.manage.clubId != null) saveClubColour(el.value);
  if (el.id === "cal-m" || el.id === "cal-y") {
    S.calMonth = new Date(Number(byId("cal-y").value), Number(byId("cal-m").value), 1); S.calDay = null; render();
  }
  if (el.id === "a-club") S.postClub = Number(el.value) || null;
  if (el.id === "a-is-event") byId("a-event-fields").hidden = !el.checked;
  if (el.id === "a-pics") {
    const files = [...el.files].slice(0, 4);
    if (el.files.length > 4) toast("Only the first 4 pictures are used.");
    S.postFiles = [];
    for (const f of files) {
      try { const blob = await shrinkImage(f, 1600, 0.82); S.postFiles.push({ blob, url: URL.createObjectURL(blob) }); }
      catch (err) { toast(friendly(err)); }
    }
    byId("a-thumbs").innerHTML = S.postFiles.map((f) => `<img src="${f.url}" alt="Chosen picture">`).join("");
  }
  if (el.id === "a-aud-all") document.querySelectorAll("input[name=aud_school]").forEach((b) => { b.disabled = el.checked; if (el.checked) b.checked = false; });
  if (el.id === "pay-file" && S.pay) {
    const p = S.pay;
    try { p.file = await shrinkImage(el.files[0], 1400, 0.82); p.preview = URL.createObjectURL(p.file); p.error = ""; }
    catch (err) { p.file = null; p.preview = ""; p.error = friendly(err); }
    if (S.pay !== p) return;
    document.getElementById("pay-preview").innerHTML = p.preview ? `<img class="shot" src="${p.preview}" alt="Your payment screenshot">` : "";
    document.getElementById("pay-error").innerHTML = p.error ? `<div class="error" role="alert">${esc(p.error)}</div>` : "";
  }
  if (el.id === "qr-file") {
    const m = S.manage;
    try { m.qrFile = await shrinkImage(el.files[0], 1200, 0.92); m.qrPreview = URL.createObjectURL(m.qrFile); m.feeError = ""; }
    catch (err) { m.qrFile = null; m.qrPreview = ""; m.feeError = friendly(err); }
    if (S.manage !== m) return;
    const shown = m.qrPreview || m.qrUrl;
    document.getElementById("qr-preview").innerHTML = shown ? `<img class="qr" src="${shown}" alt="The club's payment QR code">` : "";
    document.getElementById("fee-error").innerHTML = m.feeError ? `<div class="error" role="alert">${esc(m.feeError)}</div>` : "";
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "perk-search") {
    S.perkSearch = e.target.value;
    document.getElementById("perk-list").innerHTML = perkListHtml();
    return;
  }
  if (e.target.id !== "club-search") return;
  S.clubSearch = e.target.value;
  document.getElementById("club-list").innerHTML = clubListHtml();
});

async function handleSession(session) {
  const uid = session && session.user ? session.user.id : null;
  if (uid === currentUid) return;
  currentUid = uid;
  const keepAuth = { authView: S.authView, draft: S.draft, pendingEmail: S.pendingEmail };
  reset();
  if (!uid) { Object.assign(S, keepAuth.authView === "check" ? keepAuth : {}, { phase: "auth" }); render(); return; }
  S.user = session.user; render();
  try { await loadAccount(); }
  catch (err) { S.phase = "fatal"; S.fatal = friendly(err); }
  if (currentUid === uid) render();
}

(function start() {
  if (!window.supabase) {
    S.phase = "fatal"; S.fatal = "The app couldn't load. Check your internet connection and reload the page."; render(); return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") recovering = true;     // arrived from a reset-password email
    setTimeout(async () => { await handleSession(session); if (recovering) render(); }, 0);
  });
  render();
})();
