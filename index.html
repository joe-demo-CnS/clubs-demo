<style>
/* Layout: one phone-width column, like a campus notice board. Sticky title bar on top, tab bar at the bottom. */
:root {
  --bg: #EEF2F4;
  --surface: #FFFFFF;
  --ink: #12202A;
  --muted: #5B6B76;
  --line: #D6DEE3;
  --accent: #0A6B63;
  --accent-ink: #FFFFFF;
  --soft: #E0F0EE;
  --mark: #F4C430;
  --mark-ink: #3A2E00;
  --danger: #B3261E;
  --danger-soft: #FBE9E7;
  --shadow: 0 1px 2px rgba(18, 32, 42, .06), 0 4px 14px rgba(18, 32, 42, .06);
  --display: "Bricolage Grotesque", "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E161B;
    --surface: #17222A;
    --ink: #E7EEF2;
    --muted: #93A4AF;
    --line: #2A3842;
    --accent: #46C2B5;
    --accent-ink: #062421;
    --soft: #13302E;
    --mark: #F0C02E;
    --mark-ink: #2B2200;
    --danger: #FF8A80;
    --danger-soft: #3A1E1C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

.shell { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 12px;
  background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
.brand { font: 700 1.15rem var(--display); letter-spacing: -.01em; }
.brand i { display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: var(--mark); margin-right: .4em; }
.who { color: var(--muted); font-size: .85rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { flex: 1; padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.lead { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs div { max-width: 480px; margin: 0 auto; display: flex; }
.tabs button {
  flex: 1; border: 0; background: none; cursor: pointer;
  padding: 12px 4px 11px; font-size: .82rem; font-weight: 600; color: var(--muted);
  border-top: 3px solid transparent;
}
.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.notice { position: relative; padding-top: 22px; box-shadow: var(--shadow); border-color: transparent; }
.notice::before {
  content: ""; position: absolute; top: -6px; left: 18px; width: 13px; height: 13px; border-radius: 50%;
  background: var(--mark); box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.notice .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.notice.tap { cursor: pointer; }
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-block: 10px 4px; scrollbar-width: none; overscroll-behavior-x: contain; }
.carousel::-webkit-scrollbar { display: none; }
.carousel > .slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; }
.car-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.car-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; flex: 1; }
.car-dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: var(--line); cursor: pointer; }
.car-dots button[aria-current="true"] { background: var(--accent); width: 20px; border-radius: 999px; }
img.cover { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: var(--soft); display: block; }
.post-pics { display: flex; flex-direction: column; gap: 10px; }
.post-pics img { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.card.rec { flex-direction: row; align-items: center; gap: 12px; }
.rec .grow p { margin-top: 2px; }
details.fit { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
details.fit summary { cursor: pointer; font-weight: 600; font-size: .92rem; }
details.fit .stack { gap: 8px; margin-top: 8px; }
.notice.tap .body { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.notice.tap:hover { box-shadow: 0 0 0 2px var(--line), var(--shadow); }
.titlelink { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.post-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.02rem; }
.meta { color: var(--muted); font-size: .84rem; }
.chip {
  display: inline-block; font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--accent);
}
.chip.mark { background: var(--mark); color: var(--mark-ink); }
.chip.off { background: var(--line); color: var(--muted); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.amount { font: 700 2.1rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.ref { font: 700 1.45rem/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .03em; overflow-wrap: anywhere; }
.when { font-weight: 700; color: var(--accent); }
a.btn { display: inline-block; text-decoration: none; text-align: center; }
label.check { flex-direction: row; align-items: center; gap: 10px; font-weight: 500; font-size: .95rem; }
label.check input { width: 20px; height: 20px; flex: none; margin: 0; accent-color: var(--accent); }
fieldset.aud { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
fieldset.aud legend { font-weight: 700; font-size: .88rem; padding: 0 6px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { text-align: center; font-size: .72rem; font-weight: 700; letter-spacing: .06em; color: var(--muted); padding-block: 4px; }
.cal-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cal-head select { width: auto; flex: 1 1 7rem; padding: 8px 10px; font-weight: 700; }
.cal .day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0 6px; min-height: 50px;
  border: 0; border-radius: 10px; background: transparent; font: 600 .95rem var(--body); font-variant-numeric: tabular-nums; color: var(--ink); }
button.day { cursor: pointer; }
.cal .day .n { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; }
.cal .day.out { color: var(--muted); opacity: .5; font-weight: 400; }
.cal .day.today .n { background: var(--accent); color: var(--accent-ink); }
.cal .day.sel { box-shadow: inset 0 0 0 2px var(--accent); background: var(--soft); }
.dots { display: flex; gap: 3px; height: 7px; align-items: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.dots b { font-size: .62rem; line-height: 7px; color: var(--muted); }
.chip.club { background: color-mix(in srgb, var(--club) 18%, var(--surface)); color: var(--ink); }
.chip.club::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--club); margin-right: 6px; vertical-align: 1px; }
.sw-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--surface); background: var(--c); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--ink); }
.swatches .anycol { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; }
.swatches input[type=color] { width: 40px; height: 34px; padding: 2px; border-radius: 10px; cursor: pointer; }
.dots i { box-shadow: 0 0 0 1px rgba(0, 0, 0, .12); }
button.chip { border: 0; cursor: pointer; font: inherit; font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.tabs.many button { font-size: .74rem; padding-inline: 1px; }
.price { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
img.qr { width: 100%; max-width: 260px; align-self: center; background: #fff; padding: 8px; border-radius: 10px; border: 1px solid var(--line); }
img.shot { max-width: 100%; max-height: 320px; align-self: center; border-radius: 10px; border: 1px solid var(--line); }
.sheet img.shot { max-height: none; }
.cat { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; border-color: var(--line); color: var(--ink); font-weight: 600; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.small { padding: 7px 12px; font-size: .88rem; }
.btn.wide { width: 100%; padding: 13px 16px; }
.btn:disabled { opacity: .55; cursor: default; }
.link { border: 0; background: none; color: var(--accent); font-weight: 700; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

form { display: flex; flex-direction: column; gap: 14px; }
label { display: flex; flex-direction: column; gap: 5px; font-size: .88rem; font-weight: 600; }
label small { font-weight: 400; color: var(--muted); }
input, select, textarea {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-size: 1rem;
}
textarea { min-height: 110px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.error { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: .92rem; font-weight: 600; }
.note { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.steps { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

.seg { display: flex; background: var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }

dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
dt { color: var(--muted); font-size: .88rem; }
dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; }

.empty { text-align: center; color: var(--muted); padding: 28px 16px; border: 1px dashed var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 18, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0;
  padding: 22px 18px calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; gap: 14px;
  max-height: 92dvh; overflow-y: auto;
}
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; z-index: 30;
  max-width: calc(100% - 32px);
}
/* Perks: a two-column shelf of tiles, each opens the service's site */
.perk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
a.perk {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  display: flex; flex-direction: column; gap: 8px; min-width: 0; color: var(--ink); text-decoration: none;
}
a.perk:hover { border-color: var(--accent); }
a.perk:active { transform: scale(.98); }
.mono.logo { background: var(--line); padding: 0; overflow: hidden; }
.mono.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mono { width: 46px; height: 46px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center;
  font: 700 .82rem/1 var(--display); letter-spacing: .02em; text-align: center; padding: 2px; }
a.perk h3 { font-size: .95rem; overflow-wrap: anywhere; }
a.perk .meta { font-size: .8rem; }
a.perk .go { margin-top: auto; font-size: .82rem; font-weight: 700; color: var(--accent); }
@media (max-width: 340px) { .perk-grid { grid-template-columns: 1fr; } }
.center { min-height: 60dvh; display: flex; align-items: center; justify-content: center; color: var(--muted); }
@media (max-width: 360px) { .two { grid-template-columns: 1fr; } }
</style>
</head>

function friendly(err) {
  const m = (err && (err.message || err.error_description)) || String(err || "Something went wrong.");
  const code = err && err.code;
  if (code === "23505" && /student_id/.test(m + (err.details || ""))) return "That student ID is already registered to another account.";
  if (code === "23505" && /clubs_name/.test(m)) return "A club with that name already exists.";
  if (code === "23505" && /club_committee/.test(m)) return "That student is already on this committee.";
  if (code === "23505" && /memberships/.test(m)) return "You have already joined this club.";
  if (code === "23514" && /major_or_minor/.test(m)) return "From Year 2 onwards, choose your major or a minor.";
  if (/receipt_required/.test(m)) return "Add your payment screenshot first.";
  if (/own_payment/.test(m)) return "Another committee member has to check your own payment.";
  if (/mime type|exceeded the maximum|too large/i.test(m)) return "Use a JPG or PNG image under 5 MB.";
  if (code === "42501" || /row-level security/i.test(m)) return "You don't have permission to do that.";
  if (/Invalid login credentials/i.test(m)) return "Wrong email or password.";
  if (/Email not confirmed/i.test(m)) return "Confirm your email first. Open the link we sent to your inbox, then log in.";
  if (/not authorized/i.test(m) && /email/i.test(m)) return "The confirmation email could not be sent to this address. The project's email sender is still in test mode.";
  if (/rate limit/i.test(m)) return "Too many emails were sent in the last hour. Wait a while and try again.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Can't reach the server. Check your internet connection and try again.";
  if (/Password should be/i.test(m)) return "Choose a longer password (at least 6 characters).";
  return m;
}

let toastTimer;
function toast(msg) {
  clearTimeout(toastTimer);
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 2800);
}

   --------------------------------------------------------------------- */
const imageCache = {};
async function imageUrl(bucket, path) {
  const key = bucket + "/" + path;
  if (!imageCache[key]) {
    const { data, error } = await sb.storage.from(bucket).download(path);
    if (error) throw error;
    imageCache[key] = URL.createObjectURL(data);
  }
  return imageCache[key];
}
// Make a photo or screenshot small enough to upload quickly.
function shrinkImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const bad = () => reject(new Error("Couldn't read that image. Try a JPG or PNG screenshot."));
    if (!file || !/^image\//.test(file.type)) { reject(new Error("Choose an image file (a screenshot or photo).")); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * scale)); cv.height = Math.max(1, Math.round(img.height * scale));
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob((b) => (b ? resolve(b) : bad()), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(); };
    img.src = url;
  });
}
async function copyText(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand && document.execCommand("copy"); ta.remove();
    toast(ok ? done : "Couldn't copy. Try a different browser.");
  }
}

const OTHER = "__other";
function profileRow(src) {
  const t = (v) => { const s = String(v ?? "").trim(); return s === "" ? null : s; };
  const pick = (v, other) => (v === OTHER ? t(other) : t(v));      // "Other" uses what the student typed
  return {
    first_name: t(src.first_name), last_name: t(src.last_name), student_id: t(src.student_id),
    phone: t(src.phone), year: Number(src.year) || null, school: t(src.school),
    major: pick(src.major, src.major_other), minor: pick(src.minor, src.minor_other),
    major2: pick(src.major2, src.major2_other), minor2: pick(src.minor2, src.minor2_other)
  };
}
// Only send the second major and minor once the database has room for them.
function dbRow(row) { const r = { ...row }; if (!S.v3) { delete r.major2; delete r.minor2; } return r; }
function checkProfile(p) {
  if (!p.first_name || !p.last_name) return "Enter your first and last name.";
  if (!p.student_id) return "Enter your Monash student ID.";
  if (!p.year) return "Choose your year.";
  if (!p.school) return "Choose your school.";
  if (p.year > 1 && !p.major && !p.minor) return "From Year 2 onwards, choose your major or a minor.";
  if (p.major2 && !p.major) return "Choose your first major before a second one.";
  if (p.major2 && p.major2 === p.major) return "Your second major is the same as your first.";
  if (p.minor2 && !p.minor) return "Choose your first minor before a second one.";
  if (p.minor2 && p.minor2 === p.minor) return "Your second minor is the same as your first.";

}

async function loadAccount() {
  const uid = S.user.id;
  // Has the events update been run on the database? If not, the app hides those parts.
  const probe = await sb.from("event_signups").select("announcement_id").limit(1);
  S.v3 = !probe.error;
  const probe5 = S.v3 ? await sb.from("announcements").select("event_fee").limit(1) : { error: true };
  S.v5 = !probe5.error;
  const probe6 = await sb.from("my_club_colours").select("club_id").limit(1);
  S.v6 = !probe6.error;
  const probe7 = S.v3 ? await sb.from("announcements").select("image_paths").limit(1) : { error: true };
  S.v7 = !probe7.error;
  const [p, a] = await Promise.all([
    sb.from("students").select("*").eq("id", uid).maybeSingle(),
    sb.from("admins").select("user_id").eq("user_id", uid).maybeSingle()
  ]);
  if (p.error) throw p.error;
  if (a.error) throw a.error;
  S.profile = p.data; S.isAdmin = !!a.data;

  // First login after sign-up: create the student record from the sign-up answers.
  if (!S.profile) {
    const row = profileRow(S.user.user_metadata || {});
    if (!checkProfile(row)) {
      const ins = await sb.from("students").insert({ id: uid, email: S.user.email, ...dbRow(row) }).select().single();
      if (ins.error) { S.draft = row; S.formError = friendly(ins.error); }
      else S.profile = ins.data;
    }
  }
  if (!S.profile) { S.phase = "profile"; return; }
  await loadData();
  S.phase = "main";
}

async function loadData() {
  const uid = S.user.id;
  const [c, m, k, f] = await Promise.all([
    sb.from("clubs").select("*").order("name"),
    sb.from("memberships").select("*").eq("student_id", uid),
    sb.from("club_committee").select("club_id, role").eq("student_id", uid),
    sb.from("announcements").select("*").order("created_at", { ascending: false }).limit(80)
  ]);
  for (const r of [c, m, k, f]) if (r.error) throw r.error;
  S.clubs = c.data;
  if (S.v6) {
    const mc = await sb.from("my_club_colours").select("club_id, color").eq("student_id", uid);
    S.myColours = Object.fromEntries((mc.data || []).map((r) => [r.club_id, r.color]));
  }
  S.mine = new Map(m.data.map((r) => [r.club_id, r]));
  S.committee = k.data;
  const visible = new Set([...activeIds(), ...k.data.map((r) => r.club_id)]);
  const school = S.profile && S.profile.school;
  S.feed = f.data.filter((r) => visible.has(r.club_id) || r.audience_all || (!!school && (r.audience_schools || []).includes(school)))
    .filter((r) => !eventOver(r));                       // finished events leave Home by themselves
  S.signups = new Map(); S.myEvents = [];
  if (S.v3) {
    const e = await sb.from("event_signups").select("*, announcements(*)").eq("student_id", uid);
    if (e.error) throw e.error;
    S.signups = new Map(e.data.map((r) => [r.announcement_id, r]));
    S.myEvents = e.data.filter((r) => r.status !== "rejected").map((r) => r.announcements).filter((a) => a && a.event_start)
      .sort((x, y) => new Date(x.event_start) - new Date(y.event_start));
  }
  S.toCheck = {};
  if (k.data.length) {
    const p = await sb.from("memberships").select("club_id").eq("status", "pending").in("club_id", k.data.map((r) => r.club_id));
    if (p.error) throw p.error;
    for (const r of p.data) S.toCheck[r.club_id] = (S.toCheck[r.club_id] || 0) + 1;
    if (S.v5) {                                          // event payments waiting too
      const ep = await sb.from("event_signups").select("announcement_id, announcements!inner(club_id)").eq("status", "pending")
        .in("announcements.club_id", k.data.map((r) => r.club_id));
      for (const r of ep.data || []) S.toCheck[r.announcements.club_id] = (S.toCheck[r.announcements.club_id] || 0) + 1;
    }
  }
}

async function loadManage(clubId) {
  S.manage = emptyManage(clubId);
  render();
  const club = S.clubs.find((c) => c.id === clubId) || {};
  const [m, p, qr] = await Promise.all([
    sb.from("memberships")
      .select("*, students(*)")
      .eq("club_id", clubId).order("joined_at"),
    sb.from("announcements").select("*").eq("club_id", clubId).order("created_at", { ascending: false }),
    club.pay_qr_path ? imageUrl("club-qr", club.pay_qr_path).catch(() => "") : ""
  ]);
  if (S.manage.clubId !== clubId) return;
  if (m.error || p.error) S.manage.error = friendly(m.error || p.error);
  S.manage.members = (m.data || []).filter((r) => r.students);
  S.manage.posts = p.data || [];
  S.manage.qrUrl = qr;
  const withSignups = S.manage.posts.filter((a) => a.signups_open).map((a) => a.id);
  if (S.v3 && withSignups.length) {
    const c = await sb.from("event_signups").select("*, students(*)").in("announcement_id", withSignups);
    if (S.manage.clubId !== clubId) return;
    for (const r of c.data || []) if (r.status !== "rejected") S.manage.counts[r.announcement_id] = (S.manage.counts[r.announcement_id] || 0) + 1;
    S.manage.eventPending = (c.data || []).filter((r) => r.status === "pending" && r.students);
  }
  render();
}

function clubColour(id) {
  if (S.myColours && S.myColours[id]) return S.myColours[id];      // this student's own choice
  return clubOwnColour(id);
}
function clubOwnColour(id) {
  const c = S.clubs.find((x) => x.id === id);
  if (c && /^#[0-9a-f]{6}$/i.test(c.color || "")) return c.color;
  const ids = S.clubs.map((x) => x.id).sort((a, b) => a - b);
  // Hand out colours that are far apart first (blue, orange, green, purple…), so neighbouring clubs don't look alike.
  const order = [14, 5, 10, 18, 0, 12, 7, 3, 16, 20, 9, 1, 13, 22, 4, 11, 6, 15, 19, 8, 2, 17, 21, 23], list = CONFIG.CLUB_COLOURS;
  const i = ids.indexOf(id), n = i < 0 ? Math.abs(id) || 0 : i;
  return list[order[n % order.length] % list.length][0];
}

// When an event is over: its end time, or the end of its day if it has none.
function eventOver(a) {

  const s = new Date(a.event_start);
  const end = a.event_end ? new Date(a.event_end) : new Date(s.getFullYear(), s.getMonth(), s.getDate(), 23, 59, 59);
  return end < new Date();
}
function eventWhen(a) {
  const s = new Date(a.event_start), e = a.event_end ? new Date(a.event_end) : null;
  const t = (x) => x.toLocaleTimeString("en-MY", { hour: "numeric", minute: "2-digit" });
  const d = s.toLocaleDateString("en-MY", { weekday: "short", day: "numeric", month: "short" });
  const same = e && e.toDateString() === s.toDateString();
  return d + " · " + t(s) + (e ? " – " + (same ? t(e) : e.toLocaleDateString("en-MY", { day: "numeric", month: "short" }) + " " + t(e)) : "");
}

// Times for calendars: an event with no end time is treated as one hour long.
function eventTimes(a) { const s = new Date(a.event_start); return [s, a.event_end ? new Date(a.event_end) : new Date(s.getTime() + 3600000)]; }
const icsDate = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");

  const [s, e] = eventTimes(a);

// Clubs to suggest: ones the student hasn't joined that fit their school, majors or minors.
function recommendedClubs() {
  const p = S.profile || {};
  const studies = [p.major, p.major2, p.minor, p.minor2].filter(Boolean);
  const skip = new Set(["school", "and", "the", "for", "studies", "with", "jeffrey", "cheah"]);
  const words = [...studies, p.school || ""].join(" ").toLowerCase().split(/[^a-z]+/).filter((w) => w.length >= 4 && !skip.has(w));
  return S.clubs.filter((c) => c.is_active && !S.mine.has(c.id) && !isCommittee(c.id)).map((c) => {
    const fm = c.fit_majors || [], fs = c.fit_schools || [];
    const hit = studies.find((s) => fm.includes(s));
    if (hit) return { c, score: 10, why: `Picked by the club for ${hit} students` };
    if (p.school && fs.includes(p.school)) return { c, score: 6, why: `Picked by the club for ${p.school} students` };
    const text = (c.name + " " + (c.description || "") + " " + (c.category || "")).toLowerCase().split(/[^a-z]+/);
    const w = words.find((x) => text.some((y) => y.length >= 4 && y.startsWith(x.slice(0, 5))));
    if (w) { const src = [...studies, p.school || ""].find((s) => s.toLowerCase().includes(w)) || w; return { c, score: 3, why: `Matches your ${studies.includes(src) ? "study of " + src : src}` }; }
    return null;
  }).filter(Boolean).sort((a, b) => b.score - a.score || a.c.name.localeCompare(b.c.name)).slice(0, 5);
}
function recommendationsHtml() {
  const list = recommendedClubs();
  const p = S.profile || {};
  const body = list.length ? list.map(({ c, why }) => `<div class="card rec">
      <i class="sw-dot" style="background:${clubColour(c.id)};margin:0"></i>
      <div class="grow"><h3>${esc(c.name)}</h3><p class="meta">${esc(why)}${Number(c.fee) > 0 ? " · " + money(c.fee) : " · Free"}</p></div>
      ${canTakePayment(c) ? `<button class="btn small" data-act="ask-join" data-club="${c.id}">Join</button>` : `<span class="meta">Not open yet</span>`}
    </div>`).join("")
    : `<p class="meta">${p.major || p.minor ? "No new clubs match your studies right now." : "Add your major or minor in Profile to get club suggestions."}</p>`;
  return `<section class="stack" aria-labelledby="h-rec"><div class="row between"><h2 id="h-rec">Recommended for you</h2>
      <button class="link" data-act="tab" data-tab="clubs">All clubs</button></div>${body}</section>`;
}

function clubListHtml() {
  const q = S.clubSearch.trim().toLowerCase();
  let list = S.clubs.filter((c) => c.is_active || S.mine.has(c.id));
  if (S.clubFilter === "mine") list = list.filter((c) => S.mine.has(c.id));
  if (q) list = list.filter((c) => (c.name + " " + (c.description || "") + " " + (c.category || "")).toLowerCase().includes(q));
  if (!list.length) {
    const msg = S.clubs.length === 0 ? "No clubs have been added yet."
      : S.clubFilter === "mine" && !q ? "You haven't joined any clubs yet."
      : "No clubs match that search.";
    return `<div class="empty"><p>${msg}</p></div>`;
  }
  const groups = {};
  for (const c of list) (groups[c.category || "Other"] ||= []).push(c);
  return Object.keys(groups).sort().map((g) => `
    <div class="stack">
      <div class="cat">${esc(g)}</div>
      ${groups[g].map((c) => {
        const m = my(c.id); const st = m ? m.status : ""; const fee = Number(c.fee) || 0;
        const chip = st === "active" ? `<span class="chip mark">Joined</span>`
          : st === "pending" ? `<span class="chip">Being checked</span>`
          : st === "rejected" ? `<span class="chip bad">Not accepted</span>` : "";
        const buttons = st === "active" ? `<button class="btn quiet small" data-act="ask-leave" data-club="${c.id}">Leave</button>`
          : st === "pending" ? `<button class="btn quiet small" data-act="ask-leave" data-club="${c.id}">Cancel request</button>`
          : st === "rejected" ? `<button class="btn small" data-act="ask-join" data-club="${c.id}">Try again</button>
              <button class="btn quiet small" data-act="ask-leave" data-club="${c.id}">Remove</button>`
          : !canTakePayment(c) ? `<button class="btn small" disabled>Not open yet</button>`
          : `<button class="btn small" data-act="ask-join" data-club="${c.id}">${fee ? "Join · " + money(fee) : "Join"}</button>`;
        return `<div class="card">
          <div class="row between">
            <h3 class="grow"><i class="sw-dot" style="background:${clubColour(c.id)}"></i>${esc(c.name)}</h3>
            ${chip}
          </div>
          ${c.description ? `<p class="meta">${esc(c.description)}</p>` : ""}
          <p class="meta">${st === "active" && m.paid_amount != null
            ? `Paid ${money(m.paid_amount)}${m.checked_at ? " · approved " + day(m.checked_at) : ""}${m.pay_ref ? " · ref " + esc(m.pay_ref) : ""}`
            : fee ? "Membership fee " + money(fee) : "Free to join"}</p>
          ${!st && !canTakePayment(c) ? `<p class="meta">Joining opens once the club adds its payment details.</p>` : ""}
          ${st === "pending" ? `<p class="note">Your payment screenshot is with the committee. You become a member once they have checked it.${m.pay_ref ? " Your reference is " + esc(m.pay_ref) + "." : ""}</p>` : ""}
          ${st === "rejected" ? `<div class="error">Your payment was not accepted${m.reject_reason ? ": " + esc(m.reject_reason) : "."}</div>` : ""}
          <div class="row">
            ${buttons}
            ${isCommittee(c.id) ? `<button class="btn ghost small" data-act="manage" data-club="${c.id}">Manage</button>` : ""}
            ${S.v6 && st ? `<button class="btn quiet small" data-act="pick-colour" data-club="${c.id}"><i class="sw-dot" style="background:${clubColour(c.id)}"></i>My colour</button>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`).join("");
}

function calendarHtml() {
  const now = new Date();
  const first = CONFIG.CALENDAR_FIRST_YEAR, last = CONFIG.CALENDAR_LAST_YEAR;
  const m = S.calMonth || new Date(now.getFullYear(), now.getMonth(), 1);
  const key = (d) => d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  const byDay = {};
  for (const a of S.myEvents) (byDay[key(new Date(a.event_start))] ||= []).push(a);
  const sel = S.calDay;
  const gridStart = new Date(m.getFullYear(), m.getMonth(), 1 - new Date(m.getFullYear(), m.getMonth(), 1).getDay());  // the Sunday on or before the 1st
  const shownClubs = new Set();
  let cells = ["S", "M", "T", "W", "T", "F", "S"].map((d) => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const date = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const inMonth = date.getMonth() === m.getMonth();
    const evs = inMonth ? (byDay[key(date)] || []) : [];
    evs.forEach((a) => shownClubs.add(a.club_id));
    const dots = evs.slice(0, 3).map((a) => `<i style="background:${clubColour(a.club_id)}" title="${esc(clubName(a.club_id))}"></i>`).join("") + (evs.length > 3 ? "<b>+</b>" : "");
    const cls = ["day", inMonth ? "" : "out", key(date) === key(now) ? "today" : "", inMonth && sel && key(sel) === key(date) ? "sel" : ""].join(" ").replace(/\s+/g, " ").trim();
    const label = date.toLocaleDateString("en-MY", { day: "numeric", month: "long" }) + (evs.length ? ", " + evs.map((a) => clubName(a.club_id)).join(", ") : "");
    cells += inMonth
      ? `<button class="${cls}" data-act="cal-day" data-day="${date.getDate()}" aria-label="${esc(label)}"><span class="n">${date.getDate()}</span><span class="dots">${dots}</span></button>`
      : `<div class="${cls}" aria-hidden="true"><span class="n">${date.getDate()}</span><span class="dots"></span></div>`;
  }
  const months = Array.from({ length: 12 }, (_, i) => `<option value="${i}" ${i === m.getMonth() ? "selected" : ""}>${new Date(2000, i, 1).toLocaleDateString("en-MY", { month: "long" })}</option>`).join("");
  const years = Array.from({ length: last - first + 1 }, (_, i) => first + i).map((y) => `<option ${y === m.getFullYear() ? "selected" : ""}>${y}</option>`).join("");
  const atStart = m.getFullYear() <= first && m.getMonth() === 0, atEnd = m.getFullYear() >= last && m.getMonth() === 11;
  const thisMonth = m.getFullYear() === now.getFullYear() && m.getMonth() === now.getMonth();
  const legend = [...shownClubs].map((cid) => S.v6
    ? `<button class="chip club" style="--club:${clubColour(cid)}" data-act="pick-colour" data-club="${cid}" aria-label="Change the colour for ${esc(clubName(cid))}">${esc(clubName(cid))}</button>`
    : clubChip(cid)).join(" ");

  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const list = sel ? (byDay[key(sel)] || []) : S.myEvents.filter((a) => new Date(a.event_end || a.event_start) >= startToday);
  const item = (a) => {
    const past = new Date(a.event_start) <= now;
    return `<div class="card">
      <div class="row between">${clubChip(a.club_id)}${past ? `<span class="meta">Past</span>` : (S.signups.get(a.id) || {}).status === "pending" ? `<span class="chip">Payment being checked</span>` : ""}</div>
      <h3><button class="titlelink" data-act="open-post" data-id="${a.id}">${esc(a.title)}</button></h3>
      ${eventLine(a)}
      ${past ? "" : calButtons(a) + `<button class="btn quiet small" style="align-self:flex-start" data-act="ask-unsign" data-id="${a.id}">Cancel sign-up</button>`}
    </div>`;
  };
  const empty = !S.myEvents.length
    ? `<p class="meta">Events you sign up for appear here, marked with a dot in each club's colour. Tap an announcement and press Sign up.</p>`
    : sel ? `<p class="meta">No events on this day.</p>` : `<p class="meta">Nothing coming up. Past events stay marked on the calendar.</p>`;
  return `<div class="row between"><h2 id="h-cal">My calendar</h2>${thisMonth ? "" : `<button class="btn quiet small" data-act="cal-today">Today</button>`}</div>
    <div class="card">
      <div class="cal-head">
        <button class="btn quiet small" data-act="cal-move" data-step="-1" aria-label="Previous month" ${atStart ? "disabled" : ""}>‹</button>
        <select id="cal-m" aria-label="Month">${months}</select>
        <select id="cal-y" aria-label="Year">${years}</select>
        <button class="btn quiet small" data-act="cal-move" data-step="1" aria-label="Next month" ${atEnd ? "disabled" : ""}>›</button>
      </div>
      <div class="cal">${cells}</div>
      ${legend ? `<div class="row">${legend}</div>${S.v6 ? `<p class="meta">Tap a club to choose your own colour for it.</p>` : ""}` : ""}
    </div>
    <div class="row between"><h3>${sel ? sel.toLocaleDateString("en-MY", { weekday: "long", day: "numeric", month: "long" }) : "Coming up"}</h3>
      ${sel ? `<button class="link" data-act="cal-all">Show all coming up</button>` : ""}</div>
    <div class="stack">${list.length ? list.map(item).join("") : empty}</div>`;
}

function viewManage() {
  const mine = S.committee.map((c) => c.club_id);
  const id = S.manage.clubId;
  if (id == null) {
    return `<h1>Manage</h1><p class="lead">Clubs where you are on the committee.</p>
      <div class="stack">${mine.map((cid) => `<button class="card" style="text-align:left;cursor:pointer" data-act="manage" data-club="${cid}">
        <h3>${esc(clubName(cid))}</h3><span class="meta">${esc((S.committee.find((c) => c.club_id === cid) || {}).role || "Committee")}${S.toCheck[cid] ? ` · ${S.toCheck[cid]} payment${S.toCheck[cid] === 1 ? "" : "s"} to check` : ""}</span>
      </button>`).join("")}</div>`;
  }
  const m = S.manage;
  const club = S.clubs.find((c) => c.id === id) || {};
  const fee = Number(club.fee) || 0;
  const canPost = isCommittee(id);
  const canEdit = canPost || S.isAdmin;
  const back = mine.length > 1 || !canPost;
  const pending = (m.members || []).filter((r) => r.status === "pending");
  const active = (m.members || []).filter((r) => r.status === "active");
  const full = (s) => esc(s.first_name) + " " + esc(s.last_name);

  const evPending = m.eventPending || [];
  const evCard = (r) => { const a = (m.posts || []).find((x) => x.id === r.announcement_id) || {}; return `<div class="card">
        <div class="row between"><h3 class="grow">${full(r.students)}</h3><span class="price">${money(r.paid_amount || 0)}</span></div>
        <p class="meta">For <strong>${esc(a.title || "an event")}</strong> · Student ID ${esc(r.students.student_id)} · sent ${when(r.signed_up_at)}</p>
        ${r.pay_ref ? `<p>Reference <strong style="font-family:ui-monospace,Menlo,Consolas,monospace">${esc(r.pay_ref)}</strong></p>` : ""}
        <div class="row">
          <button class="btn quiet small" data-act="view-receipt" data-kind="event" data-post="${r.announcement_id}" data-student="${esc(r.student_id)}">View screenshot</button>
          ${canEdit ? `<button class="btn small" data-act="approve" data-kind="event" data-post="${r.announcement_id}" data-student="${esc(r.student_id)}">Approve</button>
          <button class="btn danger small" data-act="ask-reject" data-kind="event" data-post="${r.announcement_id}" data-student="${esc(r.student_id)}">Not accepted</button>` : ""}
        </div>
      </div>`; };
  const waiting = pending.length + evPending.length;
  const payments = m.members === null || (!waiting && !fee) ? "" : `<div class="stack">
      <h2>Payments to check (${waiting})</h2>
      ${waiting ? `<p class="meta">Before approving, find each reference and amount in the club's bank account. A screenshot on its own can be edited.</p>` : ""}
      ${evPending.map(evCard).join("")}
      ${pending.length ? pending.map((r) => `<div class="card">
        <div class="row between"><h3 class="grow">${full(r.students)}</h3><span class="price">${money(r.paid_amount || 0)}</span></div>
        <p class="meta">Student ID ${esc(r.students.student_id)} · sent ${when(r.submitted_at || r.joined_at)}</p>
        ${r.pay_ref ? `<p>Reference <strong style="font-family:ui-monospace,Menlo,Consolas,monospace">${esc(r.pay_ref)}</strong></p>` : ""}
        <div class="row">
          <button class="btn quiet small" data-act="view-receipt" data-student="${esc(r.student_id)}">View screenshot</button>
          ${canEdit ? `<button class="btn small" data-act="approve" data-student="${esc(r.student_id)}">Approve</button>
          <button class="btn danger small" data-act="ask-reject" data-student="${esc(r.student_id)}">Not accepted</button>` : ""}
        </div>
      </div>`).join("") : evPending.length ? "" : `<p class="meta">Nothing waiting. New payments appear here as students send them.</p>`}
    </div>`;

  const members = m.members === null ? `<div class="meta">Loading members…</div>` : !active.length
    ? `<div class="empty"><p>${fee ? "No members yet. Students appear here once their payment is approved." : "No members yet. Students appear here as soon as they tap Join."}</p></div>`
    : `<div class="scroll"><table>
        <thead><tr><th>Name</th><th>Student ID</th><th>Year</th><th>School</th><th>Major</th><th>Minor</th><th>Email</th><th>Phone</th><th>Joined</th><th>Paid</th><th>Reference</th></tr></thead>
        <tbody>${active.map((r) => { const s = r.students; return `<tr>
          <td>${full(s)}</td><td class="num">${esc(s.student_id)}</td><td class="num">${esc(s.year)}</td>
          <td>${esc(s.school)}</td><td>${esc([s.major, s.major2].filter(Boolean).join(" / "))}</td><td>${esc([s.minor, s.minor2].filter(Boolean).join(" / "))}</td>
          <td>${esc(s.email)}</td><td class="num">${esc(s.phone || "")}</td><td>${day(r.joined_at)}</td>
          <td class="num">${r.paid_amount != null ? money(r.paid_amount) : ""}</td><td class="num">${esc(r.pay_ref || "")}</td></tr>`; }).join("")}
        </tbody></table></div>`;

  const posts = m.posts === null ? "" : !m.posts.length ? `<p class="meta">Nothing posted yet.</p>`
    : m.posts.map((a) => {
        const n = m.counts[a.id] || 0, list = m.signupLists[a.id];
        return `<div class="card">
        <div class="row between"><h3 class="grow">${esc(a.title)}</h3>${eventOver(a) ? `<span class="chip off">Ended</span>` : `<span class="meta">${when(a.created_at)}</span>`}</div>
        ${eventLine(a)}
        <p class="meta" style="white-space:pre-wrap">${esc(a.body)}</p>
        ${S.v3 ? `<p class="meta"><strong>Who can see it:</strong> ${esc(audienceText(a))}</p>` : ""}
        ${a.signups_open ? `<div class="row"><strong>${n} signed up</strong>
          ${n ? `<button class="btn ghost small" data-act="${list ? "hide-signups" : "show-signups"}" data-id="${a.id}">${list ? "Hide list" : "See who"}</button>` : ""}</div>` : ""}
        ${list ? signupTable(a.id, list) : ""}
        ${canEdit ? `<div class="row"><button class="btn danger small" data-act="ask-delete-post" data-id="${a.id}">Delete</button></div>` : ""}
      </div>`; }).join("");

  const colourForm = !canEdit || m.members === null || !("color" in club) ? "" : `<div class="stack">
      <h2>Club colour</h2>
      <div class="card">
        <p class="meta">Shown on students' calendars and on your posts, so they can tell clubs apart. Students can still choose their own colour for your club.</p>
        ${colourSwatches("set-colour", clubOwnColour(id), "club-colour-input")}
      </div>
    </div>`;
  const detailsForm = !canEdit || m.members === null ? "" : `<div class="stack" id="club-details">
      <h2>Club details</h2>
      <form data-form="club-info" novalidate class="card">
        <label>Club name<input name="name" id="ci-name" value="${esc(club.name || "")}" required maxlength="80" autocomplete="off"></label>
        <label>Category<input name="category" id="ci-cat" list="ci-cats" value="${esc(club.category || "")}" placeholder="e.g. Career" autocomplete="off"></label>
        <datalist id="ci-cats">${CONFIG.CATEGORIES.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
        <label>What it does<textarea name="description" id="ci-desc" style="min-height:90px" maxlength="400">${esc(club.description || "")}</textarea></label>
        ${S.v7 ? fitFieldsHtml(club) : ""}
        <button class="btn" style="align-self:flex-start">Save club details</button>
      </form>
    </div>`;
  const qrShown = m.qrPreview || m.qrUrl;
  const feeForm = !canEdit || m.members === null ? "" : `<div class="stack">
      <h2>Membership fee</h2>
      <form data-form="club-fee" novalidate class="card">
        <label>Fee in RM <small>What a student pays to join. Use 0 only if joining is free.</small>
          <input name="fee" id="fee-amount" type="number" min="0" step="0.01" inputmode="decimal" value="${fee}"></label>
        <label>Payment QR code <small>A screenshot of the club's DuitNow QR.</small>
          <input type="file" id="qr-file" accept="image/*"></label>
        <div id="qr-preview" class="stack">${qrShown ? `<img class="qr" src="${qrShown}" alt="The club's payment QR code">` : ""}</div>
        <label>Bank<input name="pay_bank" id="fee-bank" value="${esc(club.pay_bank || "")}" placeholder="e.g. Maybank" autocomplete="off"></label>
        <label>Account name<input name="pay_account_name" id="fee-name" value="${esc(club.pay_account_name || "")}" autocomplete="off"></label>
        <label>Account number<input name="pay_account_number" id="fee-number" value="${esc(club.pay_account_number || "")}" inputmode="numeric" autocomplete="off"></label>
        <label>Note to students <small>Optional.</small>
          <input name="pay_note" id="fee-note" value="${esc(club.pay_note || "")}" placeholder="e.g. Covers the whole academic year." autocomplete="off"></label>
        <div id="fee-error">${m.feeError ? `<div class="error" role="alert">${esc(m.feeError)}</div>` : ""}</div>
        <button class="btn" style="align-self:flex-start">Save fee details</button>
      </form>
    </div>`;
  const canPostHere = canPost || (S.isAdmin && S.v3);

  return `
    ${back ? `<button class="link" style="align-self:flex-start" data-act="${canPost ? "manage-back" : "tab"}" data-tab="admin">Back</button>` : ""}
    <div class="stack"><h1>${esc(clubName(id))}</h1><p class="lead">${canPost ? "Your members, payments and announcements." : "Members, payments and announcements."}</p></div>
    ${m.error ? `<div class="error" role="alert">${esc(m.error)}</div>` : ""}
    ${payments}
    <div class="stack">
      <div class="row between"><h2>Members${m.members ? ` (${active.length})` : ""}</h2>
        ${active.length ? `<button class="btn ghost small" data-act="copy-members">Copy for Google Sheets</button>` : ""}</div>
      ${members}
    </div>
    <div class="stack"><div class="row between"><h2>Posted</h2>
      ${m.members !== null && canPostHere ? `<button class="btn ghost small" data-act="go-post" data-club="${id}">New post</button>` : ""}</div>${posts}</div>
    ${detailsForm}
    ${colourForm}
    ${feeForm}`;
}

// "Who is this club for?" Used to recommend the club to the right students.
function fitFieldsHtml(club) {
  const fs = club.fit_schools || [], fm = club.fit_majors || [];
  return `<fieldset class="aud"><legend>Who is this club for?</legend>
    <p class="meta">The app recommends your club to these students. Tick a whole school, or open it to pick majors.</p>
    ${CONFIG.SCHOOLS.map((s, i) => {
      const c = CONFIG.COURSES[s] || {}, list = [...new Set([...(c.majors || []), ...(c.minors || [])])];
      const picked = list.filter((m) => fm.includes(m)).length;
      return `<details class="fit" ${picked ? "open" : ""}><summary>${esc(s)}${fs.includes(s) ? " · whole school" : picked ? " · " + picked + " picked" : ""}</summary>
        <div class="stack">
          <label class="check"><input type="checkbox" name="fit_school" value="${esc(s)}" id="fs-${i}" ${fs.includes(s) ? "checked" : ""}> All ${esc(s)} students</label>
          ${list.map((m, k) => `<label class="check"><input type="checkbox" name="fit_major" value="${esc(m)}" id="fm-${i}-${k}" ${fm.includes(m) ? "checked" : ""}> ${esc(m)}</label>`).join("")}
        </div></details>`;
    }).join("")}
  </fieldset>`;
}
function signupTable(id, list) {
  if (!list.length) return `<p class="meta">Nobody has signed up yet.</p>`;
  return `<div class="scroll"><table>
      <thead><tr><th>Name</th><th>Student ID</th><th>Year</th><th>School</th><th>Email</th><th>Phone</th><th>Signed up</th><th>Payment</th></tr></thead>
      <tbody>${list.map((r) => { const s = r.students || {}; return `<tr><td>${esc(s.first_name)} ${esc(s.last_name)}</td>
        <td class="num">${esc(s.student_id)}</td><td class="num">${esc(s.year)}</td><td>${esc(s.school)}</td><td>${esc(s.email)}</td>
        <td class="num">${esc(s.phone || "")}</td><td>${day(r.signed_up_at)}</td>
        <td>${r.paid_amount != null ? money(r.paid_amount) + " · " + ({ pending: "to check", confirmed: "approved", rejected: "not accepted" }[r.status] || "") : "Free"}</td></tr>`; }).join("")}</tbody></table></div>
    <button class="btn ghost small" style="align-self:flex-start" data-act="copy-signups" data-id="${id}">Copy for Google Sheets</button>`;
}

// Clubs this person can post for: their committees, plus every club for the admin (once the events update is run).
function postableClubs() {
  const ids = S.committee.map((c) => c.club_id);
  if (S.isAdmin && S.v3) for (const c of S.clubs) if (!ids.includes(c.id)) ids.push(c.id);
  return ids.filter((cid) => S.clubs.some((c) => c.id === cid)).sort((a, b) => clubName(a).localeCompare(clubName(b)));
}
function postFormHtml(ids, preset) {
  const picker = ids.length === 1
    ? `<input type="hidden" name="club_id" value="${ids[0]}"><div class="row"><span class="meta">Posting for</span>${clubChip(ids[0])}</div>`
    : `<label>Club<select name="club_id" id="a-club" required>
        <option value="">Choose a club</option>
        ${ids.map((cid) => `<option value="${cid}" ${preset === cid ? "selected" : ""}>${esc(clubName(cid))}${isCommittee(cid) ? "" : " (as admin)"}</option>`).join("")}</select></label>`;
  return `<form data-form="post" novalidate class="card">
      ${picker}
      <label>Title<input name="title" id="a-title" required maxlength="120" placeholder="e.g. Fintech Ideathon 2026"></label>
      <label>Message<textarea name="body" id="a-body" required placeholder="What, when, where, and how it helps your members."></textarea></label>
      ${S.v7 ? `<label>Pictures <small>Optional, up to 4, such as a poster. The first one is shown on the announcement box.</small>
        <input type="file" id="a-pics" accept="image/*" multiple></label>
        <div class="thumbs" id="a-thumbs">${S.postFiles.map((f) => `<img src="${f.url}" alt="Chosen picture">`).join("")}</div>` : ""}
      ${S.v3 ? `
      <label class="check"><input type="checkbox" name="is_event" id="a-is-event"> This is an event with a date</label>
      <div id="a-event-fields" class="stack" hidden>
        <div class="two">
          <label>Date<input type="date" name="date" id="a-date"></label>
          <label>Place <small>Optional</small><input name="location" id="a-place" placeholder="e.g. Building 9, Room 9-2-03" autocomplete="off"></label>
        </div>
        <div class="two">
          <label>Starts<input type="time" name="start" id="a-start"></label>
          <label>Ends <small>Optional</small><input type="time" name="end" id="a-end"></label>
        </div>
        <label class="check"><input type="checkbox" name="signups" id="a-signups" checked> Let students sign up (it goes into their calendar)</label>
        ${S.v5 ? `<label>Price in RM <small>Leave at 0 if it's free. Students pay to the club's QR code or bank account, the same as membership.</small>
          <input type="number" name="event_fee" id="a-fee" min="0" step="0.01" inputmode="decimal" value="0"></label>` : ""}
      </div>
      <fieldset class="aud">
        <legend>Who can see this?</legend>
        <label class="check"><input type="checkbox" checked disabled> Members of this club (always)</label>
        <label class="check"><input type="checkbox" name="aud_all" id="a-aud-all"> All students</label>
        <p class="meta">Or also students in these schools:</p>
        ${CONFIG.SCHOOLS.map((s, i) => `<label class="check"><input type="checkbox" name="aud_school" value="${esc(s)}" id="a-aud-${i}"> ${esc(s)}</label>`).join("")}
      </fieldset>` : ""}
      <button class="btn">Post</button>
    </form>`;
}
function viewPostTab() {
  const ids = postableClubs();
  if (!ids.length) {
    return `<h1>Post</h1><div class="empty"><p>${S.isAdmin && !S.v3
      ? "To post for any club, run database update 4 (events) first. Until then, add yourself to a club's committee to post for it."
      : S.isAdmin ? "No clubs yet. Add one in the Admin tab first." : "You can post once you're on a club's committee."}</p></div>`;
  }
  return `<div class="stack"><h1>New post</h1>
      <p class="lead">Announcements and events go to members' Home, and to anyone else you choose.</p></div>
    ${postFormHtml(ids, S.postClub)}
    <p class="meta">To see, delete or check sign-ups for what's been posted, open the club in ${S.committee.length ? "Manage" : "Admin"}.</p>`;
}

function viewAdmin() {
  const a = S.admin;
  if (!a.loaded) return `<h1>Admin</h1><div class="meta">Loading…</div>`;
  const clubs = S.clubs.map((c) => {
    const com = a.committee.filter((k) => k.club_id === c.id);

    const n = a.counts[c.id] || { active: 0, pending: 0 };
    return `<div class="card">
      <div class="row between">
        <h3 class="grow">${esc(c.name)}</h3>
        ${c.is_active ? "" : `<span class="chip off">Hidden</span>`}
        ${canTakePayment(c) ? "" : `<span class="chip bad">Needs payment details</span>`}
      </div>
      <p class="meta">${esc(c.category || "No category")} · ${Number(c.fee) ? money(c.fee) : "Free"} · ${n.active} member${n.active === 1 ? "" : "s"}${n.pending ? ` · ${n.pending} to check` : ""} · ${com.length} on committee</p>
      <div class="row">
        <button class="btn ghost small" data-act="admin-open" data-club="${c.id}">${open ? "Close" : "Committee"}</button>
        <button class="btn quiet small" data-act="manage" data-club="${c.id}">Members</button>
        <button class="btn quiet small" data-act="manage" data-club="${c.id}" data-focus="club-details">Edit</button>
        <button class="btn quiet small" data-act="toggle-club" data-club="${c.id}">${c.is_active ? "Hide" : "Show"}</button>
      </div>
      ${open ? `<div class="stack" style="border-top:1px solid var(--line);padding-top:12px">
        ${com.length ? com.map((k) => `<div class="row between">
            <div class="grow"><strong>${esc(k.students ? k.students.first_name + " " + k.students.last_name : "Student")}</strong>
              <div class="meta">${esc(k.role || "Committee")}${k.students ? " · " + esc(k.students.email) : ""}</div></div>
            <button class="btn danger small" data-act="remove-committee" data-club="${c.id}" data-student="${esc(k.student_id)}">Remove</button>
          </div>`).join("") : `<p class="meta">No committee members yet.</p>`}
        <form data-form="add-committee" data-club="${c.id}" novalidate>
          <label>Student email or student ID <small>They must have signed up first.</small>
            <input name="who" id="k-who-${c.id}" required autocomplete="off"></label>
          <label>Role<input name="role" id="k-role-${c.id}" placeholder="e.g. President" autocomplete="off"></label>
          <button class="btn small" style="align-self:flex-start">Add to committee</button>
        </form>
      </div>` : ""}
    </div>`;
  }).join("");
  return `<div class="stack"><h1>Admin</h1>
      <p class="lead">${a.students ?? "–"} student${a.students === 1 ? "" : "s"} signed up · ${S.clubs.length} club${S.clubs.length === 1 ? "" : "s"}</p></div>
    ${a.error ? `<div class="error" role="alert">${esc(a.error)}</div>` : ""}
    <div class="stack"><h2>Clubs</h2>${clubs || `<div class="empty"><p>No clubs yet. Add the first one below.</p></div>`}</div>
    <div class="stack">
      <h2>Add a club</h2>
      <form data-form="add-club" novalidate class="card">
        <label>Club name<input name="name" id="c-name" required maxlength="80"></label>
        <label>Category<input name="category" id="c-cat" list="cats" placeholder="e.g. Career" autocomplete="off"></label>
        <datalist id="cats">${CONFIG.CATEGORIES.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
        <label>What it does<textarea name="description" id="c-desc" style="min-height:70px" maxlength="400"></textarea></label>
        <label>Membership fee in RM <small>What a student pays to join. Type 0 only if this club is free.</small>
          <input name="fee" id="c-fee" type="number" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 20"></label>
        <button class="btn" style="align-self:flex-start">Add club</button>
      </form>
    </div>`;
}

// Perks tab: news subscriptions, apps and tools that come free with being a Monash student.
function perkColour(p) {            // neighbouring tiles get colours far apart
  const order = [15, 0, 11, 18, 5, 12, 4, 16, 20, 9, 1, 13, 22, 7, 10, 19, 3, 21, 23];
  return CONFIG.CLUB_COLOURS[order[CONFIG.PERKS.indexOf(p) % order.length]][0];
}
function perkIcon(p) {
  const src = p.logo ? (CONFIG.PERK_LOGOS[p.logo] || p.logo)
    : p.site ? "https://www.google.com/s2/favicons?sz=128&domain=" + encodeURIComponent(p.site) : "";
  const letters = `<span class="mono" style="--c:${perkColour(p)}" aria-hidden="true">${esc(p.short)}</span>`;
  if (!src) return letters;
  // If the picture can't load, fall back to the letter tile.
  return `<span class="mono logo" style="--c:${perkColour(p)}" aria-hidden="true"><img src="${esc(src)}" alt="" loading="lazy" onload="perkIconCheck(this)"
    onerror="perkIconFail(this)" data-short="${esc(p.short)}"></span>`;
}
// A missing or tiny (blurry) icon is swapped for the letter tile.

function viewSheet() {
  const s = S.sheet;
  if (!s) return "";
  const err = s.error ? `<div class="error" role="alert">${esc(s.error)}</div>` : "";
  let body = "", close = "Cancel";
  if (s.type === "join") {
    body = `<h2>Join ${esc(clubName(s.clubId))}?</h2>
      <p class="note">The club's committee will see your name, student ID, year, school, major, minor, email and phone number.</p>
      ${err}
      <button class="btn wide" data-act="join" data-club="${s.clubId}">Join club</button>`;
  } else if (s.type === "leave") {
    const st = (my(s.clubId) || {}).status;
    body = st === "pending" ? `<h2>Cancel your request to join ${esc(clubName(s.clubId))}?</h2>
        <p class="lead">If you have already paid, ask the club's committee about a refund.</p>
        ${err}<button class="btn danger wide" data-act="leave" data-club="${s.clubId}">Cancel request</button>`
      : st === "rejected" ? `<h2>Remove ${esc(clubName(s.clubId))} from your clubs?</h2>
        <p class="lead">You can join again later.</p>
        ${err}<button class="btn danger wide" data-act="leave" data-club="${s.clubId}">Remove</button>`
      : `<h2>Leave ${esc(clubName(s.clubId))}?</h2>
        <p class="lead">You'll stop getting its announcements and the committee will no longer see your details.${Number((S.clubs.find((c) => c.id === s.clubId) || {}).fee) ? " Joining again means paying the fee again." : ""}</p>
        ${err}<button class="btn danger wide" data-act="leave" data-club="${s.clubId}">Leave club</button>`;
    if (st === "pending") close = "Keep my request";
  } else if (s.type === "delete-post") {
    const a = findPost(s.id) || {};
    body = `<h2>Delete ${a.title ? "“" + esc(a.title) + "”" : "this announcement"}?</h2>
      <p class="lead">Nobody will see it any more.${a.signups_open ? " Anyone who signed up loses it from their calendar." : ""}${Number(a.event_fee) > 0 ? " If people already paid, arrange their refunds with them." : ""}</p>
      ${err}
      <button class="btn danger wide" data-act="delete-post" data-id="${s.id}">Delete</button>`;
  } else if (s.type === "sign" || s.type === "unsign") {
    const a = findPost(s.id) || { title: "this event", club_id: 0 };
    body = s.type === "sign" ? `<h2>Sign up for ${esc(a.title)}?</h2>
        ${a.event_start ? `<p class="when">${esc(eventWhen(a))}${a.location ? " · " + esc(a.location) : ""}</p>` : ""}
        <p class="note">It goes into your calendar. ${esc(clubName(a.club_id))}'s committee will see your name, student ID, year, school, major, minor, email and phone number.</p>
        ${err}<button class="btn wide" data-act="sign" data-id="${s.id}">Sign up</button>`
      : `<h2>Cancel your sign-up for ${esc(a.title)}?</h2>
        <p class="lead">It will be removed from your calendar. You can sign up again while sign-ups are open.</p>
        ${err}<button class="btn danger wide" data-act="unsign" data-id="${s.id}">Cancel sign-up</button>`;
    if (s.type === "unsign") close = "Keep it";
    if (s.type === "unsign" && Number(a.event_fee) > 0) body = body.replace("</p>", " If you already paid, ask the club about a refund.</p>");
  } else if (s.type === "my-colour") {
    const own = S.myColours[s.clubId];
    body = `<h2>Your colour for ${esc(clubName(s.clubId))}</h2>
      <p class="lead">Only you see this, on your calendar and posts. Everyone else keeps the club's colour.</p>
      ${colourSwatches("set-my-colour", clubColour(s.clubId), "my-colour-input", `data-club="${s.clubId}"`)}
      ${err}
      ${own ? `<button class="btn quiet wide" data-act="reset-my-colour" data-club="${s.clubId}">Use the club's colour again</button>` : ""}`;
    close = "Done";
  } else if (s.type === "receipt") {
    close = "Close";
    body = `<h2>${esc(s.name)}</h2>
      ${s.url ? `<img class="shot" src="${s.url}" alt="Payment screenshot from ${esc(s.name)}">`
        : `<p class="meta">${s.failed ? "The screenshot couldn't be loaded." : "Loading screenshot…"}</p>`}`;
  } else if (s.type === "password") {
    body = `<h2>Change your password</h2>${newPasswordForm(err)}`;
  } else if (s.type === "reject") {
    body = `<h2>Mark ${esc(s.name)}'s payment as not accepted?</h2>
      <form data-form="reject" data-student="${esc(s.student)}" data-kind="${esc(s.kind || "")}" data-post="${esc(s.post || "")}" novalidate>
        <label>Reason shown to the student
          <input name="reason" id="reject-reason" maxlength="200" placeholder="e.g. The amount was RM 10 short." autocomplete="off"></label>
        ${err}
        <button class="btn danger wide">Mark as not accepted</button>
      </form>`;
  }
  return `<div class="sheet-back" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true">
    ${body}<button class="btn quiet wide" data-act="sheet-close">${close}</button></div></div>`;
}

function render() {
  const brand = `<span class="brand"><i></i>${esc(CONFIG.APP_NAME)}</span>`;
  if (S.phase === "loading") { app.innerHTML = `<header class="topbar">${brand}</header><div class="center">Loading…</div>`; overlay.innerHTML = ""; return; }
  if (S.phase === "fatal") {
    app.innerHTML = `<header class="topbar">${brand}</header><main><h1>Something went wrong</h1>
      <div class="error" role="alert">${esc(S.fatal)}</div>
      <button class="btn wide" data-act="reload">Try again</button>
      ${S.user ? `<button class="btn quiet wide" data-act="logout">Log out</button>` : ""}</main>`;
    overlay.innerHTML = ""; return;
  }
  if (recovering && S.user) { app.innerHTML = `<header class="topbar">${brand}</header>${viewRecovery()}`; overlay.innerHTML = ""; return; }
  if (S.phase === "auth") { app.innerHTML = `<header class="topbar">${brand}</header>${viewAuth()}`; overlay.innerHTML = ""; return; }
  if (S.phase === "profile") { app.innerHTML = `<header class="topbar">${brand}</header>${viewProfileSetup()}`; overlay.innerHTML = ""; return; }

  const tabs = [["home", "Home"], ["clubs", "Clubs"]];
  const waiting = Object.values(S.toCheck).reduce((a, b) => a + b, 0);
  if (S.committee.length || S.isAdmin) tabs.push(["post", "Post"]);
  if (S.committee.length) tabs.push(["manage", waiting ? `Manage (${waiting})` : "Manage"]);
  if (S.isAdmin) tabs.push(["admin", "Admin"]);
  tabs.push(["perks", "Perks"]);
  tabs.push(["profile", "Profile"]);
  const view = { home: S.pay ? viewPay : S.post ? viewPost : viewHome, clubs: S.pay ? viewPay : viewClubs, post: viewPostTab, manage: viewManage, admin: viewAdmin, perks: viewPerks, profile: viewProfile }[S.tab]();
  app.innerHTML = `<header class="topbar">${brand}<span class="who">${esc(S.profile.email)}</span></header>
    <main>${view}</main>
    <nav class="tabs${tabs.length > 5 ? " many" : ""}" aria-label="Sections"><div>${tabs.map(([k, l]) =>
      `<button data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${l}</button>`).join("")}</div></nav>`;
  overlay.innerHTML = viewSheet();
  afterRender();
}
// Pictures are private files, so they are fetched after the page is drawn.
function afterRender() {
  document.querySelectorAll("img[data-path]:not([src])").forEach((img) => {
    imageUrl(img.dataset.bucket, img.dataset.path).then((u) => { img.src = u; }, () => { img.alt = "Picture couldn't be loaded"; });
  });
  const car = document.getElementById("ann-carousel");
  if (car) {
    const n = car.children.length;
    S.carIndex = Math.min(S.carIndex, n - 1);
    car.scrollLeft = slideLeft(car, S.carIndex);
    car.addEventListener("scroll", () => {
      const i = Math.round(car.scrollLeft / Math.max(1, slideLeft(car, 1) || car.clientWidth));
      if (i === S.carIndex) return;
      S.carIndex = i;
      document.querySelectorAll(".car-dots button").forEach((b, k) => b.setAttribute("aria-current", k === i ? "true" : "false"));
      const c = document.getElementById("car-count"); if (c) c.textContent = (i + 1) + " / " + n;
    }, { passive: true });
  }
}
const picTag = (path, cls, alt) => `<img class="${cls}" data-bucket="post-images" data-path="${esc(path)}" alt="${esc(alt)}">`;

/* ---------------------------------------------------------------------
   Actions
   --------------------------------------------------------------------- */
async function busy(btn, fn) {
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "Working…"; }
  try { await fn(); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}
const slideLeft = (car, i) => (car.children[i] ? car.children[i].offsetLeft - car.children[0].offsetLeft : 0);
function carouselTo(i) {
  const car = document.getElementById("ann-carousel");
  if (!car) return;
  const n = car.children.length;
  i = (i + n) % n;                                   // wrap around at either end
  car.scrollTo({ left: slideLeft(car, i), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
async function saveMyColour(clubId, colour) {

  if (error) { toast(friendly(error)); return; }
  S.myColours[clubId] = colour; S.sheet = null; render(); toast("Your colour is saved");
}
async function saveClubColour(colour) {
  const { error } = await sb.from("clubs").update({ color: colour }).eq("id", S.manage.clubId);
  if (error) { toast(friendly(error)); return; }
  await loadData(); render(); toast("Colour saved");
}
async function openPay(clubId, postId = null) {
  const c = S.clubs.find((x) => x.id === clubId);
  const pay = { clubId, postId, file: null, preview: "", error: "", qrUrl: "", qrFailed: false, ref: "", refLoading: true };
  S.pay = pay; S.sheet = null; S.tab = postId ? "home" : "clubs"; render(); window.scrollTo(0, 0);
  const show = () => { if (S.pay === pay) render(); };
  const getRef = (postId ? sb.rpc("event_payment_reference", { post: postId }) : sb.rpc("payment_reference", { club: clubId }))
    .then((r) => { pay.ref = (!r.error && typeof r.data === "string" && r.data) || ""; }, () => {})
    .then(() => { pay.refLoading = false; show(); });
  const getQr = !c.pay_qr_path ? null
    : imageUrl("club-qr", c.pay_qr_path).then((url) => { pay.qrUrl = url; }, () => { pay.qrFailed = true; }).then(show);
  await Promise.all([getRef, getQr]);
}
function goTab(tab) {
  S.tab = tab; S.editing = false; S.formError = ""; S.pay = null; S.post = null; S.postFiles = []; S.postClub = null;
  if (tab === "manage") {
    const mine = S.committee.map((c) => c.club_id);
    if (mine.length === 1) { loadManage(mine[0]); return; }
    S.manage = emptyManage();
  }
  if (tab === "admin") { render(); loadData().then(loadAdmin).catch((e) => toast(friendly(e))); return; }
  render(); window.scrollTo(0, 0);
  // Pick up anything that changed since the page was opened (new clubs, fees, announcements).
  if (tab === "home" || tab === "clubs") {
    loadData().then(() => {
      const typing = ["INPUT", "TEXTAREA", "SELECT"].includes((document.activeElement || {}).tagName);
      if (S.tab === tab && !S.sheet && !S.pay && !S.post && !typing) render();
    }).catch(() => {});
  }
}

  "post-back": () => { S.post = null; render(); },
  "car-move": (d) => carouselTo(S.carIndex + Number(d.step)),

  "ask-sign": (d) => { S.sheet = { type: "sign", id: Number(d.id) }; renderSheet(); },

  "sign": (d, btn) => busy(btn, async () => {
    const post = findPost(Number(d.id));
    if (post && Number(post.event_fee) > 0) {
      const c = S.clubs.find((x) => x.id === post.club_id) || {};
      if (!c.pay_account_number && !c.pay_qr_path) { toast("This club hasn't added its payment details yet."); return; }
      return openPay(post.club_id, post.id);
    }
    const { error } = await sb.from("event_signups").insert({ announcement_id: Number(d.id), student_id: S.user.id });
    if (error && error.code !== "23505") {
      const msg = /row-level security|42501/.test(error.message + error.code) ? "Sign-ups for this event have closed." : friendly(error);
      if (S.sheet) { S.sheet.error = msg; renderSheet(); } else toast(msg);

    }

  }),

  "view-receipt": async (d) => {
