function calendarHtml() {
  const now = new Date();
  const first = CONFIG.CALENDAR_FIRST_YEAR, last = CONFIG.CALENDAR_LAST_YEAR;
  const m = S.calMonth || new Date(now.getFullYear(), now.getMonth(), 1);
  const key = (d) => d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  const byDay = {};
  for (const a of S.myEvents) (byDay[key(new Date(a.event_start))] ||= []).push(a);
  const sel = S.calDay;
  const gridStart = new Date(m.getFullYear(), m.getMonth(), 1 - new Date(m.getFullYear(), m.getMonth(), 1).getDay());  // the Sunday on or before the 1st
  const shownClubs = new Set();
  let cells = ["S", "M", "T", "W", "T", "F", "S"].map((d) => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const date = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const inMonth = date.getMonth() === m.getMonth();
    const evs = inMonth ? (byDay[key(date)] || []) : [];
    evs.forEach((a) => shownClubs.add(a.club_id));
    const dots = evs.slice(0, 3).map((a) => `<i style="background:${clubColour(a.club_id)}" title="${esc(clubName(a.club_id))}"></i>`).join("") + (evs.length > 3 ? "<b>+</b>" : "");
    const cls = ["day", inMonth ? "" : "out", key(date) === key(now) ? "today" : "", inMonth && sel && key(sel) === key(date) ? "sel" : ""].join(" ").replace(/\s+/g, " ").trim();
    const label = date.toLocaleDateString("en-MY", { day: "numeric", month: "long" }) + (evs.length ? ", " + evs.map((a) => clubName(a.club_id)).join(", ") : "");
    cells += inMonth
      ? `<button class="${cls}" data-act="cal-day" data-day="${date.getDate()}" aria-label="${esc(label)}"><span class="n">${date.getDate()}</span><span class="dots">${dots}</span></button>`
      : `<div class="${cls}" aria-hidden="true"><span class="n">${date.getDate()}</span><span class="dots"></span></div>`;
  }
  const months = Array.from({ length: 12 }, (_, i) => `<option value="${i}" ${i === m.getMonth() ? "selected" : ""}>${new Date(2000, i, 1).toLocaleDateString("en-MY", { month: "long" })}</option>`).join("");
  const years = Array.from({ length: last - first + 1 }, (_, i) => first + i).map((y) => `<option ${y === m.getFullYear() ? "selected" : ""}>${y}</option>`).join("");
  const atStart = m.getFullYear() <= first && m.getMonth() === 0, atEnd = m.getFullYear() >= last && m.getMonth() === 11;
  const thisMonth = m.getFullYear() === now.getFullYear() && m.getMonth() === now.getMonth();
  const legend = [...shownClubs].map((cid) => S.v6
    ? `<button class="chip club" style="--club:${clubColour(cid)}" data-act="pick-colour" data-club="${cid}" aria-label="Change the colour for ${esc(clubName(cid))}">${esc(clubName(cid))}</button>`
    : clubChip(cid)).join(" ");

  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const list = sel ? (byDay[key(sel)] || []) : S.myEvents.filter((a) => new Date(a.event_end || a.event_start) >= startToday);
  const item = (a) => {
    const past = new Date(a.event_start) <= now;
    return `<div class="card">
      <div class="row between">${clubChip(a.club_id)}${past ? `<span class="meta">Past</span>` : (S.signups.get(a.id) || {}).status === "pending" ? `<span class="chip">Payment being checked</span>` : ""}</div>
      <h3><button class="titlelink" data-act="open-post" data-id="${a.id}">${esc(a.title)}</button></h3>
      ${eventLine(a)}
      ${past ? "" : calButtons(a) + `<button class="btn quiet small" style="align-self:flex-start" data-act="ask-unsign" data-id="${a.id}">Cancel sign-up</button>`}
    </div>`;
  };
  const empty = !S.myEvents.length
    ? `<p class="meta">Events you sign up for appear here, marked with a dot in each club's colour. Tap an announcement and press Sign up.</p>`
    : sel ? `<p class="meta">No events on this day.</p>` : `<p class="meta">Nothing coming up. Past events stay marked on the calendar.</p>`;
  return `<div class="row between"><h2 id="h-cal">My calendar</h2>${thisMonth ? "" : `<button class="btn quiet small" data-act="cal-today">Today</button>`}</div>
    <div class="card">
      <div class="cal-head">
        <button class="btn quiet small" data-act="cal-move" data-step="-1" aria-label="Previous month" ${atStart ? "disabled" : ""}>‹</button>
        <select id="cal-m" aria-label="Month">${months}</select>
        <select id="cal-y" aria-label="Year">${years}</select>
        <button class="btn quiet small" data-act="cal-move" data-step="1" aria-label="Next month" ${atEnd ? "disabled" : ""}>›</button>
      </div>
      <div class="cal">${cells}</div>
      ${legend ? `<div class="row">${legend}</div>${S.v6 ? `<p class="meta">Tap a club to choose your own colour for it.</p>` : ""}` : ""}
    </div>
    <div class="row between"><h3>${sel ? sel.toLocaleDateString("en-MY", { weekday: "long", day: "numeric", month: "long" }) : "Coming up"}</h3>
      ${sel ? `<button class="link" data-act="cal-all">Show all coming up</button>` : ""}</div>
    <div class="stack">${list.length ? list.map(item).join("") : empty}</div>`;
}

function viewManage() {
  const mine = S.committee.map((c) => c.club_id);
  const id = S.manage.clubId;
  if (id == null) {
    return `${pageHead("manage", "Manage", "Clubs where you are on the committee.")}
      <div class="stack">${mine.map((cid) => `<button class="card clubrow" style="text-align:left;cursor:pointer" data-act="manage" data-club="${cid}">
        ${clubAva(cid)}<span class="grow"><h3>${esc(clubName(cid))}</h3><span class="meta">${esc((S.committee.find((c) => c.club_id === cid) || {}).role || "Committee")}${S.toCheck[cid] ? ` · ${S.toCheck[cid]} payment${S.toCheck[cid] === 1 ? "" : "s"} to check` : ""}</span>
      </span></button>`).join("")}</div>`;
  }
  const m = S.manage;
  if (m.certFor != null) return viewGiveCerts();
  const club = S.clubs.find((c) => c.id === id) || {};
  const fee = Number(club.fee) || 0;
  const canPost = isCommittee(id);
  const canEdit = canPost || S.isAdmin;
  const back = mine.length > 1 || !canPost;
  const pending = (m.members || []).filter((r) => r.status === "pending");
  const active = (m.members || []).filter((r) => r.status === "active");
  const full = (s) => esc(s.first_name) + " " + esc(s.last_name);

  const evPending = m.eventPending || [];
  const evCard = (r) => { const a = (m.posts || []).find((x) => x.id === r.announcement_id) || {}; return `<div class="card">
        <div class="row between"><h3 class="grow">${full(r.students)}</h3><span class="price">${money(r.paid_amount || 0)}</span></div>
        <p class="meta">For <strong>${esc(a.title || "an event")}</strong> · Student ID ${esc(r.students.student_id)} · sent ${when(r.signed_up_at)}</p>
        ${r.pay_ref ? `<p>Reference <strong style="font-family:ui-monospace,Menlo,Consolas,monospace">${esc(r.pay_ref)}</strong></p>` : ""}
        <div class="row">
          <button class="btn quiet small" data-act="view-receipt" data-kind="event" data-post="${r.announcement_id}" data-student="${esc(r.student_id)}">View screenshot</button>
          ${canEdit ? `<button class="btn small" data-act="approve" data-kind="event" data-post="${r.announcement_id}" data-student="${esc(r.student_id)}">Approve</button>
          <button class="btn danger small" data-act="ask-reject" data-kind="event" data-post="${r.announcement_id}" data-student="${esc(r.student_id)}">Not accepted</button>` : ""}
        </div>
      </div>`; };
  const waiting = pending.length + evPending.length;
  const payments = m.members === null || (!waiting && !fee) ? "" : `<div class="stack">
      <h2>Payments to check (${waiting})</h2>
      ${waiting ? `<p class="meta">Before approving, find each reference and amount in the club's bank account. A screenshot on its own can be edited.</p>` : ""}
      ${evPending.map(evCard).join("")}
      ${pending.length ? pending.map((r) => `<div class="card">
        <div class="row between"><h3 class="grow">${full(r.students)}</h3><span class="price">${money(r.paid_amount || 0)}</span></div>
        <p class="meta">Student ID ${esc(r.students.student_id)} · sent ${when(r.submitted_at || r.joined_at)}</p>
        ${r.pay_ref ? `<p>Reference <strong style="font-family:ui-monospace,Menlo,Consolas,monospace">${esc(r.pay_ref)}</strong></p>` : ""}
        ${(() => { const g = m.groups && m.groups.get(r.student_id); if (!g) return "";
          return `<div class="groupbox"><b>Group of ${g.size} · paying for ${(g.join_group_invites || []).length} friends</b>
            <ul class="glist">${(g.join_group_invites || []).map((i) => { const [t, cls] = GROUP_STATUS[i.status] || ["", ""]; return `<li><span class="grow">${esc(i.email)}</span><span class="chip ${cls}">${t}</span></li>`; }).join("")}</ul>
            <p class="meta">When you approve, friends who accepted become members. Friends who accept later join straight away.</p></div>`; })()}
        <div class="row">
          <button class="btn quiet small" data-act="view-receipt" data-student="${esc(r.student_id)}">View screenshot</button>
          ${canEdit ? `<button class="btn small" data-act="approve" data-student="${esc(r.student_id)}">Approve</button>
          <button class="btn danger small" data-act="ask-reject" data-student="${esc(r.student_id)}">Not accepted</button>` : ""}
        </div>
      </div>`).join("") : evPending.length ? "" : `<p class="meta">Nothing waiting. New payments appear here as students send them.</p>`}
    </div>`;

  const members = m.members === null ? `<div class="meta">Loading members…</div>` : !active.length
    ? `<div class="empty">${emptyArt()}<p>${fee ? "No members yet. Students appear here once their payment is approved." : "No members yet. Students appear here as soon as they tap Join."}</p></div>`
    : `<div class="scroll"><table>
        <thead><tr><th>Name</th><th>Student ID</th><th>Year</th><th>School</th><th>Major</th><th>Minor</th><th>Email</th><th>Phone</th><th>Joined</th><th>Paid</th><th>Reference</th></tr></thead>
        <tbody>${active.map((r) => { const s = r.students; return `<tr>
          <td>${full(s)}</td><td class="num">${esc(s.student_id)}</td><td class="num">${esc(s.year)}</td>
          <td>${esc(s.school)}</td><td>${esc([s.major, s.major2].filter(Boolean).join(" / "))}</td><td>${esc([s.minor, s.minor2].filter(Boolean).join(" / "))}</td>
          <td>${esc(s.email)}</td><td class="num">${esc(s.phone || "")}</td><td>${day(r.joined_at)}</td>
          <td class="num">${r.paid_amount != null ? money(r.paid_amount) : ""}</td><td class="num">${esc(r.pay_ref || "")}</td></tr>`; }).join("")}
        </tbody></table></div>`;

  const posts = m.posts === null ? "" : !m.posts.length ? `<p class="meta">Nothing posted yet.</p>`
    : m.posts.map((a) => {
        const n = m.counts[a.id] || 0, list = m.signupLists[a.id];
        return `<div class="card">
        <div class="row between"><h3 class="grow">${esc(a.title)}</h3>${eventOver(a) ? `<span class="chip off">Ended</span>` : `<span class="meta">${when(a.created_at)}</span>`}</div>
        ${eventLine(a)}
        <p class="meta" style="white-space:pre-wrap">${esc(a.body)}</p>
        ${S.v3 ? `<p class="meta"><strong>Who can see it:</strong> ${esc(audienceText(a))}</p>` : ""}
        ${a.signups_open ? `<div class="row"><strong>${n} signed up</strong>
          ${n ? `<button class="btn ghost small" data-act="${list ? "hide-signups" : "show-signups"}" data-id="${a.id}">${list ? "Hide list" : "See who"}</button>` : ""}</div>` : ""}
        ${list ? signupTable(a.id, list) : ""}
        ${canEdit ? `<div class="row">${S.v8 && a.event_start && a.signups_open ? `<button class="btn ghost small" data-act="give-certs" data-id="${a.id}">Give certificates</button>` : ""}
          <button class="btn danger small" data-act="ask-delete-post" data-id="${a.id}">Delete</button></div>` : ""}
      </div>`; }).join("");

  const colourForm = !canEdit || m.members === null || !("color" in club) ? "" : `<div class="stack">
      <h2>Club colour</h2>
      <div class="card">
        <p class="meta">Shown on students' calendars and on your posts, so they can tell clubs apart. Students can still choose their own colour for your club.</p>
        ${colourSwatches("set-colour", clubOwnColour(id), "club-colour-input")}
      </div>
    </div>`;
  const detailsForm = !canEdit || m.members === null ? "" : `<div class="stack" id="club-details">
      <h2>Club details</h2>
      <form data-form="club-info" novalidate class="card">
        <label>Club name<input name="name" id="ci-name" value="${esc(club.name || "")}" required maxlength="80" autocomplete="off"></label>
        <label>Category<input name="category" id="ci-cat" list="ci-cats" value="${esc(club.category || "")}" placeholder="e.g. Career" autocomplete="off"></label>
        <datalist id="ci-cats">${CONFIG.CATEGORIES.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
        <label>What it does<textarea name="description" id="ci-desc" style="min-height:90px" maxlength="400">${esc(club.description || "")}</textarea></label>
        ${S.v7 ? fitFieldsHtml(club) : ""}
        <button class="btn" style="align-self:flex-start">Save club details</button>
      </form>
    </div>`;
  const pageForm = !canEdit || m.members === null ? "" : !S.v9
    ? (S.isAdmin ? `<div class="stack"><h2>Club page</h2><p class="note">To let committees add a cover photo, logo and photos, run database update 9 (club pages) in Supabase.</p></div>` : "")
    : `<div class="stack" id="club-page-edit">
      <h2>Club page</h2>
      <p class="meta">This is what students see when they tap Read more on your club. Make it yours.</p>
      <form data-form="club-page" novalidate class="card">
        <div id="cp-media">${pageMediaHtml(club)}</div>
        <label>About your club <small>Who you are, what you run each semester, and why students should join. Up to 3000 characters.</small>
          <textarea name="about" id="cp-about" maxlength="3000" style="min-height:170px">${esc(club.about || "")}</textarea></label>
        <div class="row">
          <button class="btn">Save club page</button>
          <button type="button" class="btn ghost" data-act="open-club" data-club="${id}">See the page</button>
        </div>
        <p class="meta">Save first, then tap See the page to check it as a student would.</p>
      </form>
    </div>`;
  const qrShown = m.qrPreview || m.qrUrl;
  const feeForm = !canEdit || m.members === null ? "" : `<div class="stack">
      <h2>Membership fee</h2>
      <form data-form="club-fee" novalidate class="card">
        <label>Fee in RM <small>What a student pays to join. Use 0 only if joining is free.</small>
          <input name="fee" id="fee-amount" type="number" min="0" step="0.01" inputmode="decimal" value="${fee}"></label>
        ${S.vG ? `<fieldset class="groupset"><legend>Group price</legend>
          <label class="check"><input type="checkbox" name="bundle_on" id="fee-bundle-on" ${club.bundle_size ? "checked" : ""}> Let students join together for a cheaper price</label>
          <div class="two">
            <label>Students per group<input name="bundle_size" id="fee-bundle-size" type="number" min="2" max="10" step="1" inputmode="numeric" value="${club.bundle_size || 4}"></label>
            <label>Group price in RM<input name="bundle_price" id="fee-bundle-price" type="number" min="0" step="0.01" inputmode="decimal" value="${club.bundle_price != null ? Number(club.bundle_price) : ""}" placeholder="e.g. 18"></label>
          </div>
          <p class="meta">One student pays for the whole group and adds their friends. Each friend accepts in the app.</p>
        </fieldset>` : ""}
        <label>Payment QR code <small>A screenshot of the club's DuitNow QR.</small>
          <input type="file" id="qr-file" accept="image/*"></label>
        <div id="qr-preview" class="stack">${qrShown ? `<img class="qr" src="${qrShown}" alt="The club's payment QR code">` : ""}</div>
        <label>Bank<input name="pay_bank" id="fee-bank" value="${esc(club.pay_bank || "")}" placeholder="e.g. Maybank" autocomplete="off"></label>
        <label>Account name<input name="pay_account_name" id="fee-name" value="${esc(club.pay_account_name || "")}" autocomplete="off"></label>
        <label>Account number<input name="pay_account_number" id="fee-number" value="${esc(club.pay_account_number || "")}" inputmode="numeric" autocomplete="off"></label>
        <label>Note to students <small>Optional.</small>
          <input name="pay_note" id="fee-note" value="${esc(club.pay_note || "")}" placeholder="e.g. Covers the whole academic year." autocomplete="off"></label>
        <div id="fee-error">${m.feeError ? `<div class="error" role="alert">${esc(m.feeError)}</div>` : ""}</div>
        <button class="btn" style="align-self:flex-start">Save fee details</button>
      </form>
    </div>`;
  const canPostHere = canPost || (S.isAdmin && S.v3);

  return `
    ${back ? `<button class="link" style="align-self:flex-start" data-act="${canPost ? "manage-back" : "tab"}" data-tab="admin">Back</button>` : ""}
    <div class="clubhead">${clubAva(id, "lg")}<div class="grow"><h1>${esc(clubName(id))}</h1><p class="lead">${canPost ? "Your members, payments and announcements." : "Members, payments and announcements."}</p></div></div>
    ${m.error ? `<div class="error" role="alert">${esc(m.error)}</div>` : ""}
    ${payments}
    <div class="stack">
      <div class="row between"><h2>Members${m.members ? ` (${active.length})` : ""}</h2>
        ${active.length ? `<button class="btn ghost small" data-act="copy-members">Copy for Google Sheets</button>` : ""}</div>
      ${members}
    </div>
    <div class="stack"><div class="row between"><h2>Posted</h2>
      ${m.members !== null && canPostHere ? `<button class="btn ghost small" data-act="go-post" data-club="${id}">New post</button>` : ""}</div>${posts}</div>
    ${detailsForm}
    ${pageForm}
    ${colourForm}
    ${feeForm}`;
}

// "Who is this club for?" Used to recommend the club to the right students.
function fitFieldsHtml(club) {
  const fs = club.fit_schools || [], fm = club.fit_majors || [];
  return `<fieldset class="aud"><legend>Who is this club for?</legend>
    <p class="meta">The app recommends your club to these students. Tick a whole school, or open it to pick majors.</p>
    ${CONFIG.SCHOOLS.map((s, i) => {
      const c = CONFIG.COURSES[s] || {}, list = [...new Set([...(c.majors || []), ...(c.minors || [])])];
      const picked = list.filter((m) => fm.includes(m)).length;
      return `<details class="fit" ${picked ? "open" : ""}><summary>${esc(s)}${fs.includes(s) ? " · whole school" : picked ? " · " + picked + " picked" : ""}</summary>
        <div class="stack">
          <label class="check"><input type="checkbox" name="fit_school" value="${esc(s)}" id="fs-${i}" ${fs.includes(s) ? "checked" : ""}> All ${esc(s)} students</label>
          ${list.map((m, k) => `<label class="check"><input type="checkbox" name="fit_major" value="${esc(m)}" id="fm-${i}-${k}" ${fm.includes(m) ? "checked" : ""}> ${esc(m)}</label>`).join("")}
        </div></details>`;
    }).join("")}
  </fieldset>`;
}
function signupTable(id, list) {
  if (!list.length) return `<p class="meta">Nobody has signed up yet.</p>`;
  return `<div class="scroll"><table>
      <thead><tr><th>Name</th><th>Student ID</th><th>Year</th><th>School</th><th>Email</th><th>Phone</th><th>Signed up</th><th>Payment</th></tr></thead>
      <tbody>${list.map((r) => { const s = r.students || {}; return `<tr><td>${esc(s.first_name)} ${esc(s.last_name)}</td>
        <td class="num">${esc(s.student_id)}</td><td class="num">${esc(s.year)}</td><td>${esc(s.school)}</td><td>${esc(s.email)}</td>
        <td class="num">${esc(s.phone || "")}</td><td>${day(r.signed_up_at)}</td>
        <td>${r.paid_amount != null ? money(r.paid_amount) + " · " + ({ pending: "to check", confirmed: "approved", rejected: "not accepted" }[r.status] || "") : "Free"}</td></tr>`; }).join("")}</tbody></table></div>
    <button class="btn ghost small" style="align-self:flex-start" data-act="copy-signups" data-id="${id}">Copy for Google Sheets</button>`;
}

// Clubs this person can post for: their committees, plus every club for the admin (once the events update is run).
function postableClubs() {
  const ids = S.committee.map((c) => c.club_id);
  if (S.isAdmin && S.v3) for (const c of S.clubs) if (!ids.includes(c.id)) ids.push(c.id);
  return ids.filter((cid) => S.clubs.some((c) => c.id === cid)).sort((a, b) => clubName(a).localeCompare(clubName(b)));
}
function postFormHtml(ids, preset) {
  const picker = ids.length === 1
    ? `<input type="hidden" name="club_id" value="${ids[0]}"><div class="row"><span class="meta">Posting for</span>${clubChip(ids[0])}</div>`
    : `<label>Club<select name="club_id" id="a-club" required>
        <option value="">Choose a club</option>
        ${ids.map((cid) => `<option value="${cid}" ${preset === cid ? "selected" : ""}>${esc(clubName(cid))}${isCommittee(cid) ? "" : " (as admin)"}</option>`).join("")}</select></label>`;
  return `<form data-form="post" novalidate class="card">
      ${picker}
      <label>Title<input name="title" id="a-title" required maxlength="120" placeholder="e.g. Fintech Ideathon 2026"></label>
      <label>Message<textarea name="body" id="a-body" required placeholder="What, when, where, and how it helps your members."></textarea></label>
      ${S.v7 ? `<label>Pictures <small>Optional, up to 4, such as a poster. The first one is shown on the announcement box.</small>
        <input type="file" id="a-pics" accept="image/*" multiple></label>
        <div class="thumbs" id="a-thumbs">${S.postFiles.map((f) => `<img src="${f.url}" alt="Chosen picture">`).join("")}</div>` : ""}
      ${S.v3 ? `
      <label class="check"><input type="checkbox" name="is_event" id="a-is-event"> This is an event with a date</label>
      <div id="a-event-fields" class="stack" hidden>
        <div class="two">
          <label>Date<input type="date" name="date" id="a-date"></label>
          <label>Place <small>Optional</small><input name="location" id="a-place" placeholder="e.g. Building 9, Room 9-2-03" autocomplete="off"></label>
        </div>
        <div class="two">
          <label>Starts<input type="time" name="start" id="a-start"></label>
          <label>Ends <small>Optional</small><input type="time" name="end" id="a-end"></label>
        </div>
        <label class="check"><input type="checkbox" name="signups" id="a-signups" checked> Let students sign up (it goes into their calendar)</label>
        ${S.v5 ? `<label>Price in RM <small>Leave at 0 if it's free. Students pay to the club's QR code or bank account, the same as membership.</small>
          <input type="number" name="event_fee" id="a-fee" min="0" step="0.01" inputmode="decimal" value="0"></label>` : ""}
      </div>
      <fieldset class="aud">
        <legend>Who can see this?</legend>
        <label class="check"><input type="checkbox" checked disabled> Members of this club (always)</label>
        <label class="check"><input type="checkbox" name="aud_all" id="a-aud-all"> All students</label>
        <p class="meta">Or also students in these schools:</p>
        ${CONFIG.SCHOOLS.map((s, i) => `<label class="check"><input type="checkbox" name="aud_school" value="${esc(s)}" id="a-aud-${i}"> ${esc(s)}</label>`).join("")}
      </fieldset>` : ""}
      <button class="btn">Post</button>
    </form>`;
}
function viewPostTab() {
  const ids = postableClubs();
  if (!ids.length) {
    return `<h1>Post</h1><div class="empty">${emptyArt()}<p>${S.isAdmin && !S.v3
      ? "To post for any club, run database update 4 (events) first. Until then, add yourself to a club's committee to post for it."
      : S.isAdmin ? "No clubs yet. Add one in the Admin tab first." : "You can post once you're on a club's committee."}</p></div>`;
  }
  return `${pageHead("post", "New post", "Announcements and events go to members' Home, and to anyone else you choose.")}
    ${postFormHtml(ids, S.postClub)}
    <p class="meta">To see, delete or check sign-ups for what's been posted, open the club in ${S.committee.length ? "Manage" : "Admin"}.</p>`;
}

  const clubs = S.clubs.map((c) => {
    const com = a.committee.filter((k) => k.club_id === c.id);
    const open = a.open === c.id;
    const n = a.counts[c.id] || { active: 0, pending: 0 };
    return `<div class="card">
      <div class="row between">
        ${clubAva(c.id)}<h3 class="grow">${esc(c.name)}</h3>

      <p class="meta">${esc(c.category || "No category")} · ${Number(c.fee) ? money(c.fee) : "Free"} · ${n.active} member${n.active === 1 ? "" : "s"}${n.pending ? ` · ${n.pending} to check` : ""} · ${com.length} on committee</p>
      <div class="row">
        <button class="btn ghost small" data-act="admin-open" data-club="${c.id}">${open ? "Close" : "Committee"}</button>
        <button class="btn quiet small" data-act="manage" data-club="${c.id}">Members</button>
        <button class="btn quiet small" data-act="manage" data-club="${c.id}" data-focus="club-details">Edit</button>
        <button class="btn quiet small" data-act="toggle-club" data-club="${c.id}">${c.is_active ? "Hide" : "Show"}</button>
      </div>
      ${open ? `<div class="stack" style="border-top:1px solid var(--line);padding-top:12px">
        ${com.length ? com.map((k) => `<div class="row between">
            <div class="grow"><strong>${esc(k.students ? k.students.first_name + " " + k.students.last_name : "Student")}</strong>
              <div class="meta">${esc(k.role || "Committee")}${k.students ? " · " + esc(k.students.email) : ""}</div></div>
            <button class="btn danger small" data-act="remove-committee" data-club="${c.id}" data-student="${esc(k.student_id)}">Remove</button>
          </div>`).join("") : `<p class="meta">No committee members yet.</p>`}
        <form data-form="add-committee" data-club="${c.id}" novalidate>
          <label>Student email or student ID <small>They must have signed up first.</small>
            <input name="who" id="k-who-${c.id}" required autocomplete="off"></label>
          <label>Role<input name="role" id="k-role-${c.id}" placeholder="e.g. President" autocomplete="off"></label>
          <button class="btn small" style="align-self:flex-start">Add to committee</button>
        </form>
      </div>` : ""}
    </div>`;
  }).join("");

// Perks tab: news subscriptions, apps and tools that come free with being a Monash student.
function perkColour(p) {            // neighbouring tiles get colours far apart
  const order = [15, 0, 11, 18, 5, 12, 4, 16, 20, 9, 1, 13, 22, 7, 10, 19, 3, 21, 23];
  return CONFIG.CLUB_COLOURS[order[CONFIG.PERKS.indexOf(p) % order.length]][0];
}
function perkIcon(p) {
  const src = p.logo ? (CONFIG.PERK_LOGOS[p.logo] || p.logo)
    : p.site ? "https://www.google.com/s2/favicons?sz=128&domain=" + encodeURIComponent(p.site) : "";
  const letters = `<span class="mono" style="--c:${perkColour(p)}" aria-hidden="true">${esc(p.short)}</span>`;
  if (!src) return letters;
  // If the picture can't load, fall back to the letter tile.
  return `<span class="mono logo" style="--c:${perkColour(p)}" aria-hidden="true"><img src="${esc(src)}" alt="" loading="lazy" onload="perkIconCheck(this)"
    onerror="perkIconFail(this)" data-short="${esc(p.short)}"></span>`;
}
// A missing or tiny (blurry) icon is swapped for the letter tile.
function perkIconFail(img) { const box = img.parentNode; box.classList.remove("logo"); box.textContent = img.dataset.short; }
function perkIconCheck(img) { if (!img.src.startsWith("data:") && img.naturalWidth < 48) perkIconFail(img); }
function perkListHtml() {
  const q = S.perkSearch.trim().toLowerCase(), saved = savedPerks(), g = S.perkGroup;
  let list = allPerks().filter((p) => q || g === "All" ? true : g === "Saved" ? saved.has(p.name) : p.group === g);
  if (q) list = list.filter((p) => (p.name + " " + (p.short || "") + " " + (p.note || "") + " " + (p.section || "") + " " + p.group).toLowerCase().includes(q));
  if (!list.length) {

    return `<div class="empty">${emptyArt(q ? "search" : "empty")}<p>${msg}</p></div>`;
  }
  const sections = {};
  const head = (p) => (q || g === "All" || g === "Saved") ? p.group + (p.section ? " · " + p.section : "") : p.section || "";
  for (const p of list) (sections[head(p)] ||= []).push(p);
  return Object.entries(sections).map(([title, items]) => `<div class="stack">
      ${title ? `<div class="cat">${esc(title)}</div>` : ""}
      <div class="stack tight lgrid">${items.map((p) => { const on = saved.has(p.name); return `<div class="lrow has-act">
        <a class="lrow-main" href="${esc(p.url || CONFIG.PERKS_FALLBACK)}" target="_blank" rel="noopener">${perkIcon(p)}
          <span class="grow"><b>${esc(p.name)}</b>${p.note ? `<span class="meta">${esc(p.note)}</span>` : ""}</span></a>
        <button class="heart" data-act="save-perk" data-name="${esc(p.name)}" aria-pressed="${on}" aria-label="${on ? "Remove " + esc(p.name) + " from saved" : "Save " + esc(p.name)}">${icon("perks")}</button>
      </div>`; }).join("")}</div>

const VERIFIED_ICON = `<svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 1.5l2.1 1.6 2.6-.2.9 2.5 2.3 1.3-.6 2.6 1.2 2.4-2 1.7-.3 2.6-2.6.5-1.6 2.1-2.4-1.1-2.4 1.1-1.6-2.1-2.6-.5-.3-2.6-2-1.7 1.2-2.4-.6-2.6 2.3-1.3.9-2.5 2.6.2z"/><path fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6.5 10.2l2.3 2.3 4.7-4.9"/></svg>`;
// "2026-10-19" → a local date (no time-zone shift).
const dateOnly = (d) => { const [y, m, dd] = String(d).split("-").map(Number); return new Date(y, (m || 1) - 1, dd || 1); };
const certDay = (d) => dateOnly(d).toLocaleDateString("en-MY", { day: "numeric", month: "short", year: "numeric" });
const certMonth = (d) => dateOnly(d).toLocaleDateString("en-MY", { month: "short", year: "numeric" });
const isoToday = () => { const n = new Date(); return new Date(n.getTime() - n.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const isoLocalDay = (iso) => { const d = new Date(iso); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const freeCert = (key) => CONFIG.FREE_CERTS.find((f) => f.key === key);
// Does a free certificate suit this student's school, majors or minors?
function certFits(f) {
  const p = S.profile || {};
  const mine = [p.school, p.major, p.major2, p.minor, p.minor2].filter(Boolean);
  return (f.fits || []).some((x) => mine.includes(x));
}
function certTile(short, colour) {

}
function certCard(c) {

function render() {
  applyTheme();
  const brand = `<span class="brand"><i></i>${esc(CONFIG.APP_NAME)}</span>`;
  if (S.phase === "loading") { app.className = "shell bare"; app.innerHTML = `<header class="topbar">${brand}</header><div class="center">Loading…</div>`; overlay.innerHTML = ""; return; }
  if (S.phase === "fatal") {
    app.className = "shell bare"; app.innerHTML = `<header class="topbar">${brand}</header><main><h1>Something went wrong</h1>
      <div class="error" role="alert">${esc(S.fatal)}</div>
      <button class="btn wide" data-act="reload">Try again</button>
      ${S.user ? `<button class="btn quiet wide" data-act="logout">Log out</button>` : ""}</main>`;
    overlay.innerHTML = ""; return;
  }
  if (recovering && S.user) { app.className = "shell bare"; app.innerHTML = `<header class="topbar">${brand}</header>${viewRecovery()}`; overlay.innerHTML = ""; return; }
  if (S.phase === "auth") { app.className = "shell bare" + (S.authView === "welcome" ? " welcome-on" : ""); app.innerHTML = (S.authView === "welcome" ? "" : `<header class="topbar">${brand}</header>`) + viewAuth(); overlay.innerHTML = ""; return; }
  if (S.phase === "profile") { app.className = "shell bare"; app.innerHTML = `<header class="topbar">${brand}</header>${viewProfileSetup()}`; overlay.innerHTML = ""; return; }

  // Phone: Home, Clubs, Events, Perks, Certs, Profile. Committee tools (Post, Manage, Admin) live in Profile on a phone
  // and in the sidebar on a computer.
  const tabs = [["home", "Home"], ["clubs", "Clubs"], ["events", "Events"], ["perks", "Perks"], ["certs", "Certs"]];
  const waiting = Object.values(S.toCheck).reduce((a, b) => a + b, 0);
  if (S.committee.length || S.isAdmin) tabs.push(["post", "Post"]);
  if (S.committee.length) tabs.push(["manage", waiting ? `Manage (${waiting})` : "Manage"]);
  if (S.isAdmin) tabs.push(["admin", "Admin"]);
  tabs.push(["profile", waiting ? `Profile (${waiting})` : "Profile"]);
  const TOOLS = ["post", "manage", "admin"];
  const view = (S.pay ? viewPay : S.post ? viewPost : { home: viewHome, clubs: viewClubs, events: viewEvents, post: viewPostTab, manage: viewManage, admin: viewAdmin, perks: viewPerks, certs: viewCerts, profile: viewProfile }[S.tab])();
  const onHero = false;
  const cur = (k) => S.tab === k || (k === "profile" && TOOLS.includes(S.tab));
  const meIni = ((S.profile.first_name || "")[0] || "") + ((S.profile.last_name || "")[0] || "");
  const narrow = S.pay || S.post || S.tab === "post" || (S.tab === "profile" && (S.editing || S.profileView === "settings")) || (S.tab === "clubs" && S.clubPage != null);
  app.className = "shell";
  app.innerHTML = `<header class="topbar${onHero ? " hero-mode on-hero" : ""}">${brand}<button class="me" data-act="tab" data-tab="profile" aria-label="Your profile, ${esc(S.profile.email)}">${esc(meIni.toUpperCase() || "ME")}</button></header>
    <main${narrow ? ' class="narrow"' : ""}>${view}</main>
    <nav class="tabs many" aria-label="Sections">
      <div class="side-brand">${brand}</div>
      <div class="tablist">${tabs.map(([k, l]) => {
      const m = /^(.*) \((\d+)\)$/.exec(l); const label = m ? m[1] : l;
      return `<button class="tab${TOOLS.includes(k) ? " tool" : ""}" data-act="tab" data-tab="${k}" ${cur(k) ? 'aria-current="page"' : ""}>${icon(k)}<span>${k === "certs" ? '<span class="short">Certs</span><span class="long">Certificates</span>' : label}</span>${m ? `<i class="badge">${m[2]}</i>` : ""}</button>`; }).join("")}</div>
      <button class="side-me" data-act="tab" data-tab="profile" ${cur("profile") ? 'aria-current="page"' : ""}><span class="me" aria-hidden="true">${esc(meIni.toUpperCase() || "ME")}</span>
        <span><b>${esc(S.profile.first_name)} ${esc(S.profile.last_name)}</b><small>${esc(S.profile.email)}</small></span></button>
    </nav>`;
  overlay.innerHTML = viewSheet();

}

// On Home the top bar matches the blue header, then turns light once the header has scrolled away.
function syncTopbar() {
  const tb = document.querySelector(".topbar.hero-mode");
  if (!tb) return;
  const hero = document.querySelector(".hero");
  const past = !hero || hero.getBoundingClientRect().bottom <= tb.offsetHeight + 8;
  tb.classList.toggle("on-hero", !past);
}
window.addEventListener("scroll", syncTopbar, { passive: true });
function afterRender() {
  loadPics();
  syncTopbar();
  const car = document.getElementById("ann-carousel");
  if (car) {
    const n = car.children.length;
    S.carIndex = Math.min(S.carIndex, n - 1);
    car.scrollLeft = slideLeft(car, S.carIndex);
    car.addEventListener("scroll", () => {
      const i = Math.round(car.scrollLeft / Math.max(1, slideLeft(car, 1) || car.clientWidth));
      if (i === S.carIndex) return;
      S.carIndex = i;
      document.querySelectorAll(".car-dots button").forEach((b, k) => b.setAttribute("aria-current", k === i ? "true" : "false"));
      const c = document.getElementById("car-count"); if (c) c.textContent = (i + 1) + " / " + n;
    }, { passive: true });
  }
}

   Actions
   --------------------------------------------------------------------- */
async function busy(btn, fn) {
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "Working…"; }
  try { await fn(); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}
const slideLeft = (car, i) => (car.children[i] ? car.children[i].offsetLeft - car.children[0].offsetLeft : 0);
function carouselTo(i) {
  const car = document.getElementById("ann-carousel");
  if (!car) return;
  const n = car.children.length;
  i = (i + n) % n;                                   // wrap around at either end
  car.scrollTo({ left: slideLeft(car, i), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

// Certificates are PDFs or pictures. Pictures are shrunk a little; PDFs go up as they are.
const CERT_MAX = 10 * 1024 * 1024;
async function prepareCertFile(file) {
  if (!file) return null;
  if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
    if (file.size > CERT_MAX) throw new Error("That PDF is over 10 MB. Try a smaller copy.");
    return { blob: file, ext: "pdf", type: "application/pdf", name: file.name };
  }
  if (/^image\//.test(file.type)) {
    const blob = await shrinkImage(file, 2400, 0.9);
    return { blob, ext: "jpg", type: "image/jpeg", name: file.name };
  }
  throw new Error("Choose a PDF, or a photo or screenshot of the certificate.");
}
async function uploadCertFile(folder, f) {
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${f.ext}`;
  const up = await sb.storage.from("certificates").upload(path, f.blob, { contentType: f.type });
  if (up.error) throw new Error(/mime type|exceeded the maximum|too large/i.test(up.error.message) ? "Use a PDF, JPG or PNG under 10 MB." : friendly(up.error));
  return path;
}

function goTab(tab) {
  S.tab = tab; S.editing = false; S.formError = ""; S.pay = null; S.post = null; S.clubPage = null; S.profileView = null; S.postFiles = []; S.postClub = null;
  if (tab === "manage") {

    if (mine.length === 1) { loadManage(mine[0]); return; }

  if (tab === "admin") { render(); loadData().then(loadAdmin).catch((e) => toast(friendly(e))); return; }
  if (tab === "certs" && S.v8) loadCerts().then(() => { if (S.tab === "certs" && !S.sheet) render(); }).catch(() => {});

      if (S.tab === tab && !S.sheet && !S.pay && !S.post && !typing) render();
    }).catch(() => {});
  }
}

const forms = {
  "login": async (f) => {
    S.draft = { email: f.email };
    if (!f.email || !f.password) { S.authError = "Enter your email and password."; render(); return; }
    const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
    if (error) { S.authError = friendly(error); render(); }
  },
  "forgot": async (f) => {
    const email = (f.email || "").trim().toLowerCase();
    S.draft = { email };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { S.authError = "Enter the email you signed up with."; render(); return; }
    const opts = /^https?:$/.test(location.protocol) ? { redirectTo: location.origin + location.pathname } : {};
    const { error } = await sb.auth.resetPasswordForEmail(email, opts);
    if (error) { S.authError = friendly(error); render(); return; }
    S.authError = ""; S.pendingEmail = email; S.authView = "forgot-sent"; render();
  },
  "new-password": async (f) => {
    const fromSheet = !!(S.sheet && S.sheet.type === "password");
    const fail = (msg) => { if (fromSheet) { S.sheet.error = msg; renderSheet(); } else { S.recoveryError = msg; render(); } };
    if ((f.password || "").length < 8) return fail("Choose a password with at least 8 characters.");
    if (f.password !== f.password2) return fail("The two passwords don't match.");
    const { error } = await sb.auth.updateUser({ password: f.password });
    if (error) return fail(/different from the old/i.test(error.message) ? "Choose a password different from your old one." : friendly(error));
    S.sheet = null; S.recoveryError = "";
    if (recovering) { recovering = false; history.replaceState(null, "", location.pathname); }
    render(); toast("New password saved");
  },
  "signup1": async (f) => {
    Object.assign(S.draft, f);
    const email = (f.email || "").trim().toLowerCase();
    let err = "";
    if (!f.first_name.trim() || !f.last_name.trim()) err = "Enter your first and last name.";
    else if (!f.student_id.trim()) err = "Enter your Monash student ID.";
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) err = "Enter a valid email address.";
    else if (CONFIG.ALLOWED_EMAIL_ENDINGS.length && !CONFIG.ALLOWED_EMAIL_ENDINGS.some((e) => email.endsWith(e.toLowerCase())))
      err = "Use your student email (" + CONFIG.ALLOWED_EMAIL_ENDINGS.join(" or ") + ").";
    else if ((f.password || "").length < 8) err = "Choose a password with at least 8 characters.";
    S.authError = err; if (!err) S.authView = "signup2";
    render();
  },
  "signup2": async (f) => {
    Object.assign(S.draft, f);
    const row = profileRow(S.draft);
    const err = checkProfile(row);
    if (err) { S.authError = err; render(); return; }
    const email = S.draft.email.trim().toLowerCase();
    const opts = { data: row };
    if (/^https?:$/.test(location.protocol)) opts.emailRedirectTo = location.origin + location.pathname;
    const { data, error } = await sb.auth.signUp({ email, password: S.draft.password, options: opts });
    if (error) { S.authError = friendly(error); render(); return; }
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      S.authError = "An account with this email already exists. Log in instead."; S.authView = "login"; S.draft = { email }; render(); return;
    }
    if (!data.session) { S.pendingEmail = email; S.authView = "check"; S.authError = ""; S.draft = { email }; render(); }
  },
  "verify-code": async (f) => {
    const token = (f.code || "").replace(/\D/g, "");
    if (token.length < 6) { S.authError = "Enter the code from your email."; render(); return; }
    const { error } = await sb.auth.verifyOtp({ email: S.pendingEmail, token, type: "email" });
    if (error) { S.authError = /expired|invalid/i.test(error.message) ? "That code is wrong or has expired. Check it, or send a new code." : friendly(error); render(); return; }
    S.authError = "";
  },
  "profile-create": async (f) => {
    const row = profileRow(f); S.draft = row;
    const err = checkProfile(row);
    if (err) { S.formError = err; render(); return; }
    const { data, error } = await sb.from("students").insert({ id: S.user.id, email: S.user.email, ...dbRow(row) }).select().single();
    if (error) { S.formError = friendly(error); render(); return; }
    S.profile = data; S.formError = ""; S.draft = {};
    await loadData(); S.phase = "main"; render(); toast("Profile saved");
  },
  "profile-update": async (f) => {
    const row = profileRow(f);
    const err = checkProfile(row);
    if (err) { S.formError = err; S.editDraft = f; render(); return; }
    const { data, error } = await sb.from("students").update(dbRow(row)).eq("id", S.user.id).select().single();
    if (error) { S.formError = friendly(error); S.editDraft = f; render(); return; }
    S.profile = data; S.editing = false; S.editDraft = null; S.formError = ""; render(); toast("Details updated");
  },
  "post": async (f, form) => {
    if (!f.club_id) { toast("Choose which club this is for."); return; }
    if (!f.title.trim() || !f.body.trim()) { toast("Write a title and a message."); return; }
    const clubId = Number(f.club_id);
    const row = { club_id: clubId, author_id: S.user.id, title: f.title.trim(), body: f.body.trim() };
    if (S.v3) {
      row.audience_all = !!f.aud_all;
      row.audience_schools = row.audience_all ? [] : [...form.querySelectorAll("input[name=aud_school]:checked")].map((b) => b.value);
      if (f.is_event) {
        if (!f.date || !f.start) { toast("Add the event's date and start time."); return; }
        const start = new Date(`${f.date}T${f.start}`), end = f.end ? new Date(`${f.date}T${f.end}`) : null;
        if (isNaN(start)) { toast("Check the event's date and start time."); return; }
        if (end && end < start) { toast("The end time is before the start time."); return; }
        Object.assign(row, { event_start: start.toISOString(), event_end: end ? end.toISOString() : null,
          location: (f.location || "").trim() || null, signups_open: !!f.signups });
        if (S.v5) {
          const price = Math.round((Number(f.event_fee) || 0) * 100) / 100;
          if (price < 0 || price > 9999) { toast("Enter a price between 0 and 9999."); return; }
          if (price > 0 && !row.signups_open) { toast("A paid event needs sign-ups switched on."); return; }
          const club = S.clubs.find((c) => c.id === clubId) || {};
          if (price > 0 && !club.pay_account_number && !club.pay_qr_path) { toast("Add the club's QR code or bank details first, under Membership fee on the club's page."); return; }
          row.event_fee = price;
        }
      }
    }
    if (S.v7 && S.postFiles.length) {                  // upload pictures first, filed under the club
      const paths = [];
      for (const [k, f] of S.postFiles.entries()) {
        const path = `${clubId}/${Date.now()}-${k}.jpg`;
        const up = await sb.storage.from("post-images").upload(path, f.blob, { contentType: "image/jpeg" });
        if (up.error) { toast(friendly(up.error)); return; }
        paths.push(path);
      }
      row.image_paths = paths;
    }
    const { error } = await sb.from("announcements").insert(row);
    if (error) { toast(friendly(error)); return; }
    S.postFiles = []; S.postClub = clubId;               // keep the same club picked for the next post
    await loadData();
    render(); window.scrollTo(0, 0);
    toast((row.audience_all ? "Posted to all students" : "Posted") + " for " + clubName(clubId));
  },
  "add-cert": async (f) => {
    const sheet = S.sheet;
    const fail = (msg) => { if (S.sheet === sheet) { sheet.error = msg; sheet.draft = f; renderSheet(); } };
    const title = (f.title || "").trim(), url = (f.credential_url || "").trim();
    if (!title) return fail("Write the certificate's name.");
    if (!f.issued_on) return fail("Add the date you got it.");
    if (f.issued_on > isoToday()) return fail("The date can't be in the future.");
    if (url && !/^https?:\/\/\S+\.\S+/i.test(url)) return fail("The link should start with https://");
    let path = null;
    if (sheet.file) { try { path = await uploadCertFile(S.user.id, sheet.file); } catch (e) { return fail(e.message); } }
    const { error } = await sb.from("certificates").insert({
      student_id: S.user.id, source: "outside", title, issuer: (f.issuer || "").trim() || null, issued_on: f.issued_on,
      file_path: path, credential_url: url || null, free_cert_key: f.free_cert_key || null });
    if (error) { if (path) sb.storage.from("certificates").remove([path]).catch(() => {}); return fail(friendly(error)); }
    S.sheet = null; S.certView = "mine"; S.tab = "certs"; await loadCerts(); render(); window.scrollTo(0, 0); toast("Certificate saved");
  },
  "give-certs": async (f, form) => {
    const m = S.manage, post = m.certFor, clubId = m.clubId;
    const fail = (msg) => { const el = document.getElementById("gc-error"); if (el) el.innerHTML = `<div class="error" role="alert">${esc(msg)}</div>`; else toast(msg); };
    const title = (f.title || "").trim(), award = (f.award || "").trim() || null;
    if (!title) return fail("Give the certificate a name.");
    if (!f.issued_on) return fail("Add the date on the certificate.");
    const to = [...form.querySelectorAll("input[name=to]:checked")].map((b) => b.value);
    if (!to.length) return fail("Tick at least one student.");
    // Skip students who already have this award for this event.
    const same = (c) => (c.award || "").toLowerCase() === (award || "").toLowerCase();
    const already = new Set((m.certGiven || []).filter(same).map((c) => c.student_id));
    const fresh = to.filter((sid) => !already.has(sid));
    if (!fresh.length) return fail(`Everyone ticked already has “${award || "this certificate"}” for this event.`);
    let path = null;
    if (m.certFile) { try { path = await uploadCertFile("club-" + clubId, m.certFile); } catch (e) { return fail(e.message); } }
    const rows = fresh.map((sid) => ({ student_id: sid, source: "club", club_id: clubId, announcement_id: post,
      title, award, issued_on: f.issued_on, file_path: path }));
    const { error } = await sb.from("certificates").insert(rows);
    if (error) { if (path) sb.storage.from("certificates").remove([path]).catch(() => {}); return fail(friendly(error)); }
    const skipped = to.length - fresh.length;
    await openGiveCerts(post);
    toast(`Given to ${fresh.length} student${fresh.length === 1 ? "" : "s"}` + (skipped ? ` · ${skipped} already had it` : ""));
  },
  "pay": async () => {
    const p = S.pay, clubId = p.clubId, uid = S.user.id;
    const fail = (msg) => { p.error = msg; if (S.pay === p) render(); };
    if (!p.file) return fail("Add your payment screenshot first.");
    if (p.postId) {                                     // paying for an event
      const path = `${uid}/e${p.postId}-${Date.now()}.jpg`;
      const up = await sb.storage.from("receipts").upload(path, p.file, { contentType: "image/jpeg" });
      if (up.error) return fail(friendly(up.error));
      if (S.signups.has(p.postId)) {                    // trying again after a payment was not accepted
        const del = await sb.from("event_signups").delete().eq("student_id", uid).eq("announcement_id", p.postId);
        if (del.error) return fail(friendly(del.error));
      }
      const { error } = await sb.from("event_signups").insert({ announcement_id: p.postId, student_id: uid, receipt_path: path });
      if (error) { await loadData().catch(() => {}); return fail(/row-level security|42501/.test(error.message + error.code) ? "Sign-ups for this event have closed." : friendly(error)); }
      S.pay = null; S.sheet = { type: "done", img: "success", title: "Payment sent!", text: "Your place is confirmed once the committee checks your payment." }; await loadData(); render(); window.scrollTo(0, 0);
      return;
    }
    if (p.group) {                                      // paying for a group
      const friends = p.friends.map((x) => String(x || "").trim().toLowerCase());
      const own = String(S.profile.email || S.user.email || "").toLowerCase();
      if (friends.some((x) => !x)) return fail(`Add all ${friends.length} friends' emails.`);
      const bad = friends.find((x) => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
      if (bad) return fail(`“${bad}” isn't a valid email. Check it.`);
      if (friends.includes(own)) return fail("Use your friends' emails, not your own.");
      if (new Set(friends).size !== friends.length) return fail("Each friend's email can only be added once.");
      const path = `${uid}/${clubId}-${Date.now()}.jpg`;
      const up = await sb.storage.from("receipts").upload(path, p.file, { contentType: "image/jpeg" });
      if (up.error) return fail(friendly(up.error));
      const { error } = await sb.rpc("join_club_group", { club: clubId, receipt: path, friends });
      if (error) { await loadData().catch(() => {}); return fail(groupError(error)); }
      S.pay = null; S.sheet = { type: "done", img: "success", title: "Payment sent!", text: "Your friends will see an invite in the app. Once the committee checks your payment, everyone who has accepted becomes a member." };
      await loadData(); render(); window.scrollTo(0, 0);
      return;
    }
    const path = `${uid}/${clubId}-${Date.now()}.jpg`;
    const up = await sb.storage.from("receipts").upload(path, p.file, { contentType: "image/jpeg" });
    if (up.error) return fail(friendly(up.error));
    if (my(clubId)) {                                   // trying again after a payment was not accepted
      const del = await sb.from("memberships").delete().eq("student_id", uid).eq("club_id", clubId);
      if (del.error) return fail(friendly(del.error));
    }
    const { error } = await sb.from("memberships").insert({ student_id: uid, club_id: clubId, receipt_path: path });
    if (error) { await loadData().catch(() => {}); return fail(friendly(error)); }
    S.pay = null; S.sheet = { type: "done", img: "success", title: "Payment sent!", text: "The committee will check it soon. You become a member once they approve it." }; await loadData(); render(); window.scrollTo(0, 0);
  },
  "swap-friend": async (f) => {
    const s = S.sheet, email = String(f.email || "").trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { s.error = "Enter your friend's email."; renderSheet(); return; }
    const { error } = await sb.rpc("replace_group_invite", { grp: s.group, old_email: s.email, new_email: email });
    if (error) { s.error = groupError(error); renderSheet(); return; }
    S.sheet = null; await loadData(); render(); toast("Invite sent to " + email);
  },
  "reject": async (f, form) => {
    const clubId = S.manage.clubId;
    const change = { status: "rejected", reject_reason: f.reason.trim() || null };
    const { error } = form.dataset.kind === "event"
      ? await sb.from("event_signups").update(change).eq("announcement_id", Number(form.dataset.post)).eq("student_id", form.dataset.student)
      : await sb.from("memberships").update(change).eq("club_id", clubId).eq("student_id", form.dataset.student);
    if (error) { S.sheet.error = friendly(error); renderSheet(); return; }
    S.sheet = null; await loadData(); await loadManage(clubId); toast("Marked as not accepted");
  },
  "club-info": async (f, form) => {
    const clubId = S.manage.clubId, name = f.name.trim();
    if (!name) { toast("Give the club a name."); return; }
    const change = { name, category: f.category.trim() || null, description: f.description.trim() || null };
    if (S.v7) {
      change.fit_schools = [...form.querySelectorAll("input[name=fit_school]:checked")].map((b) => b.value);
      change.fit_majors = [...new Set([...form.querySelectorAll("input[name=fit_major]:checked")].map((b) => b.value))];
    }
    const { error } = await sb.from("clubs").update(change).eq("id", clubId);
    if (error) { toast(friendly(error)); return; }
    await loadData(); await loadManage(clubId); toast("Club details saved");
  },
  "club-page": async (f) => {
    const m = S.manage, clubId = m.clubId, club = S.clubs.find((c) => c.id === clubId) || {}, p = pageState();
    const about = (f.about || "").trim();
    if (about.length > 3000) { toast("Keep About under 3000 characters."); return; }
    const put = async (blob, kind) => {
      const path = `${clubId}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
      const up = await sb.storage.from("club-media").upload(path, blob, { contentType: "image/jpeg" });
      if (up.error) throw up.error;
      return path;
    };
    const cover = p.cover ? await put(p.cover.blob, "cover") : p.coverGone ? null : club.cover_path || null;
    const logo = p.logo ? await put(p.logo.blob, "logo") : p.logoGone ? null : club.logo_path || null;
    const gallery = [...p.keep];
    for (const a of p.add) gallery.push(await put(a.blob, "photo"));
    const { error } = await sb.from("clubs").update({ cover_path: cover, logo_path: logo, about: about || null, gallery_paths: gallery }).eq("id", clubId);
    if (error) { toast(friendly(error)); return; }
    const still = new Set([cover, logo, ...gallery]);   // tidy up pictures that were replaced or removed
    const gone = [club.cover_path, club.logo_path, ...(club.gallery_paths || [])].filter((x) => x && !still.has(x));
    if (gone.length) sb.storage.from("club-media").remove(gone).catch(() => {});
    await loadData(); await loadManage(clubId);
    const el = document.getElementById("club-page-edit"); if (el) el.scrollIntoView({ block: "start" });
    toast("Club page saved");
  },
  "club-fee": async (f) => {
    const clubId = S.manage.clubId;
    const club = S.clubs.find((c) => c.id === clubId);
    const fail = (msg) => { S.manage.feeError = msg; const el = document.getElementById("fee-error"); if (el) el.innerHTML = `<div class="error" role="alert">${esc(msg)}</div>`; };
    const fee = Math.round((Number(f.fee) || 0) * 100) / 100;
    const number = f.pay_account_number.trim(), bank = f.pay_bank.trim(), holder = f.pay_account_name.trim();
    if (fee < 0 || fee > 9999) return fail("Enter a fee between 0 and 9999.");
    if (number && (!bank || !holder)) return fail("Add the bank and the account name as well.");
    if (fee > 0 && !number && !S.manage.qrFile && !club.pay_qr_path) return fail("Add a QR code or a bank account so students can pay.");
    const bundle = {};
    if (S.vG) {
      if (f.bundle_on) {
        const size = Number(f.bundle_size), price = Math.round((Number(f.bundle_price) || 0) * 100) / 100;
        if (!(fee > 0)) return fail("A group price needs a membership fee above 0.");
        if (!Number.isInteger(size) || size < 2 || size > 10) return fail("Students per group must be a whole number from 2 to 10.");
        if (!(price > 0)) return fail("Enter the group price.");
        if (price >= fee * size) return fail(`The group price should be cheaper than ${size} single fees (${money(fee * size)}).`);
        Object.assign(bundle, { bundle_size: size, bundle_price: price });
      } else Object.assign(bundle, { bundle_size: null, bundle_price: null });
    }
    let qrPath = club.pay_qr_path || null;
    if (S.manage.qrFile) {
      const path = `${clubId}/qr-${Date.now()}.jpg`;
      const up = await sb.storage.from("club-qr").upload(path, S.manage.qrFile, { contentType: "image/jpeg" });
      if (up.error) return fail(friendly(up.error));
      qrPath = path;
    }
    const { error } = await sb.from("clubs").update({
      fee, pay_bank: bank || null, pay_account_name: holder || null, pay_account_number: number || null,
      pay_qr_path: qrPath, pay_note: f.pay_note.trim() || null, ...bundle
    }).eq("id", clubId);
    if (error) return fail(friendly(error));
    await loadData(); await loadManage(clubId); toast("Fee details saved");
  },
  "add-club": async (f) => {
    if (!f.name.trim()) { toast("Give the club a name."); return; }
    if (String(f.fee).trim() === "") { toast("Enter the membership fee. Type 0 only if the club is free."); return; }
    const fee = Math.round(Number(f.fee) * 100) / 100;
    if (!(fee >= 0) || fee > 9999) { toast("Enter a fee between 0 and 9999."); return; }
    const { error } = await sb.from("clubs").insert({ name: f.name.trim(), category: f.category.trim() || null, description: f.description.trim() || null, fee });
    if (error) { toast(friendly(error)); return; }
    await loadData(); await loadAdmin();
    toast(fee > 0 ? "Club added. Its committee now needs to add the payment details." : "Club added");
  },
  "add-committee": async (f, form) => {
    const who = (f.who || "").trim();
    if (!who) { toast("Enter the student's email or student ID."); return; }
    const q = sb.from("students").select("id, first_name");
    const { data, error } = await (who.includes("@") ? q.eq("email", who.toLowerCase()) : q.eq("student_id", who)).maybeSingle();
    if (error) { toast(friendly(error)); return; }
    if (!data) { toast("No student found. They need to sign up first."); return; }
    const ins = await sb.from("club_committee").insert({ club_id: Number(form.dataset.club), student_id: data.id, role: f.role.trim() || null });
    if (ins.error) { toast(friendly(ins.error)); return; }
    await loadData(); await loadAdmin(); toast(data.first_name + " added to committee");
  }
};

document.addEventListener("click", (e) => {
  if (e.target.closest("a[href]")) return;
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("sheet-back") && e.target !== el) return;   // clicks inside the sheet don't close it
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el.dataset, el.tagName === "BUTTON" ? el : null)).catch((err) => toast(friendly(err)));
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  const fn = forms[form.dataset.form];
  const values = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector("button:not([type=button])");
  busy(btn, () => fn(values, form)).catch((err) => toast(friendly(err)));
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset && e.target.dataset.friend;
  if (k != null && S.pay && S.pay.friends) S.pay.friends[Number(k)] = e.target.value;
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  const byId = (id) => document.getElementById(id);
  if (el.id === "f-school") {                       // a different school has different majors and minors
    for (const kind of courseKinds()) {
      byId("f-" + kind).innerHTML = courseOptions(kind, el.value, "").html;
      byId("f-" + kind + "-other-wrap").hidden = true;
      byId("f-" + kind + "-other").value = "";
    }
  }
  if (["f-major", "f-minor", "f-major2", "f-minor2"].includes(el.id)) {
    const wrap = byId(el.id + "-other-wrap");
    wrap.hidden = el.value !== OTHER;
    if (!wrap.hidden) byId(el.id + "-other").focus();
  }
  if (el.id === "my-colour-input" && S.sheet && S.sheet.type === "my-colour") saveMyColour(S.sheet.clubId, el.value);
  if (el.id === "club-colour-input" && S.manage.clubId != null) saveClubColour(el.value);
  if (el.id === "cal-m" || el.id === "cal-y") {
    S.calMonth = new Date(Number(byId("cal-y").value), Number(byId("cal-m").value), 1); S.calDay = null; render();
  }
  if (el.id === "a-club") S.postClub = Number(el.value) || null;
  if (el.id === "a-is-event") byId("a-event-fields").hidden = !el.checked;
  if (el.id === "a-pics") {
    const files = [...el.files].slice(0, 4);
    if (el.files.length > 4) toast("Only the first 4 pictures are used.");
    S.postFiles = [];
    for (const f of files) {
      try { const blob = await shrinkImage(f, 1600, 0.82); S.postFiles.push({ blob, url: URL.createObjectURL(blob) }); }
      catch (err) { toast(friendly(err)); }
    }
    byId("a-thumbs").innerHTML = S.postFiles.map((f) => `<img src="${f.url}" alt="Chosen picture">`).join("");
  }
  if (el.id === "a-aud-all") document.querySelectorAll("input[name=aud_school]").forEach((b) => { b.disabled = el.checked; if (el.checked) b.checked = false; });
  if (el.id === "ac-file" && S.sheet && S.sheet.type === "add-cert") {
    const sheet = S.sheet, note = byId("ac-file-note");
    try { sheet.file = await prepareCertFile(el.files[0]); sheet.error = ""; if (note) note.textContent = sheet.file ? sheet.file.name + " is ready." : ""; }
    catch (err) { sheet.file = null; el.value = ""; if (note) { note.textContent = err.message; note.setAttribute("role", "alert"); } }
  }
  if (el.id === "gc-file") {
    const m = S.manage, note = byId("gc-file-note");
    try { m.certFile = await prepareCertFile(el.files[0]); if (note) note.textContent = m.certFile ? m.certFile.name + " is ready." : ""; }
    catch (err) { m.certFile = null; el.value = ""; if (note) { note.textContent = err.message; note.setAttribute("role", "alert"); } }
  }
  if (el.id === "gc-all") document.querySelectorAll("input[name=to]").forEach((b) => { b.checked = el.checked; });
  if (el.name === "to") { const all = byId("gc-all"), boxes = [...document.querySelectorAll("input[name=to]")]; if (all) all.checked = boxes.every((b) => b.checked); }
  if (el.id === "pay-file" && S.pay) {
    const p = S.pay;
    try { p.file = await shrinkImage(el.files[0], 1400, 0.82); p.preview = URL.createObjectURL(p.file); p.error = ""; }
    catch (err) { p.file = null; p.preview = ""; p.error = friendly(err); }
    if (S.pay !== p) return;
    document.getElementById("pay-preview").innerHTML = p.preview ? `<img class="shot" src="${p.preview}" alt="Your payment screenshot">` : "";
    document.getElementById("pay-error").innerHTML = p.error ? `<div class="error" role="alert">${esc(p.error)}</div>` : "";
  }
  if ((el.id === "cp-cover" || el.id === "cp-logo" || el.id === "cp-photos") && S.manage.clubId != null) {
    const p = pageState(), files = [...el.files];
    try {
      if (el.id === "cp-photos") {
        const room = 12 - p.keep.length - p.add.length;
        if (files.length > room) toast(room ? `Only ${room} more photo${room === 1 ? "" : "s"} fit. A club page holds 12.` : "A club page holds 12 photos. Remove one first.");
        for (const f of files.slice(0, Math.max(0, room))) { const blob = await shrinkImage(f, 1600, 0.82); p.add.push({ blob, url: URL.createObjectURL(blob) }); }
      } else if (files[0]) {
        const blob = await shrinkImage(files[0], el.id === "cp-cover" ? 1800 : 600, 0.86);
        if (el.id === "cp-cover") { p.cover = { blob, url: URL.createObjectURL(blob) }; p.coverGone = false; }
        else { p.logo = { blob, url: URL.createObjectURL(blob) }; p.logoGone = false; }
      }
    } catch (err) { toast(friendly(err)); }
    refreshPageMedia();
  }
  if (el.id === "qr-file") {
    const m = S.manage;
    try { m.qrFile = await shrinkImage(el.files[0], 1200, 0.92); m.qrPreview = URL.createObjectURL(m.qrFile); m.feeError = ""; }
    catch (err) { m.qrFile = null; m.qrPreview = ""; m.feeError = friendly(err); }
    if (S.manage !== m) return;
    const shown = m.qrPreview || m.qrUrl;
    document.getElementById("qr-preview").innerHTML = shown ? `<img class="qr" src="${shown}" alt="The club's payment QR code">` : "";
    document.getElementById("fee-error").innerHTML = m.feeError ? `<div class="error" role="alert">${esc(m.feeError)}</div>` : "";
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "perk-search") {
    S.perkSearch = e.target.value;
    document.getElementById("perk-list").innerHTML = perkListHtml();
    return;
  }
  if (e.target.id === "home-search") {
    const box = document.getElementById("home-results"), q = e.target.value.trim().toLowerCase();
    if (!q) { box.hidden = true; box.innerHTML = ""; return; }
    box.innerHTML = searchResults(q); box.hidden = false; loadPics();
    return;
  }
  if (e.target.id !== "club-search") return;
  S.clubSearch = e.target.value;
  document.getElementById("club-list").innerHTML = clubListHtml();
  loadPics();
});

async function handleSession(session) {
  const uid = session && session.user ? session.user.id : null;
  if (uid === currentUid) return;
  currentUid = uid;
  const keepAuth = { authView: S.authView, draft: S.draft, pendingEmail: S.pendingEmail };
  reset();
  if (!uid) { Object.assign(S, keepAuth.authView === "check" ? keepAuth : {}, { phase: "auth" }); render(); return; }
  S.user = session.user; render();
  try { await loadAccount(); }
  catch (err) { S.phase = "fatal"; S.fatal = friendly(err); }
  if (currentUid === uid) render();
}

(function start() {
  if (!window.supabase) {
    S.phase = "fatal"; S.fatal = "The app couldn't load. Check your internet connection and reload the page."; render(); return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") recovering = true;     // arrived from a reset-password email
    setTimeout(async () => { await handleSession(session); if (recovering) render(); }, 0);
  });
  render();
})();
</script>
