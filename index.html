<style>
/* Layout: one phone-width column, like a campus notice board. Sticky title bar on top, tab bar at the bottom. */

  --surface: #FFFFFF;
  --ink: #12202A;
  --muted: #5B6B76;
  --line: #D6DEE3;
  --accent: #0A6B63;
  --accent-ink: #FFFFFF;
  --soft: #E0F0EE;
  --mark: #F4C430;
  --mark-ink: #3A2E00;
  --danger: #B3261E;
  --danger-soft: #FBE9E7;
  --shadow: 0 1px 2px rgba(18, 32, 42, .06), 0 4px 14px rgba(18, 32, 42, .06);
  --display: "Bricolage Grotesque", "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E161B;
    --surface: #17222A;
    --ink: #E7EEF2;
    --muted: #93A4AF;
    --line: #2A3842;
    --accent: #46C2B5;
    --accent-ink: #062421;
    --soft: #13302E;
    --mark: #F0C02E;
    --mark-ink: #2B2200;
    --danger: #FF8A80;
    --danger-soft: #3A1E1C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--body);

}

h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }

h2 { font-size: 1.2rem; font-weight: 700; }

p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.tabs {

}
.tabs div { max-width: 480px; margin: 0 auto; display: flex; }

}

.card {

}
.notice { position: relative; padding-top: 22px; box-shadow: var(--shadow); border-color: transparent; }

.notice .body { white-space: pre-wrap; overflow-wrap: anywhere; }

.btn {

form { display: flex; flex-direction: column; gap: 14px; }
label { display: flex; flex-direction: column; gap: 5px; font-size: .88rem; font-weight: 600; }
label small { font-weight: 400; color: var(--muted); }
input, select, textarea {

}
textarea { min-height: 110px; resize: vertical; }

.seg { display: flex; background: var(--line); border-radius: 10px; padding: 3px; gap: 3px; }

.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }

dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
dt { color: var(--muted); font-size: .88rem; }
dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }

.empty { text-align: center; color: var(--muted); padding: 28px 16px; border: 1px dashed var(--line); border-radius: var(--radius); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.sheet-back { position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 18, .55); display: flex; align-items: flex-end; justify-content: center; }

  background: var(--surface); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0;
  padding: 22px 18px calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; gap: 14px;
  max-height: 92dvh; overflow-y: auto;
}
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; z-index: 30;
  max-width: calc(100% - 32px);
}
.center { min-height: 60dvh; display: flex; align-items: center; justify-content: center; color: var(--muted); }
@media (max-width: 360px) { .two { grid-template-columns: 1fr; } }

/* ===================================================================== */
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (iso) => new Date(iso).toLocaleString("en-MY", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const money = (n) => "RM " + (Number(n) % 1 === 0 ? Number(n).toFixed(0) : Number(n).toFixed(2));
const day = (iso) => new Date(iso).toLocaleDateString("en-MY", { day: "numeric", month: "short", year: "numeric" });

function friendly(err) {
  const m = (err && (err.message || err.error_description)) || String(err || "Something went wrong.");
  const code = err && err.code;
  if (code === "23505" && /student_id/.test(m + (err.details || ""))) return "That student ID is already registered to another account.";
  if (code === "23505" && /clubs_name/.test(m)) return "A club with that name already exists.";
  if (code === "23505" && /club_committee/.test(m)) return "That student is already on this committee.";
  if (code === "23505" && /memberships/.test(m)) return "You have already joined this club.";
  if (code === "23514" && /major_or_minor/.test(m)) return "From Year 2 onwards, choose your major or a minor.";
  if (/receipt_required/.test(m)) return "Add your payment screenshot first.";
  if (/own_payment/.test(m)) return "Another committee member has to check your own payment.";
  if (/mime type|exceeded the maximum|too large/i.test(m)) return "Use a JPG or PNG image under 5 MB.";
  if (code === "42501" || /row-level security/i.test(m)) return "You don't have permission to do that.";
  if (/Invalid login credentials/i.test(m)) return "Wrong email or password.";
  if (/Email not confirmed/i.test(m)) return "Confirm your email first. Open the link we sent to your inbox, then log in.";
  if (/not authorized/i.test(m) && /email/i.test(m)) return "The confirmation email could not be sent to this address. The project's email sender is still in test mode.";
  if (/rate limit/i.test(m)) return "Too many emails were sent in the last hour. Wait a while and try again.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Can't reach the server. Check your internet connection and try again.";
  if (/Password should be/i.test(m)) return "Choose a longer password (at least 6 characters).";
  return m;
}

let toastTimer;
function toast(msg) {
  clearTimeout(toastTimer);
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 2800);
}

/* ---------------------------------------------------------------------
   Images (payment screenshots and club QR codes are private files)
   --------------------------------------------------------------------- */
const imageCache = {};
async function imageUrl(bucket, path) {
  const key = bucket + "/" + path;
  if (!imageCache[key]) {
    const { data, error } = await sb.storage.from(bucket).download(path);
    if (error) throw error;
    imageCache[key] = URL.createObjectURL(data);
  }
  return imageCache[key];
}
// Make a photo or screenshot small enough to upload quickly.
function shrinkImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const bad = () => reject(new Error("Couldn't read that image. Try a JPG or PNG screenshot."));
    if (!file || !/^image\//.test(file.type)) { reject(new Error("Choose an image file (a screenshot or photo).")); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(img.width * scale)); cv.height = Math.max(1, Math.round(img.height * scale));
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob((b) => (b ? resolve(b) : bad()), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(); };
    img.src = url;
  });
}
async function copyText(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand && document.execCommand("copy"); ta.remove();
    toast(ok ? done : "Couldn't copy. Try a different browser.");
  }
}

}

  if (p.year > 1 && !p.major && !p.minor) return "From Year 2 onwards, choose your major or a minor.";
  if (p.major2 && !p.major) return "Choose your first major before a second one.";
  if (p.major2 && p.major2 === p.major) return "Your second major is the same as your first.";
  if (p.minor2 && !p.minor) return "Choose your first minor before a second one.";
  if (p.minor2 && p.minor2 === p.minor) return "Your second minor is the same as your first.";
  return "";
}

async function loadAccount() {
  const uid = S.user.id;
  // Has the events update been run on the database? If not, the app hides those parts.
  const probe = await sb.from("event_signups").select("announcement_id").limit(1);
  S.v3 = !probe.error;
  const [p, a] = await Promise.all([
    sb.from("students").select("*").eq("id", uid).maybeSingle(),
    sb.from("admins").select("user_id").eq("user_id", uid).maybeSingle()
  ]);
  if (p.error) throw p.error;
  if (a.error) throw a.error;
  S.profile = p.data; S.isAdmin = !!a.data;

  // First login after sign-up: create the student record from the sign-up answers.
  if (!S.profile) {
    const row = profileRow(S.user.user_metadata || {});
    if (!checkProfile(row)) {
      const ins = await sb.from("students").insert({ id: uid, email: S.user.email, ...dbRow(row) }).select().single();
      if (ins.error) { S.draft = row; S.formError = friendly(ins.error); }
      else S.profile = ins.data;
    }
  }
  if (!S.profile) { S.phase = "profile"; return; }
  await loadData();
  S.phase = "main";
}

async function loadData() {
  const uid = S.user.id;
  const [c, m, k, f] = await Promise.all([
    sb.from("clubs").select("*").order("name"),
    sb.from("memberships").select("*").eq("student_id", uid),
    sb.from("club_committee").select("club_id, role").eq("student_id", uid),
    sb.from("announcements").select("*").order("created_at", { ascending: false }).limit(80)
  ]);
  for (const r of [c, m, k, f]) if (r.error) throw r.error;
  S.clubs = c.data;
  S.mine = new Map(m.data.map((r) => [r.club_id, r]));
  S.committee = k.data;
  const visible = new Set([...activeIds(), ...k.data.map((r) => r.club_id)]);
  const school = S.profile && S.profile.school;
  S.feed = f.data.filter((r) => visible.has(r.club_id) || r.audience_all || (!!school && (r.audience_schools || []).includes(school)));
  S.signups = new Set(); S.myEvents = [];
  if (S.v3) {
    const e = await sb.from("event_signups").select("announcement_id, announcements(*)").eq("student_id", uid);
    if (e.error) throw e.error;
    S.signups = new Set(e.data.map((r) => r.announcement_id));
    S.myEvents = e.data.map((r) => r.announcements).filter((a) => a && a.event_start)
      .sort((x, y) => new Date(x.event_start) - new Date(y.event_start));
  }
  S.toCheck = {};
  if (k.data.length) {
    const p = await sb.from("memberships").select("club_id").eq("status", "pending").in("club_id", k.data.map((r) => r.club_id));
    if (p.error) throw p.error;
    for (const r of p.data) S.toCheck[r.club_id] = (S.toCheck[r.club_id] || 0) + 1;
  }
}

async function loadManage(clubId) {
  S.manage = emptyManage(clubId);
  render();
  const club = S.clubs.find((c) => c.id === clubId) || {};
  const [m, p, qr] = await Promise.all([
    sb.from("memberships")
      .select("*, students(*)")
      .eq("club_id", clubId).order("joined_at"),
    sb.from("announcements").select("*").eq("club_id", clubId).order("created_at", { ascending: false }),
    club.pay_qr_path ? imageUrl("club-qr", club.pay_qr_path).catch(() => "") : ""
  ]);
  if (S.manage.clubId !== clubId) return;
  if (m.error || p.error) S.manage.error = friendly(m.error || p.error);
  S.manage.members = (m.data || []).filter((r) => r.students);
  S.manage.posts = p.data || [];
  S.manage.qrUrl = qr;
  const withSignups = S.manage.posts.filter((a) => a.signups_open).map((a) => a.id);
  if (S.v3 && withSignups.length) {
    const c = await sb.from("event_signups").select("announcement_id").in("announcement_id", withSignups);
    if (S.manage.clubId !== clubId) return;
    for (const r of c.data || []) S.manage.counts[r.announcement_id] = (S.manage.counts[r.announcement_id] || 0) + 1;
  }
  render();
}

async function loadAdmin() {
  const [k, m, s] = await Promise.all([
    sb.from("club_committee").select("club_id, role, student_id, students(first_name, last_name, email, student_id)"),
    sb.from("memberships").select("club_id, status"),
    sb.from("students").select("id", { count: "exact", head: true })
  ]);
  const err = k.error || m.error || s.error;
  S.admin.error = err ? friendly(err) : "";
  S.admin.committee = k.data || [];
  S.admin.counts = {};
  for (const r of m.data || []) { const c = (S.admin.counts[r.club_id] ||= { active: 0, pending: 0 }); if (r.status in c) c[r.status]++; }
  S.admin.students = s.count ?? null;
  S.admin.loaded = true;
  render();
}

/* ---------------------------------------------------------------------
   Screens
   --------------------------------------------------------------------- */
function clubColour(id) {
  const c = S.clubs.find((x) => x.id === id);
  if (c && /^#[0-9a-f]{6}$/i.test(c.color || "")) return c.color;
  const ids = S.clubs.map((x) => x.id).sort((a, b) => a - b);
  // Hand out colours that are far apart first (blue, orange, green, purple…), so neighbouring clubs don't look alike.
  const order = [6, 2, 4, 8, 0, 5, 3, 1, 7, 10, 9, 11], list = CONFIG.CLUB_COLOURS;
  const i = ids.indexOf(id), n = i < 0 ? Math.abs(id) || 0 : i;
  return list[order[n % order.length] % list.length][0];
}
const clubChip = (id) => `<span class="chip club" style="--club:${clubColour(id)}">${esc(clubName(id))}</span>`;
const clubName = (id) => (S.clubs.find((c) => c.id === id) || {}).name || "Club";
const my = (id) => S.mine.get(id) || null;
const findPost = (id) => [...S.feed, ...S.myEvents, ...(S.manage.posts || [])].find((a) => a.id === id);
function eventWhen(a) {
  const s = new Date(a.event_start), e = a.event_end ? new Date(a.event_end) : null;
  const t = (x) => x.toLocaleTimeString("en-MY", { hour: "numeric", minute: "2-digit" });
  const d = s.toLocaleDateString("en-MY", { weekday: "short", day: "numeric", month: "short" });
  const same = e && e.toDateString() === s.toDateString();
  return d + " · " + t(s) + (e ? " – " + (same ? t(e) : e.toLocaleDateString("en-MY", { day: "numeric", month: "short" }) + " " + t(e)) : "");
}
const eventLine = (a) => (a.event_start ? `<p class="when">${esc(eventWhen(a))}${a.location ? " · " + esc(a.location) : ""}</p>` : "");
function audienceText(a) {
  if (a.audience_all) return "Open to all students";
  const sc = a.audience_schools || [];
  return sc.length ? "Members, and students in " + sc.join(", ") : "Members only";
}
// Times for calendars: an event with no end time is treated as one hour long.
function eventTimes(a) { const s = new Date(a.event_start); return [s, a.event_end ? new Date(a.event_end) : new Date(s.getTime() + 3600000)]; }
const icsDate = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
const icsText = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function downloadIcs(a) {
  const [s, e] = eventTimes(a);
  const fold = (l) => (l.length <= 73 ? l : l.match(/.{1,73}/g).join("\r\n "));
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Clubs app//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:post-${a.id}@clubs-app`, `DTSTAMP:${icsDate(new Date())}`, `DTSTART:${icsDate(s)}`, `DTEND:${icsDate(e)}`,
    `SUMMARY:${icsText(a.title + " (" + clubName(a.club_id) + ")")}`, a.location ? `LOCATION:${icsText(a.location)}` : "",
    `DESCRIPTION:${icsText(a.body)}`, "END:VEVENT", "END:VCALENDAR"].filter(Boolean).map(fold).join("\r\n");
  const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  const link = document.createElement("a");
  link.href = url; link.download = (a.title.replace(/[^\w\- ]+/g, "").trim().slice(0, 40) || "event") + ".ics";
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function googleCalUrl(a) {
  const [s, e] = eventTimes(a);
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({
    action: "TEMPLATE", text: a.title + " (" + clubName(a.club_id) + ")", dates: icsDate(s) + "/" + icsDate(e),
    details: a.body || "", location: a.location || "" }).toString();
}
const calButtons = (a) => `<div class="row">
    <button class="btn ghost small" data-act="ics" data-id="${a.id}">Add to Apple / Outlook calendar</button>
    <a class="btn ghost small" href="${esc(googleCalUrl(a))}" target="_blank" rel="noopener">Add to Google Calendar</a>
  </div>`;
function signupBlock(a, onPage = false) {
  if (!S.v3 || !a.signups_open || !a.event_start) return "";
  const started = new Date(a.event_start) <= new Date();
  if (S.signups.has(a.id)) {
    if (!onPage) return `<div class="row"><span class="chip mark">Signed up</span></div>`;
    return `<div class="row"><span class="chip mark">Signed up</span>
        ${started ? "" : `<button class="btn quiet small" data-act="ask-unsign" data-id="${a.id}">Cancel sign-up</button>`}</div>
      ${started ? "" : calButtons(a)}`;
  }
  if (started) return `<p class="meta">Sign-ups have closed.</p>`;
  return onPage ? `<button class="btn wide" data-act="ask-sign" data-id="${a.id}">Sign up</button>`
    : `<button class="btn small" style="align-self:flex-start" data-act="open-post" data-id="${a.id}">Sign up</button>`;
}
function noticeHtml(a) {
  const member = activeIds().includes(a.club_id) || isCommittee(a.club_id);
  return `<article class="card notice tap" data-act="open-post" data-id="${a.id}">
    <div class="row between">${clubChip(a.club_id)}<span class="meta">${when(a.created_at)}</span></div>
    <h3><button class="titlelink" data-act="open-post" data-id="${a.id}">${esc(a.title)}</button></h3>
    ${eventLine(a)}
    <p class="body">${esc(a.body)}</p>
    ${!member && (a.audience_all || (a.audience_schools || []).length) ? `<p class="meta">${esc(audienceText(a))}</p>` : ""}
    ${signupBlock(a)}
  </article>`;
}

const activeIds = () => [...S.mine.values()].filter((r) => r.status === "active").map((r) => r.club_id);
const isCommittee = (id) => S.committee.some((c) => c.club_id === id);

// Options for one Major or Minor dropdown of a school.
function courseOptions(kind, school, current, forceOther = false) {
  const c = CONFIG.COURSES[school] || {};
  const list = (kind.startsWith("minor") ? (c.minors || c.majors) : c.majors) || [];
  const isOther = forceOther || (!!current && !list.includes(current));
  const first = kind === "major" ? "Not decided yet" : kind === "minor" ? "- (no minor)" : "- (none)";
  return { isOther, html: `<option value="">${first}</option>`
    + list.map((o) => `<option ${current === o ? "selected" : ""}>${esc(o)}</option>`).join("")
    + `<option value="${OTHER}" ${isOther ? "selected" : ""}>Other (type it in)</option>` };
}
const COURSE_FIELDS = [
  ["major", "Major or course", 'Choose your school first. Year 1 students can leave this as "Not decided yet".', "Type your major"],
  ["major2", "Second major", "Only if you are doing a double major.", "Type your second major"],
  ["minor", "Minor", 'Not everyone has one. Choose "-" if you don\'t.', "Type your minor"],
  ["minor2", "Second minor", "Only if you have two minors.", "Type your second minor"]
];
const courseKinds = () => COURSE_FIELDS.map((f) => f[0]).filter((k) => S.v3 || !k.endsWith("2"));
function profileFields(d, withPhoneNote = true) {
  const yr = Number(d.year) || 0;
  const school = d.school || "";
  const cur = (k) => (d[k] === OTHER ? (d[k + "_other"] || "").trim() : d[k]) || "";
  const courses = COURSE_FIELDS.filter(([k]) => courseKinds().includes(k)).map(([k, label, hint, otherLabel]) => {
    const o = courseOptions(k, school, cur(k), d[k] === OTHER);
    return `<label>${label} <small>${esc(hint)}</small>
        <select name="${k}" id="f-${k}">${o.html}</select>
      </label>
      <label id="f-${k}-other-wrap" ${o.isOther ? "" : "hidden"}>${otherLabel}
        <input name="${k}_other" id="f-${k}-other" value="${o.isOther ? esc(cur(k)) : ""}" autocomplete="off">
      </label>`;
  }).join("");
  return `
    <div class="two">
      <label>Year
        <select name="year" id="f-year" required>
          <option value="">Choose</option>
          ${[1, 2, 3, 4, 5].map((y) => `<option value="${y}" ${yr === y ? "selected" : ""}>Year ${y}</option>`).join("")}
        </select>
      </label>
      <label>School
        <select name="school" id="f-school" required>
          <option value="">Choose</option>
          ${CONFIG.SCHOOLS.map((s) => `<option ${school === s ? "selected" : ""}>${esc(s)}</option>`).join("")}
          ${school && !CONFIG.SCHOOLS.includes(school) ? `<option selected>${esc(school)}</option>` : ""}
        </select>
      </label>
    </div>
    ${courses}
    <label>Phone number <small>Optional. ${withPhoneNote ? "Shared only with the committees of clubs you join." : ""}</small>
      <input name="phone" id="f-phone" type="tel" value="${esc(d.phone ?? "")}" placeholder="e.g. 012-345 6789" autocomplete="tel">
    </label>`;
}

          <p class="meta">${st === "active" && m.paid_amount != null
            ? `Paid ${money(m.paid_amount)}${m.checked_at ? " · approved " + day(m.checked_at) : ""}${m.pay_ref ? " · ref " + esc(m.pay_ref) : ""}`
            : fee ? "Membership fee " + money(fee) : "Free to join"}</p>
          ${!st && !canTakePayment(c) ? `<p class="meta">Joining opens once the club adds its payment details.</p>` : ""}
          ${st === "pending" ? `<p class="note">Your payment screenshot is with the committee. You become a member once they have checked it.${m.pay_ref ? " Your reference is " + esc(m.pay_ref) + "." : ""}</p>` : ""}
          ${st === "rejected" ? `<div class="error">Your payment was not accepted${m.reject_reason ? ": " + esc(m.reject_reason) : "."}</div>` : ""}
          <div class="row">
            ${buttons}
            ${isCommittee(c.id) ? `<button class="btn ghost small" data-act="manage" data-club="${c.id}">Manage</button>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`).join("");
}

function viewPay() {
  const p = S.pay;
  const c = S.clubs.find((x) => x.id === p.clubId);
  const row = my(c.id);
  const hasBank = !!c.pay_account_number, hasQr = !!c.pay_qr_path;
  const head = `<button class="link" style="align-self:flex-start" data-act="pay-back">Back to clubs</button>
    <div class="stack"><h1>Join ${esc(c.name)}</h1>
      <p class="lead">Pay the membership fee in your banking app, then upload a screenshot. You become a member once the committee has checked it.</p></div>`;
  if (!hasBank && !hasQr) {
    return `${head}<div class="error" role="alert">This club hasn't added its payment details yet. Ask the committee to add them, then try again.</div>`;

  return `${head}
    ${row && row.status === "rejected" && row.reject_reason ? `<div class="error">Last time: ${esc(row.reject_reason)}</div>` : ""}
    <div class="card"><span class="meta">Membership fee</span><div class="amount">${money(c.fee)}</div></div>
    <div class="card"><span class="meta">Payment reference</span>
      ${p.ref ? `<div class="ref" id="pay-ref">${esc(p.ref)}</div>
          <p class="meta">Type this in the reference box of your transfer. The club uses it to find your payment in its bank account.</p>
          <button class="btn ghost small" style="align-self:flex-start" data-act="copy" data-text="${esc(p.ref)}">Copy reference</button>`
        : p.refLoading ? `<p class="meta">Loading…</p>`
        : `<p>Put your student ID (${esc(S.profile.student_id)}) in the reference box of your transfer so the club can match it.</p>`}
    </div>
    ${hasQr ? `<div class="card"><h3>Scan to pay</h3>
      ${p.qrUrl ? `<img class="qr" src="${p.qrUrl}" alt="Payment QR code for ${esc(c.name)}">`
        : `<p class="meta">${p.qrFailed ? "The QR code couldn't be loaded. Use the bank details or ask the committee." : "Loading QR code…"}</p>`}
    </div>` : ""}
    ${hasBank ? `<div class="card"><h3>${hasQr ? "Or transfer to" : "Transfer to"}</h3>
      <dl><dt>Bank</dt><dd>${esc(c.pay_bank || "")}</dd>
        <dt>Account name</dt><dd>${esc(c.pay_account_name || "")}</dd>
        <dt>Account number</dt><dd style="font-variant-numeric:tabular-nums">${esc(c.pay_account_number)}</dd></dl>
      <button class="btn ghost small" style="align-self:flex-start" data-act="copy" data-text="${esc(c.pay_account_number)}">Copy account number</button>
    </div>` : ""}
    ${c.pay_note ? `<p class="note">${esc(c.pay_note)}</p>` : ""}
    <form data-form="pay" novalidate>
      <label>Payment screenshot <small>The page your bank shows after the transfer goes through.</small>
        <input type="file" id="pay-file" accept="image/*"></label>
      <div id="pay-preview" class="stack">${p.preview ? `<img class="shot" src="${p.preview}" alt="Your payment screenshot">` : ""}</div>
      <div id="pay-error">${p.error ? `<div class="error" role="alert">${esc(p.error)}</div>` : ""}</div>
      <p class="note">The club's committee will see this screenshot and your name, student ID, year, school, major, minor, email and phone number.</p>
      <button class="btn wide">Send for checking</button>
    </form>`;
}

function calendarHtml() {
  const now = new Date();
  const first = CONFIG.CALENDAR_FIRST_YEAR, last = CONFIG.CALENDAR_LAST_YEAR;
  const m = S.calMonth || new Date(now.getFullYear(), now.getMonth(), 1);
  const key = (d) => d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
  const byDay = {};
  for (const a of S.myEvents) (byDay[key(new Date(a.event_start))] ||= []).push(a);
  const sel = S.calDay;
  const gridStart = new Date(m.getFullYear(), m.getMonth(), 1 - new Date(m.getFullYear(), m.getMonth(), 1).getDay());  // the Sunday on or before the 1st
  const shownClubs = new Set();
  let cells = ["S", "M", "T", "W", "T", "F", "S"].map((d) => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const date = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const inMonth = date.getMonth() === m.getMonth();
    const evs = inMonth ? (byDay[key(date)] || []) : [];
    evs.forEach((a) => shownClubs.add(a.club_id));
    const dots = evs.slice(0, 3).map((a) => `<i style="background:${clubColour(a.club_id)}" title="${esc(clubName(a.club_id))}"></i>`).join("") + (evs.length > 3 ? "<b>+</b>" : "");
    const cls = ["day", inMonth ? "" : "out", key(date) === key(now) ? "today" : "", inMonth && sel && key(sel) === key(date) ? "sel" : ""].join(" ").replace(/\s+/g, " ").trim();
    const label = date.toLocaleDateString("en-MY", { day: "numeric", month: "long" }) + (evs.length ? ", " + evs.map((a) => clubName(a.club_id)).join(", ") : "");
    cells += inMonth
      ? `<button class="${cls}" data-act="cal-day" data-day="${date.getDate()}" aria-label="${esc(label)}"><span class="n">${date.getDate()}</span><span class="dots">${dots}</span></button>`
      : `<div class="${cls}" aria-hidden="true"><span class="n">${date.getDate()}</span><span class="dots"></span></div>`;
  }
  const months = Array.from({ length: 12 }, (_, i) => `<option value="${i}" ${i === m.getMonth() ? "selected" : ""}>${new Date(2000, i, 1).toLocaleDateString("en-MY", { month: "long" })}</option>`).join("");
  const years = Array.from({ length: last - first + 1 }, (_, i) => first + i).map((y) => `<option ${y === m.getFullYear() ? "selected" : ""}>${y}</option>`).join("");
  const atStart = m.getFullYear() <= first && m.getMonth() === 0, atEnd = m.getFullYear() >= last && m.getMonth() === 11;
  const thisMonth = m.getFullYear() === now.getFullYear() && m.getMonth() === now.getMonth();
  const legend = [...shownClubs].map(clubChip).join(" ");

  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const list = sel ? (byDay[key(sel)] || []) : S.myEvents.filter((a) => new Date(a.event_end || a.event_start) >= startToday);
  const item = (a) => {
    const past = new Date(a.event_start) <= now;
    return `<div class="card">
      <div class="row between">${clubChip(a.club_id)}${past ? `<span class="meta">Past</span>` : ""}</div>
      <h3><button class="titlelink" data-act="open-post" data-id="${a.id}">${esc(a.title)}</button></h3>
      ${eventLine(a)}
      ${past ? "" : calButtons(a) + `<button class="btn quiet small" style="align-self:flex-start" data-act="ask-unsign" data-id="${a.id}">Cancel sign-up</button>`}
    </div>`;
  };
  const empty = !S.myEvents.length
    ? `<p class="meta">Events you sign up for appear here, marked with a dot in each club's colour. Tap an announcement and press Sign up.</p>`
    : sel ? `<p class="meta">No events on this day.</p>` : `<p class="meta">Nothing coming up. Past events stay marked on the calendar.</p>`;
  return `<div class="row between"><h2 id="h-cal">My calendar</h2>${thisMonth ? "" : `<button class="btn quiet small" data-act="cal-today">Today</button>`}</div>
    <div class="card">
      <div class="cal-head">
        <button class="btn quiet small" data-act="cal-move" data-step="-1" aria-label="Previous month" ${atStart ? "disabled" : ""}>‹</button>
        <select id="cal-m" aria-label="Month">${months}</select>
        <select id="cal-y" aria-label="Year">${years}</select>
        <button class="btn quiet small" data-act="cal-move" data-step="1" aria-label="Next month" ${atEnd ? "disabled" : ""}>›</button>
      </div>
      <div class="cal">${cells}</div>
      ${legend ? `<div class="row">${legend}</div>` : ""}
    </div>
    <div class="row between"><h3>${sel ? sel.toLocaleDateString("en-MY", { weekday: "long", day: "numeric", month: "long" }) : "Coming up"}</h3>
      ${sel ? `<button class="link" data-act="cal-all">Show all coming up</button>` : ""}</div>
    <div class="stack">${list.length ? list.map(item).join("") : empty}</div>`;
}

function viewManage() {
  const mine = S.committee.map((c) => c.club_id);
  const id = S.manage.clubId;
  if (id == null) {
    return `<h1>Manage</h1><p class="lead">Clubs where you are on the committee.</p>
      <div class="stack">${mine.map((cid) => `<button class="card" style="text-align:left;cursor:pointer" data-act="manage" data-club="${cid}">
        <h3>${esc(clubName(cid))}</h3><span class="meta">${esc((S.committee.find((c) => c.club_id === cid) || {}).role || "Committee")}${S.toCheck[cid] ? ` · ${S.toCheck[cid]} payment${S.toCheck[cid] === 1 ? "" : "s"} to check` : ""}</span>
      </button>`).join("")}</div>`;
  }
  const m = S.manage;
  const club = S.clubs.find((c) => c.id === id) || {};
  const fee = Number(club.fee) || 0;
  const canPost = isCommittee(id);
  const canEdit = canPost || S.isAdmin;
  const back = mine.length > 1 || !canPost;
  const pending = (m.members || []).filter((r) => r.status === "pending");
  const active = (m.members || []).filter((r) => r.status === "active");
  const full = (s) => esc(s.first_name) + " " + esc(s.last_name);

  const payments = m.members === null || (!pending.length && !fee) ? "" : `<div class="stack">
      <h2>Payments to check (${pending.length})</h2>
      ${pending.length ? `<p class="meta">Before approving, find each reference and amount in the club's bank account. A screenshot on its own can be edited.</p>` : ""}
      ${pending.length ? pending.map((r) => `<div class="card">
        <div class="row between"><h3 class="grow">${full(r.students)}</h3><span class="price">${money(r.paid_amount || 0)}</span></div>
        <p class="meta">Student ID ${esc(r.students.student_id)} · sent ${when(r.submitted_at || r.joined_at)}</p>
        ${r.pay_ref ? `<p>Reference <strong style="font-family:ui-monospace,Menlo,Consolas,monospace">${esc(r.pay_ref)}</strong></p>` : ""}
        <div class="row">
          <button class="btn quiet small" data-act="view-receipt" data-student="${esc(r.student_id)}">View screenshot</button>
          ${canEdit ? `<button class="btn small" data-act="approve" data-student="${esc(r.student_id)}">Approve</button>
          <button class="btn danger small" data-act="ask-reject" data-student="${esc(r.student_id)}">Not accepted</button>` : ""}
        </div>
      </div>`).join("") : `<p class="meta">Nothing waiting. New payments appear here as students send them.</p>`}
    </div>`;

  const members = m.members === null ? `<div class="meta">Loading members…</div>` : !active.length
    ? `<div class="empty"><p>${fee ? "No members yet. Students appear here once their payment is approved." : "No members yet. Students appear here as soon as they tap Join."}</p></div>`
    : `<div class="scroll"><table>
        <thead><tr><th>Name</th><th>Student ID</th><th>Year</th><th>School</th><th>Major</th><th>Minor</th><th>Email</th><th>Phone</th><th>Joined</th><th>Paid</th><th>Reference</th></tr></thead>
        <tbody>${active.map((r) => { const s = r.students; return `<tr>
          <td>${full(s)}</td><td class="num">${esc(s.student_id)}</td><td class="num">${esc(s.year)}</td>
          <td>${esc(s.school)}</td><td>${esc([s.major, s.major2].filter(Boolean).join(" / "))}</td><td>${esc([s.minor, s.minor2].filter(Boolean).join(" / "))}</td>
          <td>${esc(s.email)}</td><td class="num">${esc(s.phone || "")}</td><td>${day(r.joined_at)}</td>
          <td class="num">${r.paid_amount != null ? money(r.paid_amount) : ""}</td><td class="num">${esc(r.pay_ref || "")}</td></tr>`; }).join("")}
        </tbody></table></div>`;

  const posts = m.posts === null ? "" : !m.posts.length ? `<p class="meta">Nothing posted yet.</p>`
    : m.posts.map((a) => {
        const n = m.counts[a.id] || 0, list = m.signupLists[a.id];
        return `<div class="card">
        <div class="row between"><h3 class="grow">${esc(a.title)}</h3><span class="meta">${when(a.created_at)}</span></div>
        ${eventLine(a)}
        <p class="meta" style="white-space:pre-wrap">${esc(a.body)}</p>
        ${S.v3 ? `<p class="meta"><strong>Who can see it:</strong> ${esc(audienceText(a))}</p>` : ""}
        ${a.signups_open ? `<div class="row"><strong>${n} signed up</strong>
          ${n ? `<button class="btn ghost small" data-act="${list ? "hide-signups" : "show-signups"}" data-id="${a.id}">${list ? "Hide list" : "See who"}</button>` : ""}</div>` : ""}
        ${list ? signupTable(a.id, list) : ""}
        ${canEdit ? `<div class="row"><button class="btn danger small" data-act="ask-delete-post" data-id="${a.id}">Delete</button></div>` : ""}
      </div>`; }).join("");

  const colourForm = !canEdit || m.members === null || !("color" in club) ? "" : `<div class="stack">
      <h2>Club colour</h2>
      <div class="card">
        <p class="meta">Shown on students' calendars and on your posts, so they can tell clubs apart.</p>
        <div class="swatches">${CONFIG.CLUB_COLOURS.map(([hex, name]) => `<button class="sw ${clubColour(id).toLowerCase() === hex.toLowerCase() ? "on" : ""}"
          style="--c:${hex}" data-act="set-colour" data-colour="${hex}" aria-label="${name}" title="${name}"></button>`).join("")}</div>
      </div>
    </div>`;
  const qrShown = m.qrPreview || m.qrUrl;
  const feeForm = !canEdit || m.members === null ? "" : `<div class="stack">
      <h2>Membership fee</h2>
      <form data-form="club-fee" novalidate class="card">
        <label>Fee in RM <small>What a student pays to join. Use 0 only if joining is free.</small>
          <input name="fee" id="fee-amount" type="number" min="0" step="0.01" inputmode="decimal" value="${fee}"></label>
        <label>Payment QR code <small>A screenshot of the club's DuitNow QR.</small>
          <input type="file" id="qr-file" accept="image/*"></label>
        <div id="qr-preview" class="stack">${qrShown ? `<img class="qr" src="${qrShown}" alt="The club's payment QR code">` : ""}</div>
        <label>Bank<input name="pay_bank" id="fee-bank" value="${esc(club.pay_bank || "")}" placeholder="e.g. Maybank" autocomplete="off"></label>
        <label>Account name<input name="pay_account_name" id="fee-name" value="${esc(club.pay_account_name || "")}" autocomplete="off"></label>
        <label>Account number<input name="pay_account_number" id="fee-number" value="${esc(club.pay_account_number || "")}" inputmode="numeric" autocomplete="off"></label>
        <label>Note to students <small>Optional.</small>
          <input name="pay_note" id="fee-note" value="${esc(club.pay_note || "")}" placeholder="e.g. Covers the whole academic year." autocomplete="off"></label>
        <div id="fee-error">${m.feeError ? `<div class="error" role="alert">${esc(m.feeError)}</div>` : ""}</div>
        <button class="btn" style="align-self:flex-start">Save fee details</button>
      </form>
    </div>`;

  return `
    ${back ? `<button class="link" style="align-self:flex-start" data-act="${canPost ? "manage-back" : "tab"}" data-tab="admin">Back</button>` : ""}
    <div class="stack"><h1>${esc(clubName(id))}</h1><p class="lead">${canPost ? "Your members, payments and announcements." : "Members, payments and announcements."}</p></div>
    ${m.error ? `<div class="error" role="alert">${esc(m.error)}</div>` : ""}
    ${payments}
    <div class="stack">
      <div class="row between"><h2>Members${m.members ? ` (${active.length})` : ""}</h2>
        ${active.length ? `<button class="btn ghost small" data-act="copy-members">Copy for Google Sheets</button>` : ""}</div>
      ${members}
    </div>
    ${m.members !== null && (canPost || (S.isAdmin && S.v3)) ? postFormHtml() : ""}
    <div class="stack"><h2>Posted</h2>${posts}</div>
    ${colourForm}
    ${feeForm}`;
}

function signupTable(id, list) {
  if (!list.length) return `<p class="meta">Nobody has signed up yet.</p>`;
  return `<div class="scroll"><table>
      <thead><tr><th>Name</th><th>Student ID</th><th>Year</th><th>School</th><th>Email</th><th>Phone</th><th>Signed up</th></tr></thead>
      <tbody>${list.map((r) => { const s = r.students || {}; return `<tr><td>${esc(s.first_name)} ${esc(s.last_name)}</td>
        <td class="num">${esc(s.student_id)}</td><td class="num">${esc(s.year)}</td><td>${esc(s.school)}</td><td>${esc(s.email)}</td>
        <td class="num">${esc(s.phone || "")}</td><td>${day(r.signed_up_at)}</td></tr>`; }).join("")}</tbody></table></div>
    <button class="btn ghost small" style="align-self:flex-start" data-act="copy-signups" data-id="${id}">Copy for Google Sheets</button>`;

        <p class="meta">Or also students in these schools:</p>

      </fieldset>` : ""}

function viewAdmin() {
  const a = S.admin;
  if (!a.loaded) return `<h1>Admin</h1><div class="meta">Loading…</div>`;
  const clubs = S.clubs.map((c) => {
    const com = a.committee.filter((k) => k.club_id === c.id);
    const open = a.open === c.id;
    const n = a.counts[c.id] || { active: 0, pending: 0 };
    return `<div class="card">
      <div class="row between">
        <h3 class="grow">${esc(c.name)}</h3>

        ${canTakePayment(c) ? "" : `<span class="chip bad">Needs payment details</span>`}

      <p class="meta">${esc(c.category || "No category")} · ${Number(c.fee) ? money(c.fee) : "Free"} · ${n.active} member${n.active === 1 ? "" : "s"}${n.pending ? ` · ${n.pending} to check` : ""} · ${com.length} on committee</p>
      <div class="row">
        <button class="btn ghost small" data-act="admin-open" data-club="${c.id}">${open ? "Close" : "Committee"}</button>

        <button class="btn quiet small" data-act="toggle-club" data-club="${c.id}">${c.is_active ? "Hide" : "Show"}</button>
      </div>
      ${open ? `<div class="stack" style="border-top:1px solid var(--line);padding-top:12px">
        ${com.length ? com.map((k) => `<div class="row between">
            <div class="grow"><strong>${esc(k.students ? k.students.first_name + " " + k.students.last_name : "Student")}</strong>
              <div class="meta">${esc(k.role || "Committee")}${k.students ? " · " + esc(k.students.email) : ""}</div></div>

      <p class="lead">${a.students ?? "–"} student${a.students === 1 ? "" : "s"} signed up · ${S.clubs.length} club${S.clubs.length === 1 ? "" : "s"}</p></div>
    ${a.error ? `<div class="error" role="alert">${esc(a.error)}</div>` : ""}

function viewSheet() {
  const s = S.sheet;
  if (!s) return "";
  const err = s.error ? `<div class="error" role="alert">${esc(s.error)}</div>` : "";
  let body = "", close = "Cancel";
  if (s.type === "join") {
    body = `<h2>Join ${esc(clubName(s.clubId))}?</h2>
      <p class="note">The club's committee will see your name, student ID, year, school, major, minor, email and phone number.</p>
      ${err}
      <button class="btn wide" data-act="join" data-club="${s.clubId}">Join club</button>`;
  } else if (s.type === "leave") {
    const st = (my(s.clubId) || {}).status;
    body = st === "pending" ? `<h2>Cancel your request to join ${esc(clubName(s.clubId))}?</h2>
        <p class="lead">If you have already paid, ask the club's committee about a refund.</p>
        ${err}<button class="btn danger wide" data-act="leave" data-club="${s.clubId}">Cancel request</button>`
      : st === "rejected" ? `<h2>Remove ${esc(clubName(s.clubId))} from your clubs?</h2>
        <p class="lead">You can join again later.</p>
        ${err}<button class="btn danger wide" data-act="leave" data-club="${s.clubId}">Remove</button>`
      : `<h2>Leave ${esc(clubName(s.clubId))}?</h2>
        <p class="lead">You'll stop getting its announcements and the committee will no longer see your details.${Number((S.clubs.find((c) => c.id === s.clubId) || {}).fee) ? " Joining again means paying the fee again." : ""}</p>
        ${err}<button class="btn danger wide" data-act="leave" data-club="${s.clubId}">Leave club</button>`;
    if (st === "pending") close = "Keep my request";
  } else if (s.type === "delete-post") {
    body = `<h2>Delete this announcement?</h2>
      <p class="lead">Members will no longer see it.</p>
      ${err}
      <button class="btn danger wide" data-act="delete-post" data-id="${s.id}">Delete</button>`;
  } else if (s.type === "sign" || s.type === "unsign") {
    const a = findPost(s.id) || { title: "this event", club_id: 0 };
    body = s.type === "sign" ? `<h2>Sign up for ${esc(a.title)}?</h2>
        ${a.event_start ? `<p class="when">${esc(eventWhen(a))}${a.location ? " · " + esc(a.location) : ""}</p>` : ""}
        <p class="note">It goes into your calendar. ${esc(clubName(a.club_id))}'s committee will see your name, student ID, year, school, major, minor, email and phone number.</p>
        ${err}<button class="btn wide" data-act="sign" data-id="${s.id}">Sign up</button>`
      : `<h2>Cancel your sign-up for ${esc(a.title)}?</h2>
        <p class="lead">It will be removed from your calendar. You can sign up again while sign-ups are open.</p>
        ${err}<button class="btn danger wide" data-act="unsign" data-id="${s.id}">Cancel sign-up</button>`;
    if (s.type === "unsign") close = "Keep it";
  } else if (s.type === "receipt") {
    close = "Close";
    body = `<h2>${esc(s.name)}</h2>
      ${s.url ? `<img class="shot" src="${s.url}" alt="Payment screenshot from ${esc(s.name)}">`
        : `<p class="meta">${s.failed ? "The screenshot couldn't be loaded." : "Loading screenshot…"}</p>`}`;
  } else if (s.type === "reject") {
    body = `<h2>Mark ${esc(s.name)}'s payment as not accepted?</h2>
      <form data-form="reject" data-student="${esc(s.student)}" novalidate>
        <label>Reason shown to the student
          <input name="reason" id="reject-reason" maxlength="200" placeholder="e.g. The amount was RM 10 short." autocomplete="off"></label>
        ${err}
        <button class="btn danger wide">Mark as not accepted</button>
      </form>`;
  }
  return `<div class="sheet-back" data-act="sheet-close"><div class="sheet" role="dialog" aria-modal="true">
    ${body}<button class="btn quiet wide" data-act="sheet-close">${close}</button></div></div>`;
}
function renderSheet() { overlay.innerHTML = viewSheet(); }

function render() {
  const brand = `<span class="brand"><i></i>${esc(CONFIG.APP_NAME)}</span>`;
  if (S.phase === "loading") { app.innerHTML = `<header class="topbar">${brand}</header><div class="center">Loading…</div>`; overlay.innerHTML = ""; return; }
  if (S.phase === "fatal") {
    app.innerHTML = `<header class="topbar">${brand}</header><main><h1>Something went wrong</h1>
      <div class="error" role="alert">${esc(S.fatal)}</div>
      <button class="btn wide" data-act="reload">Try again</button>
      ${S.user ? `<button class="btn quiet wide" data-act="logout">Log out</button>` : ""}</main>`;
    overlay.innerHTML = ""; return;
  }
  if (S.phase === "auth") { app.innerHTML = `<header class="topbar">${brand}</header>${viewAuth()}`; overlay.innerHTML = ""; return; }
  if (S.phase === "profile") { app.innerHTML = `<header class="topbar">${brand}</header>${viewProfileSetup()}`; overlay.innerHTML = ""; return; }

  const tabs = [["home", "Home"], ["clubs", "Clubs"]];
  const waiting = Object.values(S.toCheck).reduce((a, b) => a + b, 0);
  if (S.committee.length) tabs.push(["manage", waiting ? `Manage (${waiting})` : "Manage"]);
  if (S.isAdmin) tabs.push(["admin", "Admin"]);
  tabs.push(["profile", "Profile"]);
  const view = { home: S.post ? viewPost : viewHome, clubs: S.pay ? viewPay : viewClubs, manage: viewManage, admin: viewAdmin, profile: viewProfile }[S.tab]();
  app.innerHTML = `<header class="topbar">${brand}<span class="who">${esc(S.profile.email)}</span></header>
    <main>${view}</main>
    <nav class="tabs${tabs.length > 5 ? " many" : ""}" aria-label="Sections"><div>${tabs.map(([k, l]) =>
      `<button data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${l}</button>`).join("")}</div></nav>`;
  overlay.innerHTML = viewSheet();
}

   Actions
   --------------------------------------------------------------------- */
async function busy(btn, fn) {
  const label = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "Working…"; }
  try { await fn(); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}
async function openPay(clubId) {
  const c = S.clubs.find((x) => x.id === clubId);
  const pay = { clubId, file: null, preview: "", error: "", qrUrl: "", qrFailed: false, ref: "", refLoading: true };
  S.pay = pay; S.sheet = null; render(); window.scrollTo(0, 0);
  const show = () => { if (S.pay === pay) render(); };
  const getRef = sb.rpc("payment_reference", { club: clubId })
    .then((r) => { pay.ref = (!r.error && typeof r.data === "string" && r.data) || ""; }, () => {})
    .then(() => { pay.refLoading = false; show(); });
  const getQr = !c.pay_qr_path ? null
    : imageUrl("club-qr", c.pay_qr_path).then((url) => { pay.qrUrl = url; }, () => { pay.qrFailed = true; }).then(show);
  await Promise.all([getRef, getQr]);
}
function goTab(tab) {
  S.tab = tab; S.editing = false; S.formError = ""; S.pay = null; S.post = null;
  if (tab === "manage") {
    const mine = S.committee.map((c) => c.club_id);
    if (mine.length === 1) { loadManage(mine[0]); return; }
    S.manage = emptyManage();
  }
  if (tab === "admin") { render(); loadData().then(loadAdmin).catch((e) => toast(friendly(e))); return; }
  render(); window.scrollTo(0, 0);
  // Pick up anything that changed since the page was opened (new clubs, fees, announcements).
  if (tab === "home" || tab === "clubs") {
    loadData().then(() => {
      const typing = ["INPUT", "TEXTAREA", "SELECT"].includes((document.activeElement || {}).tagName);
      if (S.tab === tab && !S.sheet && !S.pay && !S.post && !typing) render();
    }).catch(() => {});
  }
}

const forms = {
  "login": async (f) => {
    S.draft = { email: f.email };
    if (!f.email || !f.password) { S.authError = "Enter your email and password."; render(); return; }
    const { error } = await sb.auth.signInWithPassword({ email: f.email.trim(), password: f.password });
    if (error) { S.authError = friendly(error); render(); }
  },
  "signup1": async (f) => {
    Object.assign(S.draft, f);
    const email = (f.email || "").trim().toLowerCase();
    let err = "";
    if (!f.first_name.trim() || !f.last_name.trim()) err = "Enter your first and last name.";
    else if (!f.student_id.trim()) err = "Enter your Monash student ID.";
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) err = "Enter a valid email address.";
    else if (CONFIG.ALLOWED_EMAIL_ENDINGS.length && !CONFIG.ALLOWED_EMAIL_ENDINGS.some((e) => email.endsWith(e.toLowerCase())))
      err = "Use your student email (" + CONFIG.ALLOWED_EMAIL_ENDINGS.join(" or ") + ").";
    else if ((f.password || "").length < 8) err = "Choose a password with at least 8 characters.";
    S.authError = err; if (!err) S.authView = "signup2";
    render();
  },
  "signup2": async (f) => {
    Object.assign(S.draft, f);
    const row = profileRow(S.draft);
    const err = checkProfile(row);
    if (err) { S.authError = err; render(); return; }
    const email = S.draft.email.trim().toLowerCase();
    const opts = { data: row };
    if (/^https?:$/.test(location.protocol)) opts.emailRedirectTo = location.origin + location.pathname;
    const { data, error } = await sb.auth.signUp({ email, password: S.draft.password, options: opts });
    if (error) { S.authError = friendly(error); render(); return; }
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      S.authError = "An account with this email already exists. Log in instead."; S.authView = "login"; S.draft = { email }; render(); return;
    }
    if (!data.session) { S.pendingEmail = email; S.authView = "check"; S.authError = ""; S.draft = { email }; render(); }
  },
  "profile-create": async (f) => {
    const row = profileRow(f); S.draft = row;
    const err = checkProfile(row);
    if (err) { S.formError = err; render(); return; }
    const { data, error } = await sb.from("students").insert({ id: S.user.id, email: S.user.email, ...dbRow(row) }).select().single();
    if (error) { S.formError = friendly(error); render(); return; }
    S.profile = data; S.formError = ""; S.draft = {};
    await loadData(); S.phase = "main"; render(); toast("Profile saved");
  },
  "profile-update": async (f) => {
    const row = profileRow(f);
    const err = checkProfile(row);
    if (err) { S.formError = err; S.editDraft = f; render(); return; }
    const { data, error } = await sb.from("students").update(dbRow(row)).eq("id", S.user.id).select().single();
    if (error) { S.formError = friendly(error); S.editDraft = f; render(); return; }
    S.profile = data; S.editing = false; S.editDraft = null; S.formError = ""; render(); toast("Details updated");
  },
  "post": async (f, form) => {
    if (form.querySelector("#a-club") && !f.club_id) { toast("Choose which club this is for."); return; }
    if (!f.title.trim() || !f.body.trim()) { toast("Write a title and a message."); return; }
    const clubId = f.club_id ? Number(f.club_id) : S.manage.clubId;
    const row = { club_id: clubId, author_id: S.user.id, title: f.title.trim(), body: f.body.trim() };
    if (S.v3) {
      row.audience_all = !!f.aud_all;
      row.audience_schools = row.audience_all ? [] : [...form.querySelectorAll("input[name=aud_school]:checked")].map((b) => b.value);
      if (f.is_event) {
        if (!f.date || !f.start) { toast("Add the event's date and start time."); return; }
        const start = new Date(`${f.date}T${f.start}`), end = f.end ? new Date(`${f.date}T${f.end}`) : null;
        if (isNaN(start)) { toast("Check the event's date and start time."); return; }
        if (end && end < start) { toast("The end time is before the start time."); return; }
        Object.assign(row, { event_start: start.toISOString(), event_end: end ? end.toISOString() : null,
          location: (f.location || "").trim() || null, signups_open: !!f.signups });
      }
    }
    const { error } = await sb.from("announcements").insert(row);
    if (error) { toast(friendly(error)); return; }
    await loadData();
    if (S.tab === "admin") await loadAdmin(); else await loadManage(clubId);
    toast((row.audience_all ? "Posted to all students" : "Posted") + (S.tab === "admin" ? " for " + clubName(clubId) : ""));
  },
  "pay": async () => {
    const p = S.pay, clubId = p.clubId, uid = S.user.id;
    const fail = (msg) => { p.error = msg; if (S.pay === p) render(); };
    if (!p.file) return fail("Add your payment screenshot first.");
    const path = `${uid}/${clubId}-${Date.now()}.jpg`;
    const up = await sb.storage.from("receipts").upload(path, p.file, { contentType: "image/jpeg" });
    if (up.error) return fail(friendly(up.error));
    if (my(clubId)) {                                   // trying again after a payment was not accepted
      const del = await sb.from("memberships").delete().eq("student_id", uid).eq("club_id", clubId);
      if (del.error) return fail(friendly(del.error));
    }
    const { error } = await sb.from("memberships").insert({ student_id: uid, club_id: clubId, receipt_path: path });
    if (error) { await loadData().catch(() => {}); return fail(friendly(error)); }
    S.pay = null; await loadData(); render(); window.scrollTo(0, 0); toast("Sent to the committee for checking");
  },
  "reject": async (f, form) => {
    const clubId = S.manage.clubId;
    const { error } = await sb.from("memberships").update({ status: "rejected", reject_reason: f.reason.trim() || null })
      .eq("club_id", clubId).eq("student_id", form.dataset.student);
    if (error) { S.sheet.error = friendly(error); renderSheet(); return; }
    S.sheet = null; await loadData(); await loadManage(clubId); toast("Marked as not accepted");
  },
  "club-fee": async (f) => {
    const clubId = S.manage.clubId;
    const club = S.clubs.find((c) => c.id === clubId);
    const fail = (msg) => { S.manage.feeError = msg; const el = document.getElementById("fee-error"); if (el) el.innerHTML = `<div class="error" role="alert">${esc(msg)}</div>`; };
    const fee = Math.round((Number(f.fee) || 0) * 100) / 100;
    const number = f.pay_account_number.trim(), bank = f.pay_bank.trim(), holder = f.pay_account_name.trim();
    if (fee < 0 || fee > 9999) return fail("Enter a fee between 0 and 9999.");
    if (number && (!bank || !holder)) return fail("Add the bank and the account name as well.");
    if (fee > 0 && !number && !S.manage.qrFile && !club.pay_qr_path) return fail("Add a QR code or a bank account so students can pay.");
    let qrPath = club.pay_qr_path || null;
    if (S.manage.qrFile) {
      const path = `${clubId}/qr-${Date.now()}.jpg`;
      const up = await sb.storage.from("club-qr").upload(path, S.manage.qrFile, { contentType: "image/jpeg" });
      if (up.error) return fail(friendly(up.error));
      qrPath = path;
    }
    const { error } = await sb.from("clubs").update({
      fee, pay_bank: bank || null, pay_account_name: holder || null, pay_account_number: number || null,
      pay_qr_path: qrPath, pay_note: f.pay_note.trim() || null
    }).eq("id", clubId);
    if (error) return fail(friendly(error));
    await loadData(); await loadManage(clubId); toast("Fee details saved");
  },
  "add-club": async (f) => {
    if (!f.name.trim()) { toast("Give the club a name."); return; }
    if (String(f.fee).trim() === "") { toast("Enter the membership fee. Type 0 only if the club is free."); return; }
    const fee = Math.round(Number(f.fee) * 100) / 100;
    if (!(fee >= 0) || fee > 9999) { toast("Enter a fee between 0 and 9999."); return; }
    const { error } = await sb.from("clubs").insert({ name: f.name.trim(), category: f.category.trim() || null, description: f.description.trim() || null, fee });
    if (error) { toast(friendly(error)); return; }
    await loadData(); await loadAdmin();
    toast(fee > 0 ? "Club added. Its committee now needs to add the payment details." : "Club added");
  },
  "add-committee": async (f, form) => {
    const who = (f.who || "").trim();
    if (!who) { toast("Enter the student's email or student ID."); return; }
    const q = sb.from("students").select("id, first_name");
    const { data, error } = await (who.includes("@") ? q.eq("email", who.toLowerCase()) : q.eq("student_id", who)).maybeSingle();
    if (error) { toast(friendly(error)); return; }
    if (!data) { toast("No student found. They need to sign up first."); return; }
    const ins = await sb.from("club_committee").insert({ club_id: Number(form.dataset.club), student_id: data.id, role: f.role.trim() || null });
    if (ins.error) { toast(friendly(ins.error)); return; }
    await loadData(); await loadAdmin(); toast(data.first_name + " added to committee");
  }
};

document.addEventListener("click", (e) => {
  if (e.target.closest("a[href]")) return;
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("sheet-back") && e.target !== el) return;   // clicks inside the sheet don't close it
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el.dataset, el.tagName === "BUTTON" ? el : null)).catch((err) => toast(friendly(err)));
});
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  const fn = forms[form.dataset.form];
  const values = Object.fromEntries(new FormData(form).entries());
  const btn = form.querySelector("button:not([type=button])");
  busy(btn, () => fn(values, form)).catch((err) => toast(friendly(err)));
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  const byId = (id) => document.getElementById(id);
  if (el.id === "f-school") {                       // a different school has different majors and minors
    for (const kind of courseKinds()) {
      byId("f-" + kind).innerHTML = courseOptions(kind, el.value, "").html;
      byId("f-" + kind + "-other-wrap").hidden = true;
      byId("f-" + kind + "-other").value = "";
    }
  }
  if (["f-major", "f-minor", "f-major2", "f-minor2"].includes(el.id)) {
    const wrap = byId(el.id + "-other-wrap");
    wrap.hidden = el.value !== OTHER;
    if (!wrap.hidden) byId(el.id + "-other").focus();
  }
  if (el.id === "cal-m" || el.id === "cal-y") {
    S.calMonth = new Date(Number(byId("cal-y").value), Number(byId("cal-m").value), 1); S.calDay = null; render();
  }
  if (el.id === "a-is-event") byId("a-event-fields").hidden = !el.checked;
  if (el.id === "a-aud-all") document.querySelectorAll("input[name=aud_school]").forEach((b) => { b.disabled = el.checked; if (el.checked) b.checked = false; });
  if (el.id === "pay-file" && S.pay) {
    const p = S.pay;
    try { p.file = await shrinkImage(el.files[0], 1400, 0.82); p.preview = URL.createObjectURL(p.file); p.error = ""; }
    catch (err) { p.file = null; p.preview = ""; p.error = friendly(err); }
    if (S.pay !== p) return;
    document.getElementById("pay-preview").innerHTML = p.preview ? `<img class="shot" src="${p.preview}" alt="Your payment screenshot">` : "";
    document.getElementById("pay-error").innerHTML = p.error ? `<div class="error" role="alert">${esc(p.error)}</div>` : "";
  }
  if (el.id === "qr-file") {
    const m = S.manage;
    try { m.qrFile = await shrinkImage(el.files[0], 1200, 0.92); m.qrPreview = URL.createObjectURL(m.qrFile); m.feeError = ""; }
    catch (err) { m.qrFile = null; m.qrPreview = ""; m.feeError = friendly(err); }
    if (S.manage !== m) return;
    const shown = m.qrPreview || m.qrUrl;
    document.getElementById("qr-preview").innerHTML = shown ? `<img class="qr" src="${shown}" alt="The club's payment QR code">` : "";
    document.getElementById("fee-error").innerHTML = m.feeError ? `<div class="error" role="alert">${esc(m.feeError)}</div>` : "";
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "club-search") return;
  S.clubSearch = e.target.value;
  document.getElementById("club-list").innerHTML = clubListHtml();
});

async function handleSession(session) {
  const uid = session && session.user ? session.user.id : null;
  if (uid === currentUid) return;
  currentUid = uid;
  const keepAuth = { authView: S.authView, draft: S.draft, pendingEmail: S.pendingEmail };
  reset();
  if (!uid) { Object.assign(S, keepAuth.authView === "check" ? keepAuth : {}, { phase: "auth" }); render(); return; }
  S.user = session.user; render();
  try { await loadAccount(); }
  catch (err) { S.phase = "fatal"; S.fatal = friendly(err); }
  if (currentUid === uid) render();
}

(function start() {
  if (!window.supabase) {
    S.phase = "fatal"; S.fatal = "The app couldn't load. Check your internet connection and reload the page."; render(); return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => handleSession(session), 0); });
  render();
})();
</script>
